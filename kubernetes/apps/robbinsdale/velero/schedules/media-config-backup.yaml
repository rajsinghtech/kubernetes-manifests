---
# Back up media *app config* PVCs only. Bulk media/downloads live on Ceph/SMB
# and rely on storage-layer durability — never opt those volumes in.
#
# IMPORTANT: defaultVolumesToFsBackup is false (opt-IN). Pods must set
# backup.velero.io/backup-volumes to the config volume name (usually `config`
# or `config-volume`). backup-volumes-excludes alone does NOT include anything
# under opt-in mode; that mismatch previously left every config PVC with
# schedule membership and zero PodVolumeBackups while the Backup still
# reported Completed.
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: media-config-backup
  namespace: velero-system
  annotations:
    # Velero copies Schedule annotations onto each generated Backup. Healthy
    # runs take 14-39 minutes; bound a wedged filesystem operation before it
    # overlaps the next maintenance window.
    velero.io/pod-volume-timeout: "1h"
  labels:
    keiretsu.top/volume-data-required: "true"
spec:
  # Run after the 06:00 Kometa jobs have completed and before the next
  # application-maintenance window.  The filesystem backup needs stable pod
  # mounts for the duration of the run.
  schedule: "0 7 * * *"
  template:
    ttl: 168h
    includedNamespaces:
      - media
    defaultVolumesToFsBackup: false
