---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: garage-operator-system-install
  namespace: flux-system
spec:
  targetNamespace: garage-operator-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: garage-operator-system-install
  path: ./kubernetes/apps/robbinsdale/garage-operator-system/garage-operator-system-install
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
