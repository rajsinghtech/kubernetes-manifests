---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: ceph-pools
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  resyncPeriod: "168h"
  folder: Ceph
  url: https://raw.githubusercontent.com/rook/rook/v1.20.7/deploy/examples/monitoring/grafana/Ceph%20Pools%20Dashboard.json
  contentCacheDuration: "1h"
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: mimir-local
