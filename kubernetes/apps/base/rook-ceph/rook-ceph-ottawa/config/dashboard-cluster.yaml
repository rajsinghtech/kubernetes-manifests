---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: ceph-cluster
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  resyncPeriod: "168h"
  folder: Ceph
  url: https://raw.githubusercontent.com/rook/rook/v1.20.7/deploy/examples/monitoring/grafana/Ceph%20Cluster%20Dashboard.json
