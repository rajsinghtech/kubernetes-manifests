---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
spec:
  interval: 30m
  chart:
    spec:
      chart: velero
      version: 12.1.0
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    image:
      repository: docker.io/velero/velero
      tag: v1.18.2

    # Flux commonMetadata owns app.kubernetes.io/name on the child objects.
    # Keep the pod and metrics Service discoverable through a stable component
    # label instead of relying on that shared name label.
    podLabels:
      app.kubernetes.io/component: server

    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.14.2
        volumeMounts:
          - mountPath: /target
            name: plugins

    credentials:
      # GarageKey supplies the AWS credential fields directly as environment
      # variables. Keep the Secret out of the chart's mounted cloud-credentials
      # file, which is only needed for file-based provider credentials.
      useSecret: false
      extraSecretRef: velero-credentials-rotation-2

    configuration:
      clientQPS: 100
      clientBurst: 200
      # Fail a wedged file-system data path within the upstream default window.
      # `podVolumeOperationTimeout` is an obsolete chart value and rendered no
      # server flag with chart 12.1.0.
      fsBackupTimeout: 4h
      backupStorageLocation:
        - name: garage
          provider: aws
          bucket: velero
          # Per-cluster prefix. Must sit beside `bucket` (it renders into
          # spec.objectStorage.prefix); under `config` Velero silently ignores
          # it and every cluster shares the bucket root — which means shared
          # kopia repos per namespace across clusters.
          prefix: "${LOCATION}"
          default: true
          config:
            region: garage
            s3Url: "http://${COMMON_S3_ENDPOINT}"
            s3ForcePathStyle: "true"
      volumeSnapshotLocation: []

    deployNodeAgent: true
    nodeAgent:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      uploaderType: kopia
      podVolumePath: /var/lib/kubelet/pods
      extraArgs:
        - --node-agent-configmap=node-agent-config
      resources:
        # Observed RSS on StP/Ottawa node-agents is ~38–66Mi. 256Mi left orin-0
        # with ~30Mi schedulable headroom after the apiserver right-size; 96Mi
        # keeps a buffer for backup spikes without starving Home Assistant.
        requests:
          cpu: 100m
          memory: 96Mi
        limits:
          cpu: 1
          memory: 1Gi

    metrics:
      enabled: true
      service:
        labels:
          app.kubernetes.io/component: metrics
