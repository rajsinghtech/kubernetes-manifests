---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
spec:
  interval: 30m
  chart:
    spec:
      chart: fluent-bit
      version: "0.58.2"
      sourceRef:
        kind: HelmRepository
        name: fluent
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    config:
      inputs: |
        [INPUT]
            Name              tail
            Path              /var/log/containers/*.log
            Exclude_Path      /var/log/containers/*fluent-bit*.log
            multiline.parser  docker, cri
            Tag               kube.*
            Refresh_Interval  10
            Mem_Buf_Limit     50MB
            Skip_Long_Lines   On

        [INPUT]
            Name        tcp
            Listen      0.0.0.0
            Port        5170
            Tag         talos.*
            Format      json
            Chunk_Size  32KB
            Buffer_Size 128KB
            # Talos JSON does not include a hostname. Fluent Bit 5.1.1's TCP
            # input records the peer address without changing collection or
            # applying a relabel/drop rule.
            Source_Address_Key node_address

      filters: |
        [FILTER]
            Name                kubernetes
            Match               kube.*
            Kube_URL            https://kubernetes.default.svc:443
            Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
            Merge_Log           On
            Keep_Log            On
            K8S-Logging.Parser  On
            K8S-Logging.Exclude On
            Labels              On
            Annotations         Off

        [FILTER]
            Name         nest
            Match        kube.*
            Operation    lift
            Nested_under kubernetes
            Add_prefix   kubernetes.

        # The nest filter keeps the existing kubernetes.* field names, but
        # those are literal dotted keys rather than a nested map. Copy the
        # metadata needed for stream labels to temporary root keys before the
        # Loki output reads them.
        [FILTER]
            Name         modify
            Match        kube.*
            Hard_copy    kubernetes.namespace_name __fluentbit_namespace
            Hard_copy    kubernetes.pod_name       __fluentbit_pod
            Hard_copy    kubernetes.container_name __fluentbit_container

        # Merge_Log puts structured application messages in `msg`. For a
        # record that could not be parsed, preserve its original `log` value
        # as the message instead of sending a record with no message field.
        [FILTER]
            Name         modify
            Match        kube.*
            Condition    Key_Does_Not_Exist msg
            Hard_copy    log msg

        # The output uses `msg` for every Kubernetes record; the raw input
        # field is no longer needed after the fallback above.
        [FILTER]
            Name         modify
            Match        kube.*
            Remove       log

        # Most Talos JSON records put their body in `msg`, but syslogd wraps
        # the original syslog body in `content`. Copy it only for syslogd so
        # the existing Loki output can select the right field without
        # re-emitting or dropping the original record.
        [FILTER]
            Name         modify
            Match        talos.*
            Condition    Key_Value_Equals talos-service syslogd
            Hard_copy    content msg

      outputs: |
        [OUTPUT]
            Name                   loki
            Match                  kube.*
            Host                   ${VICTORIA_LOGS_HOST}
            Port                   9428
            Uri                    /insert/loki/api/v1/push
            header                 VL-Msg-Field msg
            labels                 namespace=$__fluentbit_namespace, pod=$__fluentbit_pod, container=$__fluentbit_container, cluster=${CLUSTER_NAME}, job=fluent-bit
            label_keys             $stream
            remove_keys            kubernetes,stream,__fluentbit_namespace,__fluentbit_pod,__fluentbit_container
            auto_kubernetes_labels off
            line_format            json
            compress               gzip

        [OUTPUT]
            Name                   loki
            Match                  talos.*
            Host                   ${VICTORIA_LOGS_HOST}
            Port                   9428
            Uri                    /insert/loki/api/v1/push
            header                 VL-Msg-Field msg
            labels                 cluster=${CLUSTER_NAME}, job=talos
            label_keys             $talos-service,$node_address,$tag
            line_format            json
            compress               gzip
    extraPorts:
      - port: 5170
        containerPort: 5170
        protocol: TCP
        name: tcp-talos
    dashboards:
      enabled: true
    serviceMonitor:
      enabled: true
    priorityClassName: "infra-critical"

    tolerations:
      - operator: Exists

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
