# Static CLIProxy provider catalog, appended to the rendered config.yaml.
#
# CLIProxy has no runtime model discovery for openai-compatible providers,
# so the catalog has to come from config. It used to be built by three
# discover-* init containers that polled each upstream before the gateway
# was allowed to start, which made any single provider outage a full gateway
# outage: a cold St. Petersburg GPU held the pod in Init for ~8.5 minutes and
# then pinned a hardcoded route anyway. Declaring the routes here removes that
# failure domain -- CLIProxy boots in seconds regardless of upstream health,
# and completions to a down provider fail closed against the live upstream.
#
# Adding or removing a model upstream is a commit to this file. It is wired
# through a configMapGenerator, so editing it rolls the Deployment.
openai-compatibility:
  # ai and ai-kartik front the same catalog through two tailnet identities.
  # The anchor keeps the two lists from drifting apart.
  - name: "ai"
    prefix: "ai"
    base-url: "http://ai.keiretsu.ts.net/v1"
    disable-cooling: false
    headers:
      User-Agent: "Bhaiya-CLIProxy/1.0"
    models: &keiretsu_catalog
