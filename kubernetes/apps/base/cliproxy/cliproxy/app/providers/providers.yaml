  - name: "ai-kartik"
    prefix: "ai-kartik"
    base-url: "http://ai-kartik.keiretsu.ts.net/v1"
    disable-cooling: false
    headers:
      User-Agent: "Bhaiya-CLIProxy/1.0"
    models: *keiretsu_catalog
  # St. Petersburg GPU route. The alias is the ID Bhaiya pins as
  # BHAIYA_CLIPROXY_DEFAULT_MODEL (vllm/Qwen3.8-Flash-Next).
  - name: "vllm"
    prefix: "vllm"
    base-url: "http://stpetersburg-vllm-upstream/v1"
    disable-cooling: false
    models:
      - name: "Qwen3.8-Flash-Next-NVFP4"
        alias: "Qwen3.8-Flash-Next"
        # Qwen's OpenAI-compatible endpoint rejects high and accepts xhigh.
        # Make the client-visible effort contract explicit; CLIProxy's
        # omitted-value default is low/medium/high.
        thinking:
          levels:
            - "low"
            - "medium"
            - "xhigh"
