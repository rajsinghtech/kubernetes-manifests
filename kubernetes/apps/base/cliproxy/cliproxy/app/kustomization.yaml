---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cliproxy
resources:
  - namespace.yaml
  - secret.sops.yaml
  - pvc.yaml
  - logs-pvc.yaml
  - deployment.yaml
  - dashboard.yaml
  - service.yaml
  - service-ts.yaml
  - egress.yaml
  - httproute-ui.yaml
  - httproute-api.yaml
  - securitypolicy.yaml
  - tinyauth-redirect-lua.yaml

configMapGenerator:
  # Hash-suffixed on purpose: editing the catalog must roll the Deployment,
  # because render-config only reads it at pod start.
  - name: cliproxy-providers
    files:
      - providers.yaml=providers/providers.yaml
