---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cliproxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cliproxy
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes-excludes: logs
        # Re-run the one-shot catalog discovery only after the Qwen LWS is
        # healthy; a pod started during GPU warm-up must retain the safe
        # subscription fallback rather than advertising an unavailable route.
        keiretsu.top/restarted-for: qwen38-ready-v4
      labels:
        app.kubernetes.io/name: cliproxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-pi-bridge
          image: python:3.14-alpine@sha256:05b2b8b732ecd268fee8727a369f936f022d1321b59befd13c30ede22769dcdc
          command:
            - python
            - -c
          args:
            - |
              import hashlib
              import io
              import pathlib
              import urllib.request
              import zipfile

              url = "https://github.com/abix5/pi-cliproxyapi-bridge/releases/download/v0.9.1/pi-bridge_0.9.1_linux_amd64.zip"
              expected = "7cfea7b47888c870acc8afca73d8f78cb8454559040c401a2aa08a870107db26"
              archive = urllib.request.urlopen(url, timeout=60).read()
              if hashlib.sha256(archive).hexdigest() != expected:
                  raise RuntimeError("pi-bridge archive checksum mismatch")
              with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
                  members = [member for member in bundle.namelist() if not member.endswith("/")]
                  if members != ["pi-bridge.so"]:
                      raise RuntimeError("unexpected pi-bridge archive contents")
                  target = pathlib.Path("/plugins/pi-bridge-v0.9.1.so")
                  target.write_bytes(bundle.read("pi-bridge.so"))
                  target.chmod(0o755)
          volumeMounts:
            - name: plugin-dir
              mountPath: /plugins
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: seed-management-panel
          image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          command:
            - /bin/sh
            - -ec
          args:
            - |
              expected='c8c8a2cf2b4ca87b38ac885821c94f03601ae3c09eb2eca651bd0f82180e6743'
              panel=/data/static/management.html
              if [ ! -f "$panel" ] || ! echo "$expected  $panel" | sha256sum -c - >/dev/null 2>&1; then
                mkdir -p /data/static
                wget -q -O "$panel.tmp" \
                  https://github.com/router-for-me/Cli-Proxy-API-Management-Center/releases/download/v1.19.1/management.html
                echo "$expected  $panel.tmp" | sha256sum -c -
                chmod 0644 "$panel.tmp"
                mv "$panel.tmp" "$panel"
              fi
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: discover-ai-models
          image: python:3.14-alpine@sha256:05b2b8b732ecd268fee8727a369f936f022d1321b59befd13c30ede22769dcdc
          command:
            - python
            - -c
          args:
            - |
              import json
              import pathlib
              import time
              import urllib.request

              upstream = "http://ai.keiretsu.ts.net/v1"
              for attempt in range(30):
                  try:
                      with urllib.request.urlopen(upstream + "/models", timeout=10) as response:
                          payload = json.load(response)
                      models = []
                      seen = set()
                      for entry in payload.get("data", []):
                          model = str(entry.get("id", "")).strip()
                          if model and model not in seen:
                              seen.add(model)
                              models.append(model)
                      if not models:
                          raise RuntimeError("upstream returned no models")
                      break
                  except Exception:
                      if attempt == 29:
                          raise
                      time.sleep(2)

              lines = [
                  "openai-compatibility:",
                  '  - name: "ai"',
                  '    prefix: "ai"',
                  f'    base-url: "{upstream}"',
                  "    disable-cooling: false",
                  "    headers:",
                  '      User-Agent: "Bhaiya-CLIProxy/1.0"',
                  "    models:",
              ]
              for model in models:
                  lines.append("      - name: " + json.dumps(model))
              pathlib.Path("/provider/ai.yaml").write_text(
                  "\n".join(lines) + "\n", encoding="utf-8"
              )
              print(f"discovered {len(models)} ai models")
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: provider-config
              mountPath: /provider
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: discover-ai-kartik-models
          image: python:3.14-alpine@sha256:05b2b8b732ecd268fee8727a369f936f022d1321b59befd13c30ede22769dcdc
          command:
            - python
            - -c
          args:
            - |
              import json
              import pathlib
              import time
              import urllib.request

              upstream = "http://ai-kartik.keiretsu.ts.net/v1"
              for attempt in range(30):
                  try:
                      with urllib.request.urlopen(upstream + "/models", timeout=10) as response:
                          payload = json.load(response)
                      models = []
                      seen = set()
                      for entry in payload.get("data", []):
                          model = str(entry.get("id", "")).strip()
                          if model and model not in seen:
                              seen.add(model)
                              models.append(model)
                      if not models:
                          raise RuntimeError("upstream returned no models")
                      break
                  except Exception:
                      if attempt == 29:
                          raise
                      time.sleep(2)

              lines = [
                  "openai-compatibility:",
                  '  - name: "ai-kartik"',
                  '    prefix: "ai-kartik"',
                  f'    base-url: "{upstream}"',
                  "    disable-cooling: false",
                  "    headers:",
                  '      User-Agent: "Bhaiya-CLIProxy/1.0"',
                  "    models:",
              ]
              for model in models:
                  lines.append("      - name: " + json.dumps(model))
              pathlib.Path("/provider/ai-kartik.yaml").write_text(
                  "\n".join(lines) + "\n", encoding="utf-8"
              )
              print(f"discovered {len(models)} ai-kartik models")
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: provider-config
              mountPath: /provider
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: discover-vllm-models
          image: python:3.14-alpine@sha256:05b2b8b732ecd268fee8727a369f936f022d1321b59befd13c30ede22769dcdc
          command:
            - python
            - -c
          args:
            - |
              import json
              import pathlib
              import time
              import urllib.request

              # This ExternalName is the supported in-cluster route to the
              # tailnet endpoint. A single 5s timeout during St. Petersburg
              # LWS rolls used to omit the vllm/ prefix entirely, so Pi and
              # Hermes 400 unknown provider even after the GPU is healthy.
              # Retry like the other discover inits, then pin the known
              # serving ID so the catalog still advertises the GPU route.
              # Completions fail closed against the live upstream.
              upstream = "http://stpetersburg-vllm-upstream/v1"
              models = []
              seen = set()
              last_error = None
              for attempt in range(30):
                  try:
                      with urllib.request.urlopen(upstream + "/models", timeout=15) as response:
                          payload = json.load(response)
                      for entry in payload.get("data", []):
                          model = str(entry.get("id", "")).strip()
                          if model and model not in seen:
                              seen.add(model)
                              models.append(model)
                      if not models:
                          raise RuntimeError("upstream returned no models")
                      last_error = None
                      break
                  except Exception as error:
                      last_error = error
                      if attempt == 29:
                          break
                      time.sleep(2)
              if not models:
                  models = ["Qwen3.8-Flash-Next-NVFP4"]
                  seen = set(models)
                  print(
                      "vllm discovery unavailable after retries; "
                      f"pinning known route: {last_error}"
                  )
              lines = [
                  "openai-compatibility:",
                  '  - name: "vllm"',
                  '    prefix: "vllm"',
                  f'    base-url: "{upstream}"',
                  "    disable-cooling: false",
                  "    models:",
              ]
              for model in models:
                  lines.append("      - name: " + json.dumps(model))
                  if model == "deepseek-v4-flash" and "DeepSeek-V4-Flash" not in seen:
                      lines.append('        alias: "DeepSeek-V4-Flash"')
                  if model == "deepseek-v4-flash-vision-exp" and "DeepSeek-V4-Flash-Vision-Exp" not in seen:
                      lines.append('        alias: "DeepSeek-V4-Flash-Vision-Exp"')
                  if model == "Qwen3.8-Flash-Next-NVFP4" and "Qwen3.8-Flash-Next" not in seen:
                      lines.append('        alias: "Qwen3.8-Flash-Next"')
              pathlib.Path("/provider/vllm.yaml").write_text(
                  "\n".join(lines) + "\n", encoding="utf-8"
              )
              print(f"discovered {len(models)} vllm models")
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: provider-config
              mountPath: /provider
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: render-config
          image: eceasy/cli-proxy-api:v7.2.151@sha256:9d3a608c20d386f5475a7c2ca01936e6441293168b639948f8ddbf8555ecc2b5
          command:
            - /bin/sh
            - -ec
          args:
            - |
              umask 077
              cat > /config/config.yaml <<EOF
              host: ""
              port: 8317
              auth-dir: /data/auth
              tls:
                enable: false
                cert: ""
                key: ""
              remote-management:
                allow-remote: true
                secret-key: "$${MANAGEMENT_KEY}"
                disable-control-panel: false
                disable-auto-update-panel: true
              api-keys:
                - "$${API_KEY}"
              # Every credential owns its native route prefix. OAuth prefixes
              # live in auth metadata; the generated compatible providers
              # declare the Tailscale-backed routes below.
              force-model-prefix: true
              # Keep a stable, GitOps-owned fallback in the Codex subscription
              # pool while the Vision-Exp route is unavailable.
              oauth-model-alias:
                codex:
                  - name: "gpt-5.6-luna"
                    alias: "vllm-fallback"
                    display-name: "Codex subscription fallback"
                    fork: true
              plugins:
                enabled: true
                dir: "/CLIProxyAPI/plugins"
                configs:
                  pi-bridge:
                    enabled: true
                    priority: 3
                    store:
                      version: "0.9.1"
                    allow_all_api_keys: true
              debug: false
              pprof:
                enable: false
                addr: "127.0.0.1:8316"
              logging-to-file: true
              # Keep operational logs bounded on the dedicated PVC. Full
              # request-body logging produced one multi-megabyte artifact per
              # request and exhausted the 20Gi claim before the old age-based
              # cleanup could catch up.
              logs-max-total-size-mb: 256
              request-log: false
              usage-statistics-enabled: false
              ws-auth: true
              routing:
                strategy: round-robin
                session-affinity: true
              EOF
              cat /provider/ai.yaml >> /config/config.yaml
              tail -n +2 /provider/ai-kartik.yaml >> /config/config.yaml
              tail -n +2 /provider/vllm.yaml >> /config/config.yaml
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: cliproxy-credentials
                  key: api-key
            - name: MANAGEMENT_KEY
              valueFrom:
                secretKeyRef:
                  name: cliproxy-credentials
                  key: management-key
          volumeMounts:
            - name: config
              mountPath: /config
            - name: provider-config
              mountPath: /provider
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: cliproxy
          image: eceasy/cli-proxy-api:v7.2.151@sha256:9d3a608c20d386f5475a7c2ca01936e6441293168b639948f8ddbf8555ecc2b5
          command:
            - /CLIProxyAPI/CLIProxyAPI
          args:
            - --config
            - /config/config.yaml
          env:
            - name: HOME
              value: /data
            - name: WRITABLE_PATH
              value: /var/lib/cliproxy
            - name: MANAGEMENT_STATIC_PATH
              value: /data/static
            - name: MANAGEMENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cliproxy-credentials
                  key: management-key
          ports:
            - name: http
              containerPort: 8317
              protocol: TCP
            - name: codex-callback
              containerPort: 1455
              protocol: TCP
            - name: claude-callback
              containerPort: 54545
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /var/lib/cliproxy
            - name: plugin-dir
              mountPath: /CLIProxyAPI/plugins
              readOnly: true
            - name: pi-bridge-state
              mountPath: /var/run/pi-bridge
              readOnly: true
        - name: pi-bridge-sync
          image: python:3.14-alpine@sha256:05b2b8b732ecd268fee8727a369f936f022d1321b59befd13c30ede22769dcdc
          command:
            - python
            - -c
          args:
            - |
              import collections
              import fnmatch
              import json
              import os
              import pathlib
              import re
              import time
              import urllib.error
              import urllib.request

              base = "http://127.0.0.1:8317"
              api_key = os.environ["API_KEY"]
              management_key = os.environ["MANAGEMENT_KEY"]
              state = pathlib.Path("/state")
              ready = state / "ready"
              interval = 300
              models_dev_url = "https://models.dev/api.json"
              upstreams = (
                  ("ai", "http://ai.keiretsu.ts.net/v1/models"),
                  ("ai-kartik", "http://ai-kartik.keiretsu.ts.net/v1/models"),
                  ("vllm", "http://stpetersburg-vllm-upstream/v1/models"),
              )
              metadata_alias_sources = {
                  "codex-subscription/vllm-fallback": "codex-subscription/gpt-5.6-luna",
                  "vllm/DeepSeek-V4-Flash-Vision-Exp": "vllm/deepseek-v4-flash-vision-exp",
              }
              # The St. Petersburg Vision-Exp catalog does not publish all
              # serving-profile facts in /v1/models. Keep those facts explicit
              # so the Pi catalog and Bhaiya's generated OpenCode config describe
              # the active route accurately. Assert an 8k output cap so a stuck
              # stream cannot legally decode for the full 1,048,576 context.
              metadata_overrides = {
                  "vllm/deepseek-v4-flash-vision-exp": {
                      "context_window": 1048576,
                      "max_tokens": 8192,
                      "name": "DeepSeek V4 Flash Vision-Exp",
                      "reasoning": True,
                  },
              }

              def metadata_override(model_id):
                  # Keep alias metadata derived from its canonical route. A
                  # future serving-model change therefore updates one facts
                  # record plus the alias mapping, not two copies of limits.
                  source_id = metadata_alias_sources.get(model_id, model_id)
                  override = metadata_overrides.get(source_id)
                  return dict(override) if override else {}

              def request(method, path, token, payload=None, extra_headers=None):
                  body = None if payload is None else json.dumps(payload, separators=(",", ":"), sort_keys=True).encode()
                  headers = {
                      "Accept": "application/json",
                      "Authorization": "Bearer " + token,
                      "Content-Type": "application/json",
                  }
                  if extra_headers:
                      headers.update(extra_headers)
                  req = urllib.request.Request(base + path, data=body, method=method, headers=headers)
                  try:
                      with urllib.request.urlopen(req, timeout=20) as response:
                          return response.status, json.load(response)
                  except urllib.error.HTTPError as error:
                      return error.code, None

              def fetch_json(url):
                  req = urllib.request.Request(
                      url,
                      headers={
                          "Accept": "application/json",
                          "User-Agent": "Bhaiya-CLIProxy/1.0",
                      },
                  )
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.load(response)

              def canonical(value):
                  return json.dumps(value, separators=(",", ":"), sort_keys=True)

              def positive(value):
                  if isinstance(value, bool):
                      return 0
                  if isinstance(value, (int, float)) and value > 0:
                      return int(value)
                  return 0

              def first_positive(*values):
                  for value in values:
                      if result := positive(value):
                          return result
                  return 0

              def words(value):
                  return set(re.findall(r"[a-z0-9]{3,}", str(value).lower()))

              def normalized(value):
                  return re.sub(r"[^a-z0-9]", "", str(value).lower())

              def model_forms(value):
                  pending = [(str(value).strip(), 4)]
                  forms = {}
                  while pending:
                      current, quality = pending.pop()
                      key = normalized(current)
                      if len(key) < 4 or forms.get(key, -1) >= quality:
                          continue
                      forms[key] = quality
                      dated = re.sub(r"(?i)(?:[-_.]20\d{2}(?:[-_.]?\d{2}){2})$", "", current)
                      if dated != current:
                          pending.append((dated, quality - 1))
                      for separator in ("@", ":"):
                          if separator in current:
                              pending.append((current.split(separator, 1)[0], quality - 1))
                      for separator in ("/", "."):
                          if separator in current:
                              pending.append((current.split(separator, 1)[1], quality - 1))
                  return forms

              def string_values(value):
                  if isinstance(value, dict):
                      for child in value.values():
                          yield from string_values(child)
                  elif isinstance(value, list):
                      for child in value:
                          yield from string_values(child)
                  elif isinstance(value, str):
                      yield value

              def model_catalog():
                  status, payload = request("GET", "/v1/models", api_key)
                  if status != 200 or not isinstance(payload, dict):
                      raise RuntimeError("CLIProxy model catalog is not ready")
                  owners = {}
                  for row in payload.get("data", []):
                      if not isinstance(row, dict):
                          continue
                      model_id = str(row.get("id", "")).strip()
                      if model_id:
                          owners[model_id] = str(row.get("owned_by", "")).strip()
                  if not owners:
                      raise RuntimeError("CLIProxy returned no models")
                  return owners

              def catalog_metadata(row):
                  limit = row.get("limit") if isinstance(row.get("limit"), dict) else {}
                  metadata = {}
                  if name := str(row.get("name", "")).strip():
                      metadata["name"] = name
                  if context_window := positive(limit.get("context")):
                      metadata["context_window"] = context_window
                  if max_tokens := positive(limit.get("output")):
                      metadata["max_tokens"] = max_tokens
                  if isinstance(row.get("reasoning"), bool):
                      metadata["reasoning"] = row["reasoning"]
                  cost = row.get("cost")
                  if isinstance(cost, dict):
                      translated = {
                          "input": cost.get("input"),
                          "output": cost.get("output"),
                          "cacheRead": cost.get("cache_read"),
                          "cacheWrite": cost.get("cache_write"),
                      }
                      translated = {
                          key: value
                          for key, value in translated.items()
                          if isinstance(value, (int, float)) and not isinstance(value, bool)
                      }
                      if translated:
                          metadata["cost"] = translated
                  return metadata

              def load_models_dev():
                  payload = fetch_json(models_dev_url)
                  if not isinstance(payload, dict):
                      raise RuntimeError("models.dev returned an invalid catalog")
                  entries = []
                  index = collections.defaultdict(list)
                  for provider_id, provider in payload.items():
                      if not isinstance(provider, dict):
                          continue
                      root = " ".join((str(provider_id), str(provider.get("name", ""))))
                      models = provider.get("models")
                      if not isinstance(models, dict):
                          continue
                      for model_id, row in models.items():
                          if not isinstance(row, dict):
                              continue
                          entry = (
                              str(provider_id),
                              root,
                              " ".join(string_values(row.get("provider"))),
                              catalog_metadata(row),
                          )
                          entry_index = len(entries)
                          entries.append(entry)
                          for form, quality in model_forms(model_id).items():
                              index[form].append((entry_index, quality))
                  if not entries:
                      raise RuntimeError("models.dev returned no model metadata")
                  return entries, index

              def direct_metadata(row):
                  source_metadata = row.get("metadata") if isinstance(row.get("metadata"), dict) else {}
                  source_limit = row.get("limit") if isinstance(row.get("limit"), dict) else {}
                  metadata_limit = source_metadata.get("limit") if isinstance(source_metadata.get("limit"), dict) else {}
                  metadata = {}
                  if context_window := first_positive(
                      row.get("context_window"),
                      row.get("max_context_window"),
                      row.get("max_model_len"),
                      row.get("context_length"),
                      source_metadata.get("context_window"),
                      source_metadata.get("max_context_window"),
                      source_metadata.get("max_model_len"),
                      source_limit.get("context"),
                      metadata_limit.get("context"),
                  ):
                      metadata["context_window"] = context_window
                  if max_tokens := first_positive(
                      row.get("max_tokens"),
                      row.get("max_completion_tokens"),
                      row.get("max_output_tokens"),
                      source_metadata.get("max_tokens"),
                      source_metadata.get("max_completion_tokens"),
                      source_metadata.get("max_output_tokens"),
                      source_limit.get("output"),
                      metadata_limit.get("output"),
                  ):
                      metadata["max_tokens"] = max_tokens
                  for name in (row.get("display_name"), row.get("name"), source_metadata.get("display_name"), source_metadata.get("name")):
                      if isinstance(name, str) and name.strip():
                          metadata["name"] = name.strip()
                          break
                  for reasoning in (row.get("reasoning"), source_metadata.get("reasoning")):
                      if isinstance(reasoning, bool):
                          metadata["reasoning"] = reasoning
                          break
                  return metadata

              def route_sources(model_ids):
                  # CLIProxy can expose only a stable alias while its upstream
                  # lists the canonical ID. Resolve that canonical source too;
                  # otherwise an alias-only catalog falls through to generic
                  # metadata despite its live upstream being healthy.
                  source_ids = set(model_ids)
                  for alias, source_id in metadata_alias_sources.items():
                      if alias in model_ids:
                          source_ids.add(source_id)
                  sources = {}
                  for prefix, url in upstreams:
                      if not any(model_id.startswith(prefix + "/") for model_id in source_ids):
                          continue
                      try:
                          payload = fetch_json(url)
                          rows = payload.get("data") if isinstance(payload, dict) else None
                          if not isinstance(rows, list):
                              raise RuntimeError(prefix + " returned an invalid model catalog")
                      except Exception as error:
                          print("pi-bridge metadata source unavailable for " + prefix + ": " + str(error), flush=True)
                          continue
                      by_id = collections.defaultdict(list)
                      by_normalized_id = collections.defaultdict(list)
                      by_form = collections.defaultdict(list)
                      for row in rows:
                          if not isinstance(row, dict):
                              continue
                          model_id = str(row.get("id", "")).strip()
                          if model_id:
                              by_id[model_id].append(row)
                              by_normalized_id[normalized(model_id)].append(row)
                              for form, quality in model_forms(model_id).items():
                                  by_form[form].append((model_id, row, quality))
                      for model_id in sorted(source_ids):
                          if not model_id.startswith(prefix + "/"):
                              continue
                          upstream_id = model_id[len(prefix) + 1:]
                          exact = by_id.get(upstream_id, [])
                          candidates = exact if len(exact) == 1 else by_normalized_id.get(normalized(upstream_id), [])
                          if len(candidates) != 1:
                              matched = {}
                              for form, source_quality in model_forms(upstream_id).items():
                                  for candidate_id, candidate, candidate_quality in by_form.get(form, []):
                                      matched[candidate_id] = max(
                                          matched.get(candidate_id, (0, None))[0],
                                          source_quality + candidate_quality,
                                      ), candidate
                              ranked = sorted(matched.items(), key=lambda item: (-item[1][0], item[0]))
                              if ranked and (len(ranked) == 1 or ranked[0][1][0] > ranked[1][1][0]):
                                  candidates = [ranked[0][1][1]]
                          if len(candidates) != 1:
                              continue
                          row = candidates[0]
                          source_metadata = row.get("metadata") if isinstance(row.get("metadata"), dict) else {}
                          provider = source_metadata.get("provider") if isinstance(source_metadata.get("provider"), dict) else {}
                          sources[model_id] = {
                              "id": str(row.get("id", "")).strip(),
                              "provider": provider,
                              "direct": direct_metadata(row),
                          }
                  for alias, source_id in metadata_alias_sources.items():
                      if alias in model_ids and source_id in sources:
                          sources[alias] = sources[source_id]
                  return sources

              def resolve_models_dev(entries, index, source):
                  source_id = str(source.get("id", "")).strip()
                  provider = source.get("provider") if isinstance(source.get("provider"), dict) else {}
                  provider_text = " ".join((str(provider.get("id", "")), str(provider.get("name", ""))))
                  source_provider_id = normalized(provider.get("id", ""))
                  source_words = words(provider_text)
                  route_words = source_words - words(source_id)
                  if route_words:
                      source_words = route_words
                  candidates = {}
                  for form, source_quality in model_forms(source_id).items():
                      for entry_index, catalog_quality in index.get(form, []):
                          candidates[entry_index] = max(candidates.get(entry_index, -1), source_quality + catalog_quality)
                  rated = []
                  for entry_index, id_quality in candidates.items():
                      provider_id, root, model_provider, metadata = entries[entry_index]
                      root_words = words(root)
                      model_provider_words = words(model_provider)
                      root_score = sum(len(word) * 1000 for word in source_words & root_words)
                      if source_provider_id and source_provider_id == normalized(provider_id):
                          root_score += 10000
                      model_score = sum(len(word) * 100 for word in source_words & model_provider_words)
                      rated.append((root_score + model_score, id_quality, provider_id, metadata))
                  if not rated:
                      return {}
                  rated.sort(key=lambda item: (-item[0], -item[1], item[2]))
                  source_score, _, _, metadata = rated[0]
                  if source_score <= 0:
                      shapes = {
                          canonical({
                              key: candidate[3].get(key)
                              for key in ("context_window", "max_tokens", "reasoning")
                          })
                          for candidate in rated
                      }
                      if len(shapes) != 1:
                          return {}
                  return dict(metadata)

              def resolved_metadata(model_id, owner, route_source, entries, index):
                  if route_source is None:
                      if any(model_id.startswith(prefix + "/") for prefix, _ in upstreams):
                          return None
                      source_model_id = metadata_alias_sources.get(model_id, model_id)
                      raw_id = source_model_id.split("/", 1)[1] if "/" in source_model_id else source_model_id
                      route_source = {"id": raw_id, "provider": {"id": owner}, "direct": {}}
                  metadata = resolve_models_dev(entries, index, route_source)
                  metadata.update(route_source.get("direct", {}))
                  metadata.update(metadata_override(model_id))
                  if not positive(metadata.get("context_window")):
                      return None
                  return metadata

              def bridge_document():
                  status, document = request(
                      "GET",
                      "/v0/resource/plugins/pi-bridge/well-known?refresh=true",
                      api_key,
                      extra_headers={"X-Pi-Contract": "2"},
                  )
                  if status != 200 or not isinstance(document, dict):
                      return None
                  models = {}
                  for provider in (document.get("builtinProviders") or {}).values():
                      for model in provider.get("models", []):
                          if isinstance(model, dict) and model.get("id"):
                              models[model["id"]] = model
                  for model in document.get("customModelPool", []):
                      if isinstance(model, dict) and model.get("id"):
                          models[model["id"]] = model
                  return document, models

              def bridge_snapshot(ids):
                  result = bridge_document()
                  if result is None:
                      return None
                  document, models = result
                  patterns = [
                      pattern
                      for pattern in document.get("discoveryExcludes", [])
                      if isinstance(pattern, str)
                  ]
                  exposed_ids = {
                      model_id
                      for model_id in ids
                      if not any(fnmatch.fnmatchcase(model_id, pattern) for pattern in patterns)
                  }
                  catalog = document.get("catalog")
                  unmatched_ids = (catalog.get("unmatchedIds") or []) if isinstance(catalog, dict) else None
                  if (
                      document.get("schemaVersion") != 1
                      or set(models) != exposed_ids
                      or not isinstance(catalog, dict)
                      or int(catalog.get("entries") or 0) <= 0
                      or not isinstance(unmatched_ids, list)
                      or not all(isinstance(item, str) for item in unmatched_ids)
                  ):
                      return None
                  unmatched_ids = set(unmatched_ids)
                  if not unmatched_ids.issubset(exposed_ids):
                      return None
                  return document, models, exposed_ids, unmatched_ids

              def bridge_ready():
                  status, payload = request("GET", "/v0/management/plugins", management_key)
                  if status != 200 or not isinstance(payload, dict) or not payload.get("plugins_enabled"):
                      return False
                  return any(
                      isinstance(plugin, dict)
                      and plugin.get("id") == "pi-bridge"
                      and plugin.get("configured")
                      and plugin.get("registered")
                      and plugin.get("effective_enabled")
                      for plugin in payload.get("plugins", [])
                  )

              def reload_bridge():
                  status, _ = request(
                      "PATCH",
                      "/v0/management/plugins/pi-bridge/enabled",
                      management_key,
                      {"enabled": True},
                  )
                  if status != 200:
                      raise RuntimeError("pi-bridge reload failed")
                  deadline = time.monotonic() + 30
                  while time.monotonic() < deadline:
                      if bridge_ready():
                          return
                      time.sleep(1)
                  raise RuntimeError("pi-bridge reload did not become ready")

              def advanced_config():
                  status, plugin_config = request("GET", "/v0/management/plugins/pi-bridge/config", management_key)
                  if status != 200 or not isinstance(plugin_config, dict):
                      raise RuntimeError("pi-bridge management config is not ready")
                  current = plugin_config.get("advanced", "")
                  try:
                      current = json.loads(current) if current else {}
                  except (TypeError, ValueError):
                      current = {}
                  return current if isinstance(current, dict) else {}

              def apply_advanced(current, overrides):
                  desired = dict(current)
                  desired.update({"model_aliases": {}, "model_overrides": overrides})
                  if canonical(current) != canonical(desired):
                      status, _ = request(
                          "PATCH",
                          "/v0/management/plugins/pi-bridge/config",
                          management_key,
                          {"advanced": canonical(desired)},
                      )
                      if status != 200:
                          raise RuntimeError("pi-bridge metadata update failed")
                      reload_bridge()

              def metadata_matches(model, metadata):
                  fields = {
                      "context_window": "contextWindow",
                      "max_tokens": "maxTokens",
                      "name": "name",
                      "reasoning": "reasoning",
                  }
                  for source_key, document_key in fields.items():
                      if source_key in metadata and model.get(document_key) != metadata[source_key]:
                          return False
                  if "cost" in metadata and "cost" in model:
                      actual = model.get("cost") or {}
                      expected = {
                          "input": metadata["cost"].get("input"),
                          "output": metadata["cost"].get("output"),
                          "cacheRead": metadata["cost"].get("cacheRead"),
                          "cacheWrite": metadata["cost"].get("cacheWrite"),
                      }
                      for key, value in expected.items():
                          if value is not None and actual.get(key) != value:
                              return False
                  return True

              def wait_for_snapshot(ids, timeout):
                  deadline = time.monotonic() + timeout
                  while time.monotonic() < deadline:
                      snapshot = bridge_snapshot(ids)
                      if snapshot is not None:
                          return snapshot
                      time.sleep(2)
                  return None

              def wait_for_synchronized_document(ids, overrides, unresolved, timeout):
                  deadline = time.monotonic() + timeout
                  while time.monotonic() < deadline:
                      snapshot = bridge_snapshot(ids)
                      if snapshot is not None:
                          _, models, exposed_ids, unmatched_ids = snapshot
                          if (
                              unmatched_ids == unresolved
                              and all(
                                  model_id in exposed_ids and metadata_matches(models[model_id], metadata)
                                  for model_id, metadata in overrides.items()
                              )
                          ):
                              return snapshot
                      time.sleep(2)
                  return None

              ready.unlink(missing_ok=True)
              while True:
                  try:
                      owners = model_catalog()
                      initial = wait_for_snapshot(set(owners), 90)
                      if initial is None:
                          raise RuntimeError("pi-bridge did not expose the live model catalog")
                      _, _, exposed_ids, _ = initial
                      entries, index = load_models_dev()
                      sources = route_sources(exposed_ids)
                      overrides = {}
                      unresolved = set()
                      for model_id in sorted(exposed_ids):
                          metadata = resolved_metadata(model_id, owners[model_id], sources.get(model_id), entries, index)
                          if metadata is None:
                              unresolved.add(model_id)
                          else:
                              overrides[model_id] = metadata
                      apply_advanced(advanced_config(), overrides)
                      final = wait_for_synchronized_document(set(owners), overrides, unresolved, 90)
                      if final is None:
                          reload_bridge()
                          final = wait_for_synchronized_document(set(owners), overrides, unresolved, 30)
                      if final is None:
                          raise RuntimeError("pi-bridge did not expose source-resolved metadata")
                      (state / "metadata.json").write_text(
                          canonical({"resolved": sorted(overrides), "unresolved": sorted(unresolved)}) + "\n",
                          encoding="ascii",
                      )
                      ready.write_text(str(len(overrides)) + "/" + str(len(exposed_ids)) + "\n", encoding="ascii")
                      print(
                          "pi-bridge metadata ready for "
                          + str(len(overrides))
                          + " source-resolved models (of "
                          + str(len(exposed_ids))
                          + " exposed; "
                          + str(len(unresolved))
                          + " require Pi exclusion)",
                          flush=True,
                      )
                  except Exception as error:
                      ready.unlink(missing_ok=True)
                      print("pi-bridge metadata waiting: " + str(error), flush=True)
                  time.sleep(interval if ready.exists() else 5)
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: cliproxy-credentials
                  key: api-key
            - name: MANAGEMENT_KEY
              valueFrom:
                secretKeyRef:
                  name: cliproxy-credentials
                  key: management-key
          volumeMounts:
            - name: pi-bridge-state
              mountPath: /state
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: log-forwarder
          image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          command:
            - /bin/sh
            - -ec
          args:
            - |
              mkdir -p /var/lib/cliproxy/logs

              max_main_log_bytes=67108864

              trim_main_log() {
                main_log=/var/lib/cliproxy/logs/main.log
                if [ -f "$${main_log}" ] && [ "$$(wc -c < "$${main_log}")" -gt "$${max_main_log_bytes}" ]; then
                  # Truncate in place: this needs no temporary allocation and
                  # therefore still recovers a completely full PVC.
                  : > "$${main_log}"
                  echo "log-forwarder: truncated main.log above 64MiB"
                fi
              }

              cleanup_request_logs() {
                # request-log is disabled above. Purge artifacts from the
                # previous unbounded configuration on startup and thereafter;
                # this is intentionally independent of age so a full claim can
                # recover on the first new Pod.
                find /var/lib/cliproxy/logs -maxdepth 1 -type f \
                  \( -name 'v1-*.log' -o -name 'request-body-*.tmp' \) \
                  -exec rm -f -- {} \;
                find /var/lib/cliproxy/logs -maxdepth 1 -type d \
                  -name 'request-log-parts-*' \
                  -exec rm -rf -- {} \;
                find /var/lib/cliproxy/logs -maxdepth 1 -type f \
                  -mmin +5760 ! -name main.log \
                  -exec rm -f -- {} \;
                find /var/lib/cliproxy/logs -maxdepth 1 -type d \
                  -name 'request-log-parts-*' -mmin +5760 \
                  -exec rm -rf -- {} \;
              }

              trim_main_log
              cleanup_request_logs
              while sleep 3600; do
                trim_main_log
                cleanup_request_logs
              done &

              while [ ! -f /var/lib/cliproxy/logs/main.log ]; do
                sleep 1
              done
              exec tail -n 0 -F /var/lib/cliproxy/logs/main.log
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: logs
              mountPath: /var/lib/cliproxy
      volumes:
        - name: config
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: provider-config
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: data
          persistentVolumeClaim:
            claimName: cliproxy-data
        - name: logs
          persistentVolumeClaim:
            claimName: cliproxy-logs
        - name: plugin-dir
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: pi-bridge-state
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
