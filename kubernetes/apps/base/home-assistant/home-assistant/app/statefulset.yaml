apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: homeassistant
spec:
  replicas: 1
  serviceName: homeassistant
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      labels:
        app: homeassistant
      annotations:
        # macvlan side-leg on the LAN so HomeKit Bridge + HA mobile app
        # mDNS discovery can advertise from a real 192.168.73.x IP.
        # default-route on the LAN iface so HA's mDNS/Bonjour goes out the
        # right interface; Cilium's BPF still handles intra-cluster traffic.
        k8s.v1.cni.cncf.io/networks: |
          [{"name":"lan","namespace":"home-assistant","default-route":["192.168.73.1"]}]
    spec:
      nodeSelector:
        kubernetes.io/hostname: orin-0
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        # Keep HA schedulable during transient control-plane memory pressure.
        - key: node.kubernetes.io/memory-pressure
          operator: Exists
          effect: NoSchedule
      priorityClassName: "infra-critical"
      initContainers:
        - name: route-fix
          image: alpine:3.24
          command:
            - /bin/sh
            - -c
            - |
              # Wait for the macvlan LAN leg (net1) to appear. Home Assistant
              # without net1 has no LAN presence, so HomeKit Bridge and the HA
              # mobile app cannot advertise over mDNS — but the container still
              # starts and passes its probes, which is how the pod previously
              # sat Running and Ready with HomeKit silently dead.
              #
              # Fail the pod instead. A CrashLoopBackOff here is a true signal;
              # a Ready pod with no LAN is a false one.
              for i in $(seq 1 30); do
                ip link show net1 >/dev/null 2>&1 && break
                sleep 2
              done
              if ! ip link show net1 >/dev/null 2>&1; then
                echo "route-fix: net1 (macvlan LAN leg) did not appear after 60s." >&2
                echo "route-fix: refusing to start Home Assistant without LAN — HomeKit/mDNS would be silently unreachable." >&2
                echo "route-fix: check the 'lan' NetworkAttachmentDefinition and whether another pod holds 192.168.73.140." >&2
                exit 1
              fi
              # Pin cluster pod/service CIDR routes to eth0 so intra-cluster
              # traffic doesn't exit via the macvlan/LAN interface.
              ip route add 10.5.0.0/16 dev eth0 2>/dev/null || true
              ip route add 10.4.0.0/16 dev eth0 2>/dev/null || true
              ip route add 169.254.0.0/16 dev eth0 2>/dev/null || true
          # Requests must equal limits here or the POD is not Guaranteed.
          # Kubernetes computes QoS across every container including init
          # containers: the homeassistant container already sets 1Gi/1 with
          # requests == limits, but this one had no resources at all, which
          # silently demoted the whole pod to Burstable — and Burstable pods
          # are evicted before Guaranteed ones under node memory pressure.
          # That is why infra-critical + the memory-pressure toleration did
          # not stop orin-0 evicting Home Assistant.
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "32Mi"
              cpu: "50m"
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
      containers:
        - name: homeassistant
          image: homeassistant/home-assistant:2026.9
          # Guaranteed QoS prevents HA from being selected before Burstable workloads.
          resources:
            requests:
              memory: "1Gi"
              cpu: "1"
            limits:
              memory: "1Gi"
              cpu: "1"
          env:
            - name: TZ
              value: ${TIMEZONE}
          ports:
            - name: http
              containerPort: 8123
          volumeMounts:
            - name: config
              mountPath: /config
            - name: google-assistant
              mountPath: /config/google_assistant.yaml
              subPath: google_assistant.yaml
              readOnly: true
            - name: lights
              mountPath: /config/lights.yaml
              subPath: lights.yaml
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: homeassistant-config
        - name: google-assistant
          secret:
            secretName: home-assistant-google-assistant
        - name: lights
          configMap:
            name: home-assistant-lights