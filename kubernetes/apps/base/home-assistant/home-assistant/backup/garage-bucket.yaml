# DRAFT — option (b) for corp/bhaiya#695. Not referenced by kustomization yet.
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: home-assistant-config
  namespace: garage
spec:
  clusterRef:
    name: garage
  globalAlias: home-assistant-config
  quotas:
    maxSize: 5Gi
    maxObjects: 10000
---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: home-assistant-config
  namespace: garage
spec:
  clusterRef:
    name: garage
  name: home-assistant-config
  bucketPermissions:
    - bucketRef:
        name: home-assistant-config
      read: true
      write: true
  secretTemplate:
    name: home-assistant-config-s3
    namespace: home-assistant
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
