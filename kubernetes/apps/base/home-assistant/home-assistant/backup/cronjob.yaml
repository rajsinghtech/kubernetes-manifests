# DRAFT — daily tar of live /config via pods/exec to Garage.
# Requires GarageKey secret home-assistant-config-s3 in home-assistant.
# Prefer approving docs/incidents/695-ha-data-recovery.md before wiring.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ha-config-backup
  namespace: home-assistant
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ha-config-backup
  namespace: home-assistant
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ha-config-backup
  namespace: home-assistant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ha-config-backup
subjects:
  - kind: ServiceAccount
    name: ha-config-backup
    namespace: home-assistant
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: homeassistant-config-garage
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: homeassistant-config-backup
spec:
  schedule: "30 9 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: ha-config-backup
          restartPolicy: Never
          containers:
            - name: backup
              image: amazon/aws-cli:2.27.50
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: home-assistant-config-s3
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: home-assistant-config-s3
                      key: AWS_SECRET_ACCESS_KEY
                - name: AWS_DEFAULT_REGION
                  value: garage
                - name: ENDPOINT
                  value: http://garage-gateway.garage.svc.cluster.local:3900
                - name: BUCKET
                  value: home-assistant-config
              command:
                - /bin/sh
                - -ec
                - |
                  set -euo pipefail
                  # NOTE: This draft expects `kubectl` in the image or a follow-up
                  # image that bundles kubectl + aws. Replace with a purpose-built
                  # image before wiring into Flux.
                  echo "DRAFT: replace image/command with approved kubectl+aws tooling"
                  exit 1
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
