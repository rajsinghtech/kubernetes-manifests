---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: homeassistant-config
  namespace: home-assistant
spec:
  repository:
    kind: Repository
    name: kopiur-stpetersburg
  # copyMethod MUST be Direct and MUST be explicit. Default is now Snapshot,
  # which fails on this local-path→hostPath PVC with SourceNotCSIProvisioned
  # (#695 blocker). Direct mounts the live PVC for kopia — same capability
  # VolSync Direct had; Velero FSB refuses hostPath.
  copyMethod: Direct
  sources:
    - pvc:
        name: homeassistant-config
      # Keep Direct mount READ-ONLY (kopiur default). readOnly:false would
      # make kubelet fsGroup-chgrp the LIVE PVC — HA's only copy. Never.
      readOnly: true
  retention:
    keepDaily: 14
    keepWeekly: 4
    keepMonthly: 3
  mover:
    # The live source has one owner-only file under .storage/:
    # 10000:10000, mode 0600. A root mover with the hardened capabilities.drop
    # [ALL] still lacks CAP_DAC_OVERRIDE and therefore cannot read it (the
    # previous UID-0 run failed on .storage/core.uuid). Match the file owner
    # instead; this keeps the mover unprivileged and leaves the live PVC
    # read-only. The remaining source files are root-owned or world-readable.
    securityContext:
      runAsUser: 10000
      runAsGroup: 10000
      runAsNonRoot: true
    # Do NOT put tolerations here — SnapshotPolicy.spec.mover has no
    # tolerations field (schema reject / Flux dry-run fail). Scheduling onto
    # tainted orin-0 is handled by Repository.sourceColocation Auto (default):
    # Direct movers pin to the RWO holder node and union the holder pod's
    # tolerations (HA already tolerates control-plane). Optional explicit base
    # tolerations live on Repository.spec.moverDefaults.tolerations only.
