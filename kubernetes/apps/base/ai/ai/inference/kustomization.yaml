---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai
resources:
  - namespace.yaml
  - qwen38.yaml
  - secret.yaml
  - probes.yaml
  - prometheusrule.yaml

configMapGenerator:
  - name: qwen-patches
    options:
      disableNameSuffixHash: true
    files:
      - patch_checkpoint_config.py=qwen-patches/patch_checkpoint_config.py
      - patch_ple_layer.py=qwen-patches/patch_ple_layer.py
      - patch_modelopt_mxfp8.py=qwen-patches/patch_modelopt_mxfp8.py
      - patch_modelopt_fp8_block_moe.py=qwen-patches/patch_modelopt_fp8_block_moe.py
      - patch_qsa_fp8_kv.py=qwen-patches/patch_qsa_fp8_kv.py
      - patch_mtp_draft_vocab.py=qwen-patches/patch_mtp_draft_vocab.py
