#
# Qwen3.8-Flash-Next-NVFP4 on 2× DGX Spark — vLLM TP=2+EP+MTP3.
#
# The model and serving recipe are from:
# https://github.com/MiaAI-Lab/Qwen3.8-Flash-Next-Dual-DGX-Sparks
# Target checkpoint: nvidia/Qwen3.8-Flash-Next-NVFP4@fc694b54
# Target recipe: MiaAI-Lab upstream c2325b2 (vLLM TP2+EP+MTP3, FP8 KV/QSA and MTP/PLE fixes).
# Runtime image: the upstream-provided vLLM image, arm64 pinned.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen38-download-script
  namespace: ai
data:
  download-and-validate.sh: |
    #!/bin/bash
    set -euo pipefail
    MODEL_DIR="$${MODEL_DIR:-/models/qwen38}"
    HF_REPO="$${HF_REPO:-nvidia/Qwen3.8-Flash-Next-NVFP4}"
    HF_REVISION="$${HF_REVISION:-fc694b54fb0174e0913e6adf86691ef85a4ead47}"
    MODEL_MARKER="$${MODEL_DIR}/.model-revision"
    EXPECTED_MARKER="$${HF_REPO}@$${HF_REVISION}"
    EXPECTED_SHARDS=11

    mkdir -p "$${MODEL_DIR}"
    COUNT="$$(find "$${MODEL_DIR}" -maxdepth 1 -name '*.safetensors' | wc -l)"
    CURRENT_MARKER="$$(cat "$${MODEL_MARKER}" 2>/dev/null || true)"
    if [ "$${COUNT}" -eq "$${EXPECTED_SHARDS}" ] && [ "$${CURRENT_MARKER}" = "$${EXPECTED_MARKER}" ] \
      && [ -f "$${MODEL_DIR}/config.json" ] \
      && [ -f "$${MODEL_DIR}/model.safetensors.index.json" ]; then
      echo "[download] All $${EXPECTED_SHARDS} safetensor files already present — skipping download."
      echo "[validate] Model validation OK ($${COUNT}/$${EXPECTED_SHARDS})"
      exit 0
    fi

    if [ "$${CURRENT_MARKER}" != "$${EXPECTED_MARKER}" ]; then
      echo "[download] Model revision changed ($${CURRENT_MARKER:-unmarked} -> $${EXPECTED_MARKER}); clearing old weights."
      find "$${MODEL_DIR}" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
      mkdir -p "$${MODEL_DIR}"
    fi

    echo "[download] Downloading $${HF_REPO}@$${HF_REVISION} (~135 GB)…"
    python3 - "$${MODEL_DIR}" "$${HF_REPO}" "$${HF_REVISION}" <<'PY'
    import os
    import sys

    from huggingface_hub import snapshot_download

    path, repo, revision = sys.argv[1:]
    snapshot_download(
        repo_id=repo,
        revision=revision,
        local_dir=path,
        token=os.environ.get("HUGGING_FACE_HUB_TOKEN") or None,
        max_workers=8,
    )
    PY

    COUNT="$$(find "$${MODEL_DIR}" -maxdepth 1 -name '*.safetensors' | wc -l)"
    if [ "$${COUNT}" -ne "$${EXPECTED_SHARDS}" ]; then
      echo "[FATAL] Expected $${EXPECTED_SHARDS} safetensor files, got $${COUNT}."
      exit 1
    fi
    test -f "$${MODEL_DIR}/config.json"
    test -f "$${MODEL_DIR}/model.safetensors.index.json"
    printf '%s\n' "$${EXPECTED_MARKER}" > "$${MODEL_MARKER}"
    echo "[validate] Model validation OK ($${COUNT}/$${EXPECTED_SHARDS})"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen38-head-models
  namespace: ai
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 200Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen38-worker-models
  namespace: ai
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 200Gi
---
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: qwen38
  namespace: ai
  labels:
    app: qwen38
spec:
  replicas: 1
  startupPolicy: LeaderCreated
  leaderWorkerTemplate:
    size: 2
    # Keep the head downloader alive if the worker has a transient failure; the
    # 200Gi PVCs are resumable and the group must not erase active downloads.
    restartPolicy: None
    leaderTemplate:
      metadata:
        labels:
          app: qwen38
          role: head
      spec:
        terminationGracePeriodSeconds: 120
        hostNetwork: true
        hostIPC: true
        dnsPolicy: ClusterFirstWithHostNet
        enableServiceLinks: false
        nodeSelector:
          kubernetes.io/hostname: spark-0
        initContainers:
        - name: drop-caches
          image: busybox:1.38
          command: [sh, -c, "echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true"]
          securityContext:
            privileged: true
          resources:
            requests: { memory: "64Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "500m" }
        - name: download-models
          image: vllm/vllm-openai@sha256:3b0e188ffceb3d07e09c3cb5215433a0020eacf02d7f882ed3a8bfd15454477e
          command: [/bin/bash]
          args: [/scripts/download-and-validate.sh]
          env:
          - { name: MODEL_DIR, value: "/models/qwen38" }
          - { name: HF_REPO, value: "nvidia/Qwen3.8-Flash-Next-NVFP4" }
          - { name: HF_REVISION, value: "fc694b54fb0174e0913e6adf86691ef85a4ead47" }
          - { name: HUGGING_FACE_HUB_TOKEN, valueFrom: { secretKeyRef: { name: hf-secret, key: HF_TOKEN } } }
          - { name: HF_HOME, value: "/models/huggingface" }
          - { name: HF_HUB_OFFLINE, value: "0" }
          - { name: TRANSFORMERS_OFFLINE, value: "0" }
          volumeMounts:
          - { name: models, mountPath: /models }
          - { name: download-script, mountPath: /scripts }
          resources:
            requests: { memory: "4Gi", cpu: "2000m" }
            limits: { memory: "8Gi", cpu: "4000m" }
        containers:
        - name: drop-caches-loop
          image: busybox:1.38
          command: [sh, -c, "while true; do sleep 15; echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true; done"]
          securityContext:
            privileged: true
          resources:
            requests: { memory: "64Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "500m" }
        - name: vllm
          image: vllm/vllm-openai@sha256:3b0e188ffceb3d07e09c3cb5215433a0020eacf02d7f882ed3a8bfd15454477e
          # Upstream MiaAI-Lab arm64 image; patches below are applied at startup.
          command: [bash, -c]
          args:
          - |
            set -euo pipefail
            echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true
            nvidia-smi --gpu-reset -i 0 >/dev/null 2>/dev/null || true
            mkdir -p /tmp/qwen-patches
            cp /qwen-patches/patch_checkpoint_config.py /tmp/qwen-patches/
            cp /qwen-patches/patch_ple_layer.py /tmp/qwen-patches/
            cp /qwen-patches/patch_modelopt_mxfp8.py /tmp/qwen-patches/
            cp /qwen-patches/patch_modelopt_fp8_block_moe.py /tmp/qwen-patches/
            cp /qwen-patches/patch_qsa_fp8_kv.py /tmp/qwen-patches/
            cp /qwen-patches/patch_mtp_draft_vocab.py /tmp/qwen-patches/
            VLLM_DIR=$(python3 -c 'import vllm; print(vllm.__path__[0])')
            python3 - "$VLLM_DIR/models/qwen3_8_flash_next/nvidia/ple_layer.py" <<'PY'
            import sys
            from pathlib import Path
            p=Path(sys.argv[1]); Path('/tmp/qwen-patches/ple_layer_patched.py.orig').write_text(p.read_text())
            PY
            python3 - "$VLLM_DIR/model_executor/layers/quantization/modelopt.py" <<'PY'
            import sys
            from pathlib import Path
            p=Path(sys.argv[1]); Path('/tmp/qwen-patches/modelopt_patched.py.orig').write_text(p.read_text())
            PY
            python3 - "$VLLM_DIR/models/qwen3_8_flash_next/nvidia/ops/qsa.py" "$VLLM_DIR/models/qwen3_8_flash_next/nvidia/qsa.py" <<'PY'
            import sys
            from pathlib import Path
            Path('/tmp/qwen-patches/qsa_ops_patched.py.orig').write_text(Path(sys.argv[1]).read_text())
            Path('/tmp/qwen-patches/qsa_nvidia_patched.py.orig').write_text(Path(sys.argv[2]).read_text())
            PY
            python3 /tmp/qwen-patches/patch_ple_layer.py
            python3 /tmp/qwen-patches/patch_modelopt_mxfp8.py
            python3 /tmp/qwen-patches/patch_modelopt_fp8_block_moe.py
            python3 /tmp/qwen-patches/patch_qsa_fp8_kv.py
            python3 /tmp/qwen-patches/patch_checkpoint_config.py /models/qwen38 /tmp/qwen-patches
            if [ -f /tmp/qwen-patches/config_patched.json ]; then cp /tmp/qwen-patches/config_patched.json /models/qwen38/config.json; fi
            if [ -f /tmp/qwen-patches/hf_quant_config_patched.json ]; then cp /tmp/qwen-patches/hf_quant_config_patched.json /models/qwen38/hf_quant_config.json; fi
            exec vllm serve /models/qwen38 \
              --served-model-name qwen3.8-flash-next Qwen3.8-Flash-Next-NVFP4 \
              --tensor-parallel-size 2 --distributed-executor-backend mp \
              --enable-expert-parallel --all2all-backend allgather_reducescatter \
              --gpu-memory-utilization 0.835 --max-num-seqs 8 --max-num-batched-tokens 8192 \
              --max-model-len 1000000 --kv-cache-dtype fp8 --load-format safetensors \
              --safetensors-load-strategy lazy --enable-chunked-prefill --enable-prefix-caching \
              --reasoning-parser qwen3 --enable-auto-tool-choice --tool-call-parser qwen3_coder \
              --mm-encoder-tp-mode data --limit-mm-per-prompt '{"image":1,"video":1}' \
              --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
              --compilation-config '{"mode":0,"cudagraph_mode":"FULL_DECODE_ONLY"}' \
              --hf-overrides '{"text_config":{"rope_parameters":{"rope_type":"yarn","factor":4.0,"original_max_position_embeddings":262144}}}' \
              --nnodes 2 --node-rank 0 --master-addr 192.168.74.1 --master-port 26400
          ports:
          - { containerPort: 8000, name: http, protocol: TCP }
          env:
          - { name: VLLM_HOST_IP, value: "192.168.74.1" }
          - { name: VLLM_ALLOW_LONG_MAX_MODEL_LEN, value: "1" }
          - { name: NCCL_SOCKET_IFNAME, value: "eth2" }
          - { name: GLOO_SOCKET_IFNAME, value: "eth2" }
          - { name: TP_SOCKET_IFNAME, value: "eth2" }
          - { name: NCCL_IB_HCA, value: "mlx5_1" }
          - { name: NCCL_IB_GID_INDEX, value: "3" }
          - { name: NCCL_IB_DISABLE, value: "0" }
          - { name: NCCL_IB_ROCE_VERSION_NUM, value: "2" }
          - { name: NCCL_NET, value: "IB" }
          - { name: NCCL_NVLS_ENABLE, value: "0" }
          - { name: NCCL_CUMEM_ENABLE, value: "0" }
          - { name: NCCL_IGNORE_CPU_AFFINITY, value: "1" }
          - { name: NCCL_DEBUG, value: "WARN" }
          - { name: TORCH_CUDA_ARCH_LIST, value: "12.1a" }
          - { name: FLASHINFER_CUDA_ARCH_LIST, value: "12.1a" }
          - { name: HF_HOME, value: "/models/huggingface" }
          - { name: HF_HUB_OFFLINE, value: "1" }
          - { name: TRANSFORMERS_OFFLINE, value: "1" }
          securityContext:
            privileged: true
            capabilities:
              add: ["IPC_LOCK", "SYS_RESOURCE"]
          resources:
            requests: { memory: "90Gi", cpu: "8000m", nvidia.com/gpu: "1" }
            limits: { memory: "96Gi", cpu: "12000m", nvidia.com/gpu: "1" }
          volumeMounts:
          - { name: models, mountPath: /models }
          - { name: shm, mountPath: /dev/shm }
          - { name: infiniband, mountPath: /dev/infiniband }
          - { name: sys-ib, mountPath: /sys/class/infiniband }
          - { name: qwen-patches, mountPath: /qwen-patches }
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 180
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
        volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: infiniband
          hostPath: { path: /dev/infiniband, type: Directory }
        - name: sys-ib
          hostPath: { path: /sys/class/infiniband, type: Directory }
        - name: models
          persistentVolumeClaim: { claimName: qwen38-head-models }
        - name: download-script
          configMap:
            name: qwen38-download-script
        - name: qwen-patches
          configMap:
            name: qwen-patches
    workerTemplate:
      metadata:
        labels:
          app: qwen38
          role: worker
      spec:
        terminationGracePeriodSeconds: 120
        hostNetwork: true
        hostIPC: true
        dnsPolicy: ClusterFirstWithHostNet
        enableServiceLinks: false
        nodeSelector:
          kubernetes.io/hostname: spark-1
        initContainers:
        - name: drop-caches
          image: busybox:1.38
          command: [sh, -c, "echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true"]
          securityContext:
            privileged: true
          resources:
            requests: { memory: "64Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "500m" }
        - name: download-models
          image: vllm/vllm-openai@sha256:3b0e188ffceb3d07e09c3cb5215433a0020eacf02d7f882ed3a8bfd15454477e
          command: [/bin/bash]
          args: [/scripts/download-and-validate.sh]
          env:
          - { name: MODEL_DIR, value: "/models/qwen38" }
          - { name: HF_REPO, value: "nvidia/Qwen3.8-Flash-Next-NVFP4" }
          - { name: HF_REVISION, value: "fc694b54fb0174e0913e6adf86691ef85a4ead47" }
          - { name: HUGGING_FACE_HUB_TOKEN, valueFrom: { secretKeyRef: { name: hf-secret, key: HF_TOKEN } } }
          - { name: HF_HOME, value: "/models/huggingface" }
          - { name: HF_HUB_OFFLINE, value: "0" }
          - { name: TRANSFORMERS_OFFLINE, value: "0" }
          volumeMounts:
          - { name: models, mountPath: /models }
          - { name: download-script, mountPath: /scripts }
          resources:
            requests: { memory: "4Gi", cpu: "2000m" }
            limits: { memory: "8Gi", cpu: "4000m" }
        containers:
        - name: drop-caches-loop
          image: busybox:1.38
          command: [sh, -c, "while true; do sleep 15; echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true; done"]
          securityContext:
            privileged: true
          resources:
            requests: { memory: "64Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "500m" }
        - name: vllm
          image: vllm/vllm-openai@sha256:3b0e188ffceb3d07e09c3cb5215433a0020eacf02d7f882ed3a8bfd15454477e
          # Upstream MiaAI-Lab arm64 image; patches below are applied at startup.
          command: [bash, -c]
          args:
          - |
            set -euo pipefail
