              --hf-overrides '{"text_config":{"rope_parameters":{"rope_type":"yarn","factor":4.0,"original_max_position_embeddings":262144}}}' \
              --nnodes 2 --node-rank 1 --master-addr 192.168.74.1 --master-port 26400
          env:
          - { name: VLLM_HOST_IP, value: "192.168.74.2" }
          - { name: VLLM_ALLOW_LONG_MAX_MODEL_LEN, value: "1" }
          - { name: NCCL_SOCKET_IFNAME, value: "eth2" }
