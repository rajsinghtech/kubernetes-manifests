# Ported from clusters/*/apps/smartctl-exporter/config/prometheusrule.yaml.
# Loaded into every tenant. The smartctl_* rules are inert where the exporter
# is absent; the interim hwmon rules below use node-exporter instead.
namespace: smartctl
groups:
  - name: smartctl-exporter.rules
    rules:
      - alert: SmartDeviceHighTemperature
        expr: |-
          smartctl_device_temperature{temperature_type="current"} > 65
        for: 5m
        annotations:
          summary: >-
            Mounted drive {{ $labels.device }} on device {{ $labels.instance }} has a temperature higher than 65°C
        labels:
          severity: critical

      # Interim per-sensor path for the smartctl-exporter gap tracked in #2936.
      # node-exporter labels the NVMe hwmon sensors explicitly: temp1 is the
      # composite, while temp2/temp3 are Sensor 1/Sensor 2. The temp_max and
      # temp_crit series on temp1 carry each device's own reported component
      # limits, so these comparisons do not use one fleet-wide temperature.
      # This also supplies thermal coverage in St Petersburg, where
      # smartctl-exporter is not deployed. Remove this path when the
      # smartctl-exporter gains nested NVMe sensor support (upstream #303/#304).
      - alert: SmartDeviceNVMeSensorHigh
        expr: |-
          (
            node_hwmon_temp_celsius{chip=~"nvme_.*",sensor!="temp1"}
            >= on (cluster, instance, chip) group_left
              node_hwmon_temp_max_celsius{chip=~"nvme_.*",sensor="temp1"}
          )
          * on (cluster, instance, chip, sensor) group_left(label)
            node_hwmon_sensor_label{
              chip=~"nvme_.*",
              sensor!="temp1",
              label=~"Sensor .*",
            }
        for: 5m
        annotations:
          summary: >-
            NVMe {{ $labels.chip }} on {{ $labels.instance }} has
            {{ $labels.label }} at or above its device-reported warning temperature
          description: >-
            The {{ $labels.label }} reading for {{ $labels.chip }} is at or above
            that device's node-exporter hwmon warning/component limit. This is
            an interim per-sensor alert because smartctl-exporter v0.14.0
            omits nested NVMe sensors; see manifests issue #2936 and upstream
            smartctl-exporter issues #303/#304.
        labels:
          severity: warning

      - alert: SmartDeviceNVMeSensorCritical
        expr: |-
          (
            node_hwmon_temp_celsius{chip=~"nvme_.*",sensor!="temp1"}
            >= on (cluster, instance, chip) group_left
              node_hwmon_temp_crit_celsius{chip=~"nvme_.*",sensor="temp1"}
          )
          * on (cluster, instance, chip, sensor) group_left(label)
            node_hwmon_sensor_label{
              chip=~"nvme_.*",
              sensor!="temp1",
              label=~"Sensor .*",
            }
        for: 5m
        annotations:
          summary: >-
            NVMe {{ $labels.chip }} on {{ $labels.instance }} has
            {{ $labels.label }} at or above its device-reported critical
            temperature
          description: >-
            The {{ $labels.label }} reading for {{ $labels.chip }} is at or above
            that device's node-exporter hwmon critical/component limit. This
            is an interim per-sensor alert because smartctl-exporter v0.14.0
            omits nested NVMe sensors; see manifests issue #2936 and upstream
            smartctl-exporter issues #303/#304.
        labels:
          severity: critical

      - alert: SmartDeviceTestFailed
        expr: |-
          (smartctl_device_smart_status != 1 or smartctl_device_status != 1)
        for: 5m
        annotations:
          summary: >-
            Mounted drive {{ $labels.device }} on device {{ $labels.instance }} did not pass its SMART test
        labels:
          severity: critical

      - alert: SmartDeviceCriticalWarning
        expr: |-
          smartctl_device_critical_warning != 0
        for: 5m
        annotations:
          summary: >-
            Mounted drive {{ $labels.device }} on device {{ $labels.instance }} is in a critical state
        labels:
          severity: critical

      - alert: SmartDeviceMediaErrors
        expr: |-
          smartctl_device_media_errors != 0
        for: 5m
        annotations:
          summary: >-
            Mounted drive {{ $labels.device }} on device {{ $labels.instance }} has media errors
        labels:
          severity: critical

      - alert: SmartDeviceAvailableSpareUnderThreshold
        expr: |-
          smartctl_device_available_spare_threshold > smartctl_device_available_spare
        for: 5m
        annotations:
          summary: >-
            Device {{ $labels.device }} on instance {{ $labels.instance }} is under available spare threshold
        labels:
          severity: critical

      - alert: SmartDeviceInterfaceSlow
        expr: |-
          smartctl_device_interface_speed{speed_type="current"} != on(device, instance, namespace, pod) smartctl_device_interface_speed{speed_type="max"}
        for: 5m
        annotations:
          summary: >-
            Device {{ $labels.device }} on instance {{ $labels.instance }} interface is slower than it should be
        labels:
          severity: critical

      # Early warning for HDD media wear before overall SMART status flips.
      # Metric/labels verified from live smartctl-exporter scrape on
      # Robbinsdale tank (10.1.0.24): smartctl_device_attribute with
      # attribute_name=Reallocated_Sector_Ct|Current_Pending_Sector and
      # attribute_value_type=raw. Mimir query API was unhealthy
      # (query_ingesters_within config fault) at authoring time, so the
      # expression was validated against the exporter /metrics surface that
      # Prometheus scrapes into the talos-robbinsdale tenant.
      #
      # Pages when raw realloc or pending-sector count rises by >=1 over 24h
      # and stays elevated for 6h. Flat-but-already-failed disks (tank sda/
      # sdb/sdc today) continue to page via SmartDeviceTestFailed; this rule
      # is for growth before that flip.
      - alert: SmartDeviceSectorCountGrowing
        expr: |-
          (
            increase(
              smartctl_device_attribute{
                attribute_name=~"Reallocated_Sector_Ct|Current_Pending_Sector",
                attribute_value_type="raw"
              }[24h]
            ) >= 1
          )
        for: 6h
        annotations:
          summary: >-
            Drive {{ $labels.device }} on {{ $labels.instance }} is accumulating
            {{ $labels.attribute_name }} (raw +{{ printf "%.0f" $value }} over 24h)
          description: >-
            SMART attribute {{ $labels.attribute_name }} raw count grew by at
            least 1 over the last 24h and stayed elevated for 6h. This is the
            early-warning path for media failure before overall SMART status
            flips (SmartDeviceTestFailed). Plan replacement; do not silence
            while the count is still climbing.
        labels:
          severity: critical
