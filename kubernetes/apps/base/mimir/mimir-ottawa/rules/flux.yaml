# Ported from clusters/common/apps/flux-system/flux-instance/app/prometheusrule.yaml.
namespace: flux
groups:
  - name: flux-instance.rules
    rules:
      - alert: FluxInstanceAbsent
        expr: absent(flux_instance_info{exported_namespace="flux-system",name="flux"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Flux instance is absent
      - alert: FluxInstanceNotReady
        expr: flux_instance_info{exported_namespace="flux-system",name="flux",ready!="True"}
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Flux instance is not ready

      - alert: FluxKustomizationNotReady
        expr: |
          max by (cluster, namespace, name, path) (
            flux_resource_info{
              kind="Kustomization",
              ready="False",
              suspended="False"
            } == 1
          )
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Flux Kustomization {{ $labels.name }} is not ready
          description: >-
            Kustomization {{ $labels.name }} at {{ $labels.path }} has remained
            not ready for 15 minutes. Inspect its current condition and root
            dependency before investigating dependent resources.

      - alert: FluxKustomizationUnknown
        expr: |
          max by (cluster, namespace, name, path) (
            flux_resource_info{
              kind="Kustomization",
              ready="Unknown",
              suspended="False"
            } == 1
          )
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: Flux Kustomization {{ $labels.name }} has unknown readiness
          description: >-
            Kustomization {{ $labels.name }} at {{ $labels.path }} has remained
            in an unknown readiness state for 30 minutes. Inspect its current
            condition and root dependency before investigating dependent
            resources.

      - alert: FluxHelmReleaseNotReady
        expr: |
          max by (cluster, namespace, name) (
            flux_resource_info{
              kind="HelmRelease",
              ready="False",
              suspended="False"
            } == 1
          )
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Flux HelmRelease {{ $labels.namespace }}/{{ $labels.name }} is not ready
          description: >-
            HelmRelease {{ $labels.namespace }}/{{ $labels.name }} has remained
            not ready for 15 minutes. Inspect its current conditions, including
            whether it is stalled or has been rolled back.
