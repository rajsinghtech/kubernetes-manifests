# A missing registry manifest is actionable only when a running workload still
# references it. The exporter distinguishes a definitive 404 from an unknown
# result so registry reachability problems never page as image deletion.
namespace: running-workload-images
groups:
  - name: running-workload-images.rules
    rules:
      - alert: RunningWorkloadImageMissing
        expr: |
          running_workload_image_registry_probe_references{status="missing"} > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Running workload image is missing from its registry
          description: >-
            {{ $labels.image }} is referenced by {{ $value }} running pod
            container(s), but its OCI manifest endpoint has returned a
            definitive 404 for at least 15 minutes. A cached pod may continue
            running until restart, eviction, drain, or rescheduling makes the
            missing image an outage. Query
            running_workload_image_registry_probe_reference_info with the image
            label to enumerate affected pods before changing the workload or
            registry.

      - alert: RunningWorkloadImageProbeUnknown
        expr: |
          running_workload_image_registry_probe_references{status="unknown"} > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Running workload image registry status is unknown
          description: >-
            The registry probe cannot determine whether {{ $labels.image }} is
            pullable for {{ $value }} running pod container(s). This is a
            network, TLS, authentication, rate-limit, or registry-server
            error, not evidence that the image is missing. Restore probe
            reachability before treating it as an image-loss incident.

      - alert: RunningWorkloadImageProbeUnavailable
        expr: |
          absent(running_workload_image_registry_probe_scan_success)
          or running_workload_image_registry_probe_scan_success == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Running workload image probe is unavailable
          description: >-
            The running-workload image probe has not completed a successful
            Kubernetes/API and registry scan for at least 15 minutes. Image
            deletion detection is blind until the probe is healthy again.
