# Ported from clusters/common/apps/garage/app/prometheusrule.yaml.
namespace: garage
groups:
  - name: garage.rules
    rules:
      # probe_success==0 on the local serving probe means /health returned
      # non-2xx (503 = a partition lost write-quorum) or the endpoint is
      # unreachable. Scoped to target=local so a known-down remote region's
      # cross-cluster probe doesn't fire this.
      - alert: GarageServingUnavailable
        expr: probe_success{service="garage", check="serving", target="local"} == 0
        for: 3m
        annotations:
          summary: Garage cannot serve writes in this region ({{ $labels.instance }})
          description: >-
            The Garage /health serving probe has been non-2xx for 3m
            (503 Unavailable = a partition lost its write-quorum of up storage
            nodes, or the admin endpoint is unreachable). Reads may still work
            in degraded mode, but writes are failing. With replication.factor=2
            this is one storage node away from a full write outage — restore the
            missing storage node or add write headroom.
        labels:
          severity: critical

      # The gateway tier is the S3 client path (COMMON_S3_ENDPOINT ->
      # garage-gateway svc). Fires when the gateway Service has no reachable
      # endpoint — clients fail — even when storage is up.
      - alert: GarageGatewayUnreachable
        expr: probe_success{service="garage", tier="gateway", check="port-open", target="local"} == 0
        for: 2m
        annotations:
          summary: Garage gateway tier unreachable in this region ({{ $labels.instance }})
          description: >-
            The garage-gateway Service has had no reachable endpoint for 2m.
            In-cluster S3 clients reach Garage through it (COMMON_S3_ENDPOINT),
            so they are failing. Check the gateway pods (garage-gateway-N) and
            their readiness — storage may still be up (this won't show in the
            storage probes).
        labels:
          severity: critical

      # ---- cluster integrity (durability), distinct from the probes above ----
      # The two probes above measure the SERVING path. On 2026-09-07 a storage
      # node (asuka) silently left the cluster for 4.5h after an image upgrade
      # (km#2751) and both probes stayed green the whole time — correctly, since
      # every partition kept quorum and Garage kept serving. Nothing measured
      # durability, so a lost replica on 12 partitions went unnoticed until it
      # was found by accident. See corp/bhaiya#725.
      #
      # Observed during that incident, which is what these thresholds are
      # calibrated against:
      #   cluster_available=1  cluster_partitions_quorum=256  <- probes green
      #   cluster_healthy=0    cluster_partitions_all_ok=244  <- degraded
      - alert: GarageClusterUnhealthy
        expr: min by (cluster) (cluster_healthy) == 0
        for: 15m
        annotations:
          summary: Garage cluster reports unhealthy in {{ $labels.cluster }}
          description: >-
            Garage's own cluster_healthy has been 0 for 15m. The cluster is
            still serving (see GarageServingUnavailable, which is separate), so
            this is a durability problem, not an outage: a storage node is
            disconnected or partitions are under-replicated. Run
            `kubectl -n garage exec garage-gateway-0-0 -- /garage status` and
            compare HEALTHY against FAILED NODES. A node whose pod is Running
            with 0 restarts can still be absent from the cluster — check its
            RPC endpoint answers, since a refused connection means the process
            is up but its port mapping did not rebind.
        labels:
          severity: warning

      # Under-replication: every partition still has quorum, so reads and
      # writes work, but replicas are missing and a second failure loses data.
      - alert: GarageClusterPartitionsUnderReplicated
        expr: >-
          min by (cluster) (cluster_partitions_all_ok)
            < min by (cluster) (cluster_partitions)
        for: 30m
        annotations:
          summary: Garage partitions under-replicated in {{ $labels.cluster }}
          description: >-
            cluster_partitions_all_ok has been below cluster_partitions for
            30m, so some partitions are missing a replica while still holding
            quorum. Nothing is failing yet and it will not appear in the
            serving probes. With replication.factor=2 this is one node away
            from data loss on the affected partitions.
        labels:
          severity: warning

      # Quorum loss is the escalation: reads in the affected partitions fail.
      # Inert today (quorum 256/256 even with a node down), which is the point
      # — it distinguishes degraded-but-serving from actually broken.
      - alert: GarageClusterPartitionsWithoutQuorum
        expr: >-
          min by (cluster) (cluster_partitions_quorum)
            < min by (cluster) (cluster_partitions)
        for: 5m
        annotations:
          summary: Garage partitions have lost quorum in {{ $labels.cluster }}
          description: >-
            cluster_partitions_quorum is below cluster_partitions: some
            partitions no longer have enough up nodes to serve. Under
            consistencyMode=degraded reads come from a single replica and may
            still succeed; writes to those partitions fail. Restore the missing
            storage nodes.
        labels:
          severity: critical

      # Federation reachability is a separate fact from partition quorum.
      # Keep the raw Garage target labels: cluster identifies the tenant and
      # pod/instance identifies the vantage point that cannot see all peers.
      # Aggregating this away would hide asymmetric views such as Ottawa 17/18
      # versus Robbinsdale 16/18 while another vantage point still has quorum.
      - alert: GarageFederationPeerConnectivityDegraded
        expr: cluster_connected_nodes{job="garage",namespace="garage",endpoint="admin"} < 18
        for: 15m
        annotations:
          summary: >-
            Garage federation connectivity degraded from {{ $labels.pod }}
            ({{ $labels.cluster }})
          description: >-
            This Garage admin vantage point sees {{ $value }} of the expected
            18 federation peers. The count is per scrape target, not a fleet
            aggregate; other sites may see a different subset. Check
            inter-site RPC transport (DNS, TCP 3901, Tailscale, routing, and
            policy) before treating partition quorum as proof of federation
            health.
        labels:
          severity: warning
