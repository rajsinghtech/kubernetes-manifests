# Ported from clusters/common/apps/monitoring/config/prometheusrules.yaml.
# Mimir ruler evaluates these per tenant; the PrometheusRule CRs are no longer
# evaluated now that Prometheus runs in agent mode.
namespace: monitoring
groups:
  - name: container.rules
    rules:
      - alert: BhaiyaPodEvicted
        expr: |
          max by (cluster, namespace, pod, uid, reason) (
            kube_pod_status_reason{namespace="bhaiya",reason="Evicted"}
          )
          * on (cluster, namespace, pod, uid) group_left(node)
          max by (cluster, namespace, pod, uid, node) (
            kube_pod_info{namespace="bhaiya",node!=""}
          )
          == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Bhaiya pod {{ $labels.pod }} was evicted from node {{ $labels.node }}.
          description: >-
            This is a kubelet eviction signal, distinct from a container
            OOMKilled termination or a Kata sandbox exit. Correlate the pod
            event with pod info, node pressure, and
            NodeKubeletUnhealthyWhileReady.

      - alert: OomKilled
        expr: |
          (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1)
          and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
        for: 0m
        annotations:
          summary: >-
            Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }}
            has been OOMKilled {{ $value }} times in the last 10 minutes.
        labels:
          severity: critical

      - alert: ContainerHighCpuUtilization
        expr: |
          (sum(rate(container_cpu_usage_seconds_total{container!="",pod!=""}[5m])) by (pod, container, namespace)
          / sum(kube_pod_container_resource_limits{resource="cpu",container!=""}) by (pod, container, namespace)) * 100 > 90
        for: 15m
        annotations:
          summary: >-
            Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }}
            is using {{ printf "%.0f" $value }}% of its CPU limit.
        labels:
          severity: warning

      - alert: ContainerHighMemoryUtilization
        expr: |
          (sum(container_memory_working_set_bytes{container!="",pod!=""}) by (pod, container, namespace)
          / sum(kube_pod_container_resource_limits{resource="memory",container!=""}) by (pod, container, namespace)) * 100 > 90
        for: 15m
        annotations:
          summary: >-
            Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }}
            is using {{ printf "%.0f" $value }}% of its memory limit.
        labels:
          severity: warning

  - name: kata-virtiofs.rules
    rules:
      # A fixed Nix workspace image can legitimately use roughly 30% of the
      # daemon's FD limit for its overlay-backed rootfs. A level-only signal is
      # deliberately warning: the incident data showed a steady ~57% plateau
      # without proving that the level caused the sandbox loss. Growth and an
      # observed termination are the high-salience signals below.
      - alert: KataVirtioFSFileDescriptorPressure
        expr: |
          (
            max by (cluster, namespace, pod) (
              container_file_descriptors{namespace="bhaiya",pod=~"sandbox-.+"}
            )
            /
            max by (cluster, namespace, pod) (
              container_ulimits_soft{namespace="bhaiya",pod=~"sandbox-.+",ulimit="max_open_files"}
            )
          ) * 100 > 50
        for: 5m
        annotations:
          summary: >-
            Kata virtio-fs for {{ $labels.namespace }}/{{ $labels.pod }} is using
            {{ printf "%.0f" $value }}% of its file-descriptor limit.
          description: >-
            This is a level-only signal, not proof of an imminent sandbox loss.
            Check KataVirtioFSFileDescriptorGrowth for a rising signal and
            inspect the sandbox/node before it becomes unavailable. If the
            workspace is degraded, restart-to-remount is the recovery; do not
            reset or recreate the workspace because those paths can discard the
            PVC.
        labels:
          severity: warning

      - alert: KataVirtioFSFileDescriptorGrowth
        expr: |
          (
            deriv(
              (
                max by (cluster, namespace, pod) (
                  container_file_descriptors{namespace="bhaiya",pod=~"sandbox-.+"}
                )
                /
                max by (cluster, namespace, pod) (
                  container_ulimits_soft{namespace="bhaiya",pod=~"sandbox-.+",ulimit="max_open_files"}
                )
              )[30m:]
            ) * 100 * 60 > 1
          )
          and
          (
            (
              max by (cluster, namespace, pod) (
                container_file_descriptors{namespace="bhaiya",pod=~"sandbox-.+"}
              )
              /
              max by (cluster, namespace, pod) (
                container_ulimits_soft{namespace="bhaiya",pod=~"sandbox-.+",ulimit="max_open_files"}
              )
            ) * 100 > 25
          )
        for: 5m
        annotations:
          summary: >-
            Kata virtio-fs for {{ $labels.namespace }}/{{ $labels.pod }} is
            climbing at {{ printf "%.1f" $value }} percentage points per minute.
          description: >-
            Inspect the sandbox and its node now; this alert detects sustained
            growth rather than a steady file-descriptor level. If the workspace
            is degraded, restart-to-remount is the recovery; do not reset or
            recreate the workspace because those paths can discard the PVC.
        labels:
          severity: critical

      - alert: KataVirtioFSFileDescriptorCritical
        expr: |
          (
            max by (cluster, namespace, pod) (
              container_file_descriptors{namespace="bhaiya",pod=~"sandbox-.+"}
            )
            /
            max by (cluster, namespace, pod) (
              container_ulimits_soft{namespace="bhaiya",pod=~"sandbox-.+",ulimit="max_open_files"}
            )
          ) * 100 > 75
        for: 1m
        annotations:
          summary: >-
            Kata virtio-fs for {{ $labels.namespace }}/{{ $labels.pod }} is using
            {{ printf "%.0f" $value }}% of its file-descriptor limit.
          description: >-
            Treat this sustained high level as urgent and inspect the Kata
            runtime/node. If the workspace is degraded, restart-to-remount is
            the recovery; do not reset or recreate the workspace because those
            paths can discard the PVC.
        labels:
          severity: critical

      # kube-state-metrics and the event exporter do not expose SandboxChanged,
      # Dead agent, or missing clh.sock as Prometheus metrics. The observed
      # failure did leave an actionable proxy: the Kata workspace container's
      # last termination became Error/exit 255. Keep this bounded to recent
      # terminations so the last-termination gauge does not page forever.
      - alert: KataSandboxExit255
        expr: |
          (
            (
              kube_pod_container_status_last_terminated_exitcode{
                namespace="bhaiya",pod=~"sandbox-.+",container="workspace"
              } == 255
            )
            and on (cluster, namespace, pod, uid)
            kube_pod_container_status_last_terminated_reason{
              namespace="bhaiya",pod=~"sandbox-.+",container="workspace",reason="Error"
            }
          )
          and on (cluster, namespace, pod, uid)
          max by (cluster, namespace, pod, uid) (
            kube_pod_runtimeclass_name_info{
              namespace="bhaiya",pod=~"sandbox-.+",runtimeclass_name=~"kata-.*"
            }
          )
          and on (cluster, namespace, pod, uid)
          (
            time()
            - kube_pod_container_status_last_terminated_timestamp{
                namespace="bhaiya",pod=~"sandbox-.+",container="workspace"
              }
            < 15 * 60
          )
        for: 0m
        annotations:
          summary: >-
            Kata sandbox {{ $labels.namespace }}/{{ $labels.pod }} terminated
            its workspace container with exit code 255.
          description: >-
            kube-state-metrics does not retain the exact SandboxChanged, Dead
            agent, or missing clh.sock event name; inspect pod events and
            Kata/containerd logs to identify the cause. Restart-to-remount is
            the recovery; do not reset or recreate the workspace because those
            paths can discard the PVC.
        labels:
          severity: critical

  - name: node.rules
    rules:
      - alert: NodeHighCpuUsage
        expr: |
          (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) * 100 > 90
        for: 15m
        annotations:
          summary: >-
            Node {{ $labels.instance }} has high CPU usage ({{ printf "%.0f" $value }}%).
        labels:
          severity: warning

      - alert: NodeHighMemoryUsage
        expr: |
          (
            (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
          )
          unless on (cluster, instance)
          (
            node_memory_MemTotal_bytes{cluster="talos-stpetersburg"}
            > 100 * 1024 * 1024 * 1024
          )
        for: 15m
        annotations:
          summary: >-
            Node {{ $labels.instance }} has high memory usage ({{ printf "%.0f" $value }}%).
        labels:
          severity: warning

      - alert: NodeDiskPressure
        expr: |
          (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) * 100 > 85
        for: 15m
        annotations:
          summary: >-
            Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is {{ printf "%.0f" $value }}% full.
        labels:
          severity: warning

      - alert: NodeDiskCritical
        expr: |
          (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) * 100 > 95
        for: 5m
        annotations:
          summary: >-
            Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is {{ printf "%.0f" $value }}% full.
        labels:
          severity: critical

      - alert: NodeNotReady
        expr: |
          kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 5m
        annotations:
          summary: >-
            Node {{ $labels.node }} is not ready.
        labels:
          severity: critical

  # GPU rules are inert on Ottawa/Robbinsdale because DCGM families are absent.
  # St. Petersburg is the only current NVIDIA/DCGM cluster; do not add GPU
  # scrape requirements to CPU-only nodes or to the Intel-plugin cluster.
  - name: gpu.rules
    rules:
      - record: node_gpu_temperature_celsius:max
        expr: max by (cluster, instance, gpu, UUID, modelName) (DCGM_FI_DEV_GPU_TEMP)

      - record: node_gpu_pcie_replay_errors:rate5m
        expr: sum by (cluster, instance, gpu, UUID, modelName) (rate(DCGM_FI_DEV_PCIE_REPLAY_COUNTER[5m]))

      - record: node_gpu_nvlink_bandwidth_bytes_per_second:rate5m
        expr: sum by (cluster, instance, gpu, UUID, modelName) (rate(DCGM_FI_DEV_NVLINK_BANDWIDTH_TOTAL[5m]))

      - alert: NvidiaGpuTemperatureHigh
        expr: node_gpu_temperature_celsius:max > 85
        for: 10m
        annotations:
          summary: >-
            NVIDIA GPU {{ $labels.gpu }} on {{ $labels.instance }} is hot
            ({{ printf "%.0f" $value }}°C).
        labels:
          severity: warning

      - alert: NvidiaGpuPcieReplayErrors
        expr: node_gpu_pcie_replay_errors:rate5m > 0
        for: 10m
        annotations:
          summary: >-
            NVIDIA GPU {{ $labels.gpu }} on {{ $labels.instance }} is reporting
            PCIe replay errors.
        labels:
          severity: warning

  # Packet loss is derived only for configured blackbox targets. It does not
  # invent a node-level signal where no probe path exists.
  - name: packet-loss.rules
    rules:
      - record: blackbox:packet_loss_ratio5m
        expr: 1 - avg_over_time(probe_success[5m])

  - name: kubernetes.rules
    rules:
      - alert: KubeAPILatencyHigh
        expr: |
          sum(rate(apiserver_request_duration_seconds_sum{verb!~"WATCH|CONNECT"}[5m])) by (verb, resource)
            /
          sum(rate(apiserver_request_duration_seconds_count{verb!~"WATCH|CONNECT"}[5m])) by (verb, resource) > 4
        for: 10m
        annotations:
          summary: >-
            Kubernetes API server has high average latency for {{ $labels.verb }} {{ $labels.resource }} requests (> 4s).
        labels:
          severity: warning

      - alert: KubeAPIErrorsHigh
        expr: |
          sum(rate(apiserver_request_total{code=~"5.."}[5m])) by (resource, verb)
          / sum(rate(apiserver_request_total[5m])) by (resource, verb) * 100 > 5
        for: 10m
        annotations:
          summary: >-
            Kubernetes API server has high error rate ({{ printf "%.1f" $value }}%) for {{ $labels.verb }} {{ $labels.resource }}.
        labels:
          severity: warning

      - alert: PodCrashLooping
        expr: |
          increase(kube_pod_container_status_restarts_total[1h]) > 5
        for: 15m
        annotations:
          summary: >-
            Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping ({{ $value }} restarts in the last hour).
        labels:
          severity: warning

      - alert: PodNotReady
        expr: |
          sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown"}) > 0
        for: 15m
        annotations:
          summary: >-
            Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in a non-ready state for more than 15 minutes.
        labels:
          severity: warning

      - alert: DeploymentReplicasMismatch
        expr: |
          kube_deployment_spec_replicas != kube_deployment_status_replicas_available
        for: 15m
        annotations:
          summary: >-
            Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has {{ $value }} replicas mismatch.
        labels:
          severity: warning

  - name: dockerhub.rules
    rules:
      - alert: DockerhubRateLimitRisk
        expr: |
          count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
        for: 5m
        annotations:
          summary: >-
            There are {{ $value }} containers pulling from Dockerhub. This may lead to rate limiting.
        labels:
          severity: warning

  - name: prometheus.rules
    rules:
      - alert: PrometheusTargetDown
        expr: |
          up == 0
        for: 10m
        annotations:
          summary: >-
            Prometheus target {{ $labels.job }}/{{ $labels.instance }} is down.
        labels:
          severity: warning

      - alert: PrometheusRemoteWriteFailed
        expr: |
          sum by (cluster) (rate(prometheus_remote_storage_samples_failed_total[5m])) > 0
        for: 10m
        annotations:
          summary: >-
            Prometheus Agent in {{ $labels.cluster }} is dropping samples while
            remote-writing to Mimir.
        labels:
          severity: critical

  - name: kubelet.rules
    rules:
      # Override of the upstream kube-prometheus-stack KubeletDown rule, kept
      # from the agent-mode migration. Joins on `node` because our kubelet
      # ServiceMonitor's synthetic `up` series has an empty `cluster` label.
      - alert: KubeletDown
        expr: |
          absent(up{job="kubelet"} == 1) or
          (
            count by (node) (up{job="kubelet"} == 0)
            and on (node) kube_node_info
          ) > 0
        for: 15m
        annotations:
          summary: >-
            Kubelet on {{ $labels.node }} is down or unreachable.
        labels:
          severity: critical

  - name: watchdog.rules
    rules:
      # Dead man's switch: always-firing heartbeat that drives the Gatus
      # heartbeat receiver. Replaces the kube-prometheus-stack Watchdog default
      # rule, which is no longer created (defaultRules.create=false).
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: >-
            This is an always-firing alert used as an end-to-end liveness check
            for the alerting pipeline.
