rule_files:
  - ../velero-integrity.yaml
  - ../velero.yaml

evaluation_interval: 1m

tests:
  # Staleness is one alert per active schedule. A fresh success must not produce
  # a zero-valued alert series, while active schedules that missed one or more
  # daily runs must alert even when historical Backup objects have per-attempt
  # identities.
  - interval: 1m
    input_series:
      - series: 'velero_backup_last_successful_timestamp{cluster="talos-ottawa",namespace="velero-system",schedule="fresh-daily-backup"}'
        values: "-7200+0x20"
      - series: 'velero_cr_schedule_info{cluster="talos-ottawa",namespace="velero-system",schedule="fresh-daily-backup",phase="Enabled",paused="false"}'
        values: "1+0x20"
      - series: 'velero_backup_last_successful_timestamp{cluster="talos-ottawa",namespace="velero-system",schedule="stale-26h-backup"}'
        values: "-95040+0x20"
      - series: 'velero_cr_schedule_info{cluster="talos-ottawa",namespace="velero-system",schedule="stale-26h-backup",phase="Enabled",paused="false"}'
        values: "1+0x20"
      - series: 'velero_cr_backup_created_timestamp{cluster="talos-ottawa",namespace="velero-system",schedule="stale-26h-backup",backup="stale-26h-backup-20260907060000"}'
        values: "100+0x20"
      - series: 'velero_cr_backup_created_timestamp{cluster="talos-ottawa",namespace="velero-system",schedule="stale-26h-backup",backup="stale-26h-backup-20260906060000"}'
        values: "50+0x20"
      - series: 'velero_backup_last_successful_timestamp{cluster="talos-ottawa",namespace="velero-system",schedule="stale-49h-backup"}'
        values: "-179640+0x20"
      - series: 'velero_cr_schedule_info{cluster="talos-ottawa",namespace="velero-system",schedule="stale-49h-backup",phase="Enabled",paused="false"}'
        values: "1+0x20"
      - series: 'velero_cr_backup_created_timestamp{cluster="talos-ottawa",namespace="velero-system",schedule="stale-49h-backup",backup="stale-49h-backup-20260907060000"}'
        values: "100+0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: VeleroBackupStale
        exp_alerts:
          - exp_labels:
              cluster: talos-ottawa
              namespace: velero-system
              schedule: stale-26h-backup
              severity: critical
            exp_annotations:
              summary: Velero schedule stale-26h-backup has no recent successful backup
              description: >-
                Schedule stale-26h-backup has not reported a successful
                backup for more than 24 hours (one missed daily schedule). Check
                the Schedule, BackupStorageLocation, Velero server, and node-agent pods. This is a freshness/reporting
                guard; it cannot detect a backup that completes while silently
                missing data, and it also needs the Velero metric to remain
                scrapeable.
          - exp_labels:
              cluster: talos-ottawa
              namespace: velero-system
              schedule: stale-49h-backup
              severity: critical
            exp_annotations:
              summary: Velero schedule stale-49h-backup has no recent successful backup
              description: >-
                Schedule stale-49h-backup has not reported a successful
                backup for more than 24 hours (one missed daily schedule). Check
                the Schedule, BackupStorageLocation, Velero server, and node-agent pods. This is a freshness/reporting
                guard; it cannot detect a backup that completes while silently
                missing data, and it also needs the Velero metric to remain
                scrapeable.

  # A paused schedule is deliberate, but it must not silently remain without
  # backups forever. Seven days is longer than a normal maintenance window
  # while still material for daily member/platform data. The rule uses
  # lastBackup age because the Schedule CR has no pause-transition timestamp.
  - interval: 1m
    input_series:
      - series: 'velero_cr_schedule_info{cluster="talos-ottawa",namespace="velero-system",schedule="paused-old",phase="Enabled",paused="true"}'
        values: "1+0x20"
      - series: 'velero_cr_schedule_last_backup_timestamp{cluster="talos-ottawa",namespace="velero-system",schedule="paused-old"}'
        values: "-604801+0x20"
      - series: 'velero_cr_schedule_info{cluster="talos-ottawa",namespace="velero-system",schedule="paused-new",phase="Enabled",paused="true"}'
        values: "1+0x20"
      - series: 'velero_cr_schedule_last_backup_timestamp{cluster="talos-ottawa",namespace="velero-system",schedule="paused-new"}'
        values: "300+0x20"
      - series: 'velero_cr_schedule_info{cluster="talos-ottawa",namespace="velero-system",schedule="unpaused-old",phase="Enabled",paused="false"}'
        values: "1+0x20"
      - series: 'velero_cr_schedule_last_backup_timestamp{cluster="talos-ottawa",namespace="velero-system",schedule="unpaused-old"}'
        values: "-604801+0x20"
    alert_rule_test:
      - eval_time: 14m
        alertname: VeleroSchedulePausedTooLong
        exp_alerts: []
      - eval_time: 15m
        alertname: VeleroSchedulePausedTooLong
        exp_alerts:
          - exp_labels:
              cluster: talos-ottawa
              namespace: velero-system
              schedule: paused-old
              severity: warning
            exp_annotations:
              summary: Velero schedule paused-old has been paused for more than 7 days
              description: >-
                Schedule paused-old is intentionally paused and has gone more
                than seven days without a successful Backup. This is a reminder,
                not an outage assertion: confirm the maintenance window is
                still deliberate, then unpause the Schedule when its protected
                data should resume daily coverage. The seven-day threshold
                allows ordinary maintenance windows while preventing a paused
                member or platform schedule from becoming an indefinite silent
                gap. This alert clears when the Schedule is unpaused or deleted.

  # Historical metrics must not resurrect the reminder after a paused Schedule
  # is deleted. The unpaused-old case above covers the other clear path.
  - interval: 1m
    input_series:
      - series: 'velero_backup_last_successful_timestamp{cluster="talos-ottawa",schedule="deleted-while-paused"}'
        values: "-604801+0x20"
      - series: 'velero_cr_schedule_last_backup_timestamp{cluster="talos-ottawa",namespace="velero-system",schedule="deleted-while-paused"}'
        values: "-604801+0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: VeleroSchedulePausedTooLong
        exp_alerts: []

  # A deleted or paused Schedule must clear stale metrics from historical
  # Backup objects. Otherwise this alert becomes a permanent orphaned
  # incident after workspace or schedule cleanup.
  - interval: 1m
    input_series:
      - series: 'velero_backup_last_successful_timestamp{cluster="talos-ottawa",schedule="deleted-schedule"}'
        values: "-200000+0x20"
      - series: 'velero_cr_backup_created_timestamp{cluster="talos-ottawa",namespace="velero-system",schedule="deleted-schedule",backup="deleted-schedule-20260907020000"}'
        values: "100+0x20"
      - series: 'velero_backup_last_successful_timestamp{cluster="talos-ottawa",namespace="velero-system",schedule="paused-schedule"}'
        values: "-200000+0x20"
      - series: 'velero_cr_schedule_info{cluster="talos-ottawa",namespace="velero-system",schedule="paused-schedule",phase="Enabled",paused="true"}'
        values: "1+0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: VeleroBackupStale
        exp_alerts: []

  # Promtool fixes time() to the test evaluation time. Pin the same successful
  # timestamp on both sides of the 24-hour threshold so a wall-clock change
  # cannot turn this rule into a flaky test or silently invert its verdict.
  - interval: 5m
    input_series:
      - series: 'velero_backup_last_successful_timestamp{cluster="talos-ottawa",namespace="velero-system",schedule="boundary-backup"}'
        values: "0+0x360"
      - series: 'velero_cr_schedule_info{cluster="talos-ottawa",namespace="velero-system",schedule="boundary-backup",phase="Enabled",paused="false"}'
        values: "1+0x360"
    alert_rule_test:
      - eval_time: 23h
        alertname: VeleroBackupStale
        exp_alerts: []
      - eval_time: 25h
        alertname: VeleroBackupStale
        exp_alerts:
          - exp_labels:
              cluster: talos-ottawa
              namespace: velero-system
              schedule: boundary-backup
              severity: critical
            exp_annotations:
              summary: Velero schedule boundary-backup has no recent successful backup
              description: >-
                Schedule boundary-backup has not reported a successful
                backup for more than 24 hours (one missed daily schedule). Check
                the Schedule, BackupStorageLocation, Velero server, and node-agent pods. This is a freshness/reporting
                guard; it cannot detect a backup that completes while silently
                missing data, and it also needs the Velero metric to remain
                scrapeable.
