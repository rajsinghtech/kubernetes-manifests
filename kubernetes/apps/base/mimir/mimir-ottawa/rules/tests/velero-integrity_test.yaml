rule_files:
  - ../velero-integrity.yaml

evaluation_interval: 1m

tests:
  # Missing volume data on an active schedule is actionable, but a deleted or
  # paused schedule must not leave its last Backup as a permanent accumulator.
  - interval: 1m
    input_series:
      - series: 'velero_cr_backup_created_timestamp{cluster="talos-ottawa",namespace="velero-system",schedule="active-backup",backup="active-backup-latest"}'
        values: "100+0x20"
      - series: 'velero_cr_backup_info{cluster="talos-ottawa",namespace="velero-system",schedule="active-backup",backup="active-backup-latest",phase="Completed"}'
        values: "1+0x20"
      - series: 'velero_cr_schedule_info{cluster="talos-ottawa",namespace="velero-system",schedule="active-backup",phase="Enabled",paused="false"}'
        values: "1+0x20"
      - series: 'velero_cr_backup_created_timestamp{cluster="talos-ottawa",namespace="velero-system",schedule="paused-backup",backup="paused-backup-latest"}'
        values: "100+0x20"
      - series: 'velero_cr_backup_info{cluster="talos-ottawa",namespace="velero-system",schedule="paused-backup",backup="paused-backup-latest",phase="Completed"}'
        values: "1+0x20"
      - series: 'velero_cr_schedule_info{cluster="talos-ottawa",namespace="velero-system",schedule="paused-backup",phase="Enabled",paused="true"}'
        values: "1+0x20"
      - series: 'velero_cr_backup_created_timestamp{cluster="talos-ottawa",namespace="velero-system",schedule="deleted-backup",backup="deleted-backup-latest"}'
        values: "100+0x20"
      - series: 'velero_cr_backup_info{cluster="talos-ottawa",namespace="velero-system",schedule="deleted-backup",backup="deleted-backup-latest",phase="Completed"}'
        values: "1+0x20"
    alert_rule_test:
      - eval_time: 14m
        alertname: VeleroScheduleLatestBackupMissingVolumes
        exp_alerts: []
      - eval_time: 15m
        alertname: VeleroScheduleLatestBackupMissingVolumes
        exp_alerts:
          - exp_labels:
              cluster: talos-ottawa
              namespace: velero-system
              schedule: active-backup
              backup: active-backup-latest
              severity: critical
            exp_annotations:
              summary: Velero schedule active-backup latest Completed backup has no completed volume data
              description: >-
                The newest Backup for schedule active-backup is
                active-backup-latest, phase=Completed, and has no Completed
                PodVolumeBackup with bytesDone equal to totalBytes. That is not
                volume-data evidence: Kubernetes objects may be present while
                durable PVCs were never selected or never mounted, or a child
                may still be incomplete (corp/bhaiya#703). Confirm with
                `kubectl -n velero-system get podvolumebackup -l
                velero.io/backup-name=active-backup-latest` and the live pod
                volume mounts — do not trust the Backup phase or the existence
                of a PVB object. This alert only establishes that one
                byte-complete PVB exists; it does not prove every expected PVC
                is covered or that a restore works. Clears when a later Backup
                has a Completed PVB with matching byte counters.

  # A completed PVB with mismatched byte counters is a current target signal,
  # but a later clean attempt for the same pod and volume must clear the old
  # one-shot record.
  - interval: 1m
    input_series:
      - series: 'velero_cr_podvolumebackup_created_timestamp{cluster="talos-ottawa",namespace="velero-system",pod_namespace="home",pod_name="teaspoon",pod_uid="pod-uid",volume="home",pod_volume_backup="teaspoon-old-pvb",backup="teaspoon-old-backup",node="kaji"}'
        values: "100+0x20"
      - series: 'velero_cr_podvolumebackup_info{cluster="talos-ottawa",namespace="velero-system",pod_namespace="home",pod_name="teaspoon",pod_uid="pod-uid",volume="home",pod_volume_backup="teaspoon-old-pvb",backup="teaspoon-old-backup",node="kaji",phase="Completed"}'
        values: "1+0x20"
      - series: 'velero_cr_podvolumebackup_bytes_done{cluster="talos-ottawa",namespace="velero-system",pod_namespace="home",pod_name="teaspoon",pod_uid="pod-uid",volume="home",pod_volume_backup="teaspoon-old-pvb",backup="teaspoon-old-backup",node="kaji"}'
        values: "10+0x20"
      - series: 'velero_cr_podvolumebackup_bytes_total{cluster="talos-ottawa",namespace="velero-system",pod_namespace="home",pod_name="teaspoon",pod_uid="pod-uid",volume="home",pod_volume_backup="teaspoon-old-pvb",backup="teaspoon-old-backup",node="kaji"}'
        values: "20+0x20"
      - series: 'velero_cr_podvolumebackup_created_timestamp{cluster="talos-ottawa",namespace="velero-system",pod_namespace="home",pod_name="teaspoon",pod_uid="pod-uid",volume="home",pod_volume_backup="teaspoon-new-pvb",backup="teaspoon-new-backup",node="kaji"}'
        values: "200+0x20"
      - series: 'velero_cr_podvolumebackup_info{cluster="talos-ottawa",namespace="velero-system",pod_namespace="home",pod_name="teaspoon",pod_uid="pod-uid",volume="home",pod_volume_backup="teaspoon-new-pvb",backup="teaspoon-new-backup",node="kaji",phase="Completed"}'
        values: "1+0x20"
      - series: 'velero_cr_podvolumebackup_bytes_done{cluster="talos-ottawa",namespace="velero-system",pod_namespace="home",pod_name="teaspoon",pod_uid="pod-uid",volume="home",pod_volume_backup="teaspoon-new-pvb",backup="teaspoon-new-backup",node="kaji"}'
        values: "20+0x20"
      - series: 'velero_cr_podvolumebackup_bytes_total{cluster="talos-ottawa",namespace="velero-system",pod_namespace="home",pod_name="teaspoon",pod_uid="pod-uid",volume="home",pod_volume_backup="teaspoon-new-pvb",backup="teaspoon-new-backup",node="kaji"}'
        values: "20+0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: VeleroPodVolumeBackupBytesMismatch
        exp_alerts: []

  # A current completed PVB with mismatched counters still pages.
  - interval: 1m
    input_series:
      - series: 'velero_cr_podvolumebackup_created_timestamp{cluster="talos-ottawa",namespace="velero-system",pod_namespace="home",pod_name="broken",pod_uid="pod-uid",volume="home",pod_volume_backup="broken-pvb",backup="broken-backup",node="asuka"}'
        values: "200+0x20"
      - series: 'velero_cr_podvolumebackup_info{cluster="talos-ottawa",namespace="velero-system",pod_namespace="home",pod_name="broken",pod_uid="pod-uid",volume="home",pod_volume_backup="broken-pvb",backup="broken-backup",node="asuka",phase="Completed"}'
        values: "1+0x20"
      - series: 'velero_cr_podvolumebackup_bytes_done{cluster="talos-ottawa",namespace="velero-system",pod_namespace="home",pod_name="broken",pod_uid="pod-uid",volume="home",pod_volume_backup="broken-pvb",backup="broken-backup",node="asuka"}'
        values: "10+0x20"
      - series: 'velero_cr_podvolumebackup_bytes_total{cluster="talos-ottawa",namespace="velero-system",pod_namespace="home",pod_name="broken",pod_uid="pod-uid",volume="home",pod_volume_backup="broken-pvb",backup="broken-backup",node="asuka"}'
        values: "20+0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: VeleroPodVolumeBackupBytesMismatch
        exp_alerts:
          - exp_labels:
              cluster: talos-ottawa
              namespace: velero-system
              pod_namespace: home
              pod_name: broken
              pod_uid: pod-uid
              volume: home
              pod_volume_backup: broken-pvb
              backup: broken-backup
              node: asuka
              severity: critical
            exp_annotations:
              summary: Velero completed PVB broken-pvb has incomplete bytes
              description: >-
                The newest PodVolumeBackup for target home/broken (UID pod-uid,
                volume home) completed with bytesDone different from totalBytes.
                It was created within the last 24 hours. A later successful PVB
                for the same target clears this signal; inspect the PVB status
                and node-agent/Kopia logs because matching item counts do not
                establish volume integrity.

  # An abandoned mismatch is bounded by the same 24-hour horizon as the
  # current-target failure alert and must not accumulate forever.
  - interval: 1m
    input_series:
      - series: 'velero_cr_podvolumebackup_created_timestamp{cluster="talos-ottawa",namespace="velero-system",pod_namespace="home",pod_name="old",pod_uid="pod-uid",volume="home",pod_volume_backup="old-pvb",backup="old-backup",node="rei"}'
        values: "100+0x1505"
      - series: 'velero_cr_podvolumebackup_info{cluster="talos-ottawa",namespace="velero-system",pod_namespace="home",pod_name="old",pod_uid="pod-uid",volume="home",pod_volume_backup="old-pvb",backup="old-backup",node="rei",phase="Completed"}'
        values: "1+0x1505"
      - series: 'velero_cr_podvolumebackup_bytes_done{cluster="talos-ottawa",namespace="velero-system",pod_namespace="home",pod_name="old",pod_uid="pod-uid",volume="home",pod_volume_backup="old-pvb",backup="old-backup",node="rei"}'
        values: "10+0x1505"
      - series: 'velero_cr_podvolumebackup_bytes_total{cluster="talos-ottawa",namespace="velero-system",pod_namespace="home",pod_name="old",pod_uid="pod-uid",volume="home",pod_volume_backup="old-pvb",backup="old-backup",node="rei"}'
        values: "20+0x1505"
    alert_rule_test:
      - eval_time: 25h
        alertname: VeleroPodVolumeBackupBytesMismatch
        exp_alerts: []

  # A failed one-shot record from a scheduled Backup must stop alerting when a
  # newer Backup succeeds, even when the replacement pod has a new name and
  # UID. The schedule-level Backup identity is the current-state boundary;
  # the age bound prevents old abandoned records from paging forever.
  - interval: 1m
    input_series:
      - series: 'velero_cr_backup_created_timestamp{cluster="talos-ottawa",namespace="velero-system",schedule="home-backup",backup="teaspoon-old-backup"}'
        values: "100+0x20"
      - series: 'velero_cr_backup_created_timestamp{cluster="talos-ottawa",namespace="velero-system",schedule="home-backup",backup="teaspoon-new-backup"}'
        values: "200+0x20"
      - series: 'velero_cr_podvolumebackup_created_timestamp{cluster="talos-ottawa",namespace="velero-system",pod_namespace="home",pod_name="teaspoon",pod_uid="old-pod-uid",volume="home",pod_volume_backup="teaspoon-old-pvb",backup="teaspoon-old-backup",node="kaji"}'
        values: "100+0x20"
      - series: 'velero_cr_podvolumebackup_info{cluster="talos-ottawa",namespace="velero-system",pod_namespace="home",pod_name="teaspoon",pod_uid="old-pod-uid",volume="home",pod_volume_backup="teaspoon-old-pvb",backup="teaspoon-old-backup",node="kaji",phase="Failed"}'
        values: "1+0x20"
      - series: 'velero_cr_podvolumebackup_created_timestamp{cluster="talos-ottawa",namespace="velero-system",pod_namespace="home",pod_name="teaspoon-replacement",pod_uid="new-pod-uid",volume="home",pod_volume_backup="teaspoon-new-pvb",backup="teaspoon-new-backup",node="kaji"}'
        values: "200+0x20"
      - series: 'velero_cr_podvolumebackup_info{cluster="talos-ottawa",namespace="velero-system",pod_namespace="home",pod_name="teaspoon-replacement",pod_uid="new-pod-uid",volume="home",pod_volume_backup="teaspoon-new-pvb",backup="teaspoon-new-backup",node="kaji",phase="Completed"}'
        values: "1+0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: VeleroPodVolumeBackupFailed
        exp_alerts: []

  # A current failure still pages even when its parent Backup is no longer
  # exported. This is the case the old parent-Backup join could miss.
  - interval: 1m
    input_series:
      - series: 'velero_cr_podvolumebackup_created_timestamp{cluster="talos-ottawa",namespace="velero-system",pod_namespace="home",pod_name="broken",pod_uid="pod-uid",volume="home",pod_volume_backup="broken-pvb",backup="broken-backup",node="asuka"}'
        values: "200+0x20"
      - series: 'velero_cr_podvolumebackup_info{cluster="talos-ottawa",namespace="velero-system",pod_namespace="home",pod_name="broken",pod_uid="pod-uid",volume="home",pod_volume_backup="broken-pvb",backup="broken-backup",node="asuka",phase="Failed"}'
        values: "1+0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: VeleroPodVolumeBackupFailed
        exp_alerts:
          - exp_labels:
              cluster: talos-ottawa
              namespace: velero-system
              pod_namespace: home
              pod_name: broken
              pod_uid: pod-uid
              volume: home
              pod_volume_backup: broken-pvb
              backup: broken-backup
              node: asuka
              phase: Failed
              severity: warning
            exp_annotations:
              summary: Velero PodVolumeBackup Failed for broken/home
              description: >-
                The selected PodVolumeBackup for target home/broken (UID
                pod-uid, volume home) is Failed. It was created within the last
                24 hours and has remained in that state for at least five
                minutes. For a scheduled Backup, failures from older attempts
                are intentionally ignored, including when a replacement pod has
                a new name or UID; unparented/manual records are retained only
                within this 24-hour bound. Inspect the PVB status message,
                node-agent logs, and storage path before treating the target as
                restorable.

  # A Failed PVB belonging to the newest scheduled Backup remains actionable.
  # This is the positive counterpart to the recovery fixture above.
  - interval: 1m
    input_series:
      - series: 'velero_cr_backup_created_timestamp{cluster="talos-ottawa",namespace="velero-system",schedule="media-config-backup",backup="media-config-previous"}'
        values: "100+0x20"
      - series: 'velero_cr_backup_created_timestamp{cluster="talos-ottawa",namespace="velero-system",schedule="media-config-backup",backup="media-config-current"}'
        values: "200+0x20"
      - series: 'velero_cr_podvolumebackup_created_timestamp{cluster="talos-ottawa",namespace="velero-system",pod_namespace="media",pod_name="maintainerr",pod_uid="pod-uid",volume="config",pod_volume_backup="maintainerr-current-pvb",backup="media-config-current",node="asuka"}'
        values: "200+0x20"
      - series: 'velero_cr_podvolumebackup_info{cluster="talos-ottawa",namespace="velero-system",pod_namespace="media",pod_name="maintainerr",pod_uid="pod-uid",volume="config",pod_volume_backup="maintainerr-current-pvb",backup="media-config-current",node="asuka",phase="Failed"}'
        values: "1+0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: VeleroPodVolumeBackupFailed
        exp_alerts:
          - exp_labels:
              cluster: talos-ottawa
              namespace: velero-system
              pod_namespace: media
              pod_name: maintainerr
              pod_uid: pod-uid
              volume: config
              pod_volume_backup: maintainerr-current-pvb
              backup: media-config-current
              node: asuka
              phase: Failed
              schedule: media-config-backup
              severity: warning
            exp_annotations:
              summary: Velero PodVolumeBackup Failed for maintainerr/config
              description: >-
                The selected PodVolumeBackup for target media/maintainerr (UID
                pod-uid, volume config) is Failed. It was created within the
                last 24 hours and has remained in that state for at least five
                minutes. For a scheduled Backup, failures from older attempts
                are intentionally ignored, including when a replacement pod has
                a new name or UID; unparented/manual records are retained only
                within this 24-hour bound. Inspect the PVB status message,
                node-agent logs, and storage path before treating the target as
                restorable.

  # A first-ever failed PVB has no prior successful attempt to mask it and
  # must still alert when it belongs to the newest scheduled Backup.
  - interval: 1m
    input_series:
      - series: 'velero_cr_backup_created_timestamp{cluster="talos-ottawa",namespace="velero-system",schedule="new-service-backup",backup="new-service-current"}'
        values: "200+0x20"
      - series: 'velero_cr_podvolumebackup_created_timestamp{cluster="talos-ottawa",namespace="velero-system",pod_namespace="new-service",pod_name="worker",pod_uid="first-pod-uid",volume="data",pod_volume_backup="new-service-first-pvb",backup="new-service-current",node="kaji"}'
        values: "200+0x20"
      - series: 'velero_cr_podvolumebackup_info{cluster="talos-ottawa",namespace="velero-system",pod_namespace="new-service",pod_name="worker",pod_uid="first-pod-uid",volume="data",pod_volume_backup="new-service-first-pvb",backup="new-service-current",node="kaji",phase="Failed"}'
        values: "1+0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: VeleroPodVolumeBackupFailed
        exp_alerts:
          - exp_labels:
              cluster: talos-ottawa
              namespace: velero-system
              pod_namespace: new-service
              pod_name: worker
              pod_uid: first-pod-uid
              volume: data
              pod_volume_backup: new-service-first-pvb
              backup: new-service-current
              node: kaji
              phase: Failed
              schedule: new-service-backup
              severity: warning
            exp_annotations:
              summary: Velero PodVolumeBackup Failed for worker/data
              description: >-
                The selected PodVolumeBackup for target new-service/worker (UID
                first-pod-uid, volume data) is Failed. It was created within the
                last 24 hours and has remained in that state for at least five
                minutes. For a scheduled Backup, failures from older attempts
                are intentionally ignored, including when a replacement pod has
                a new name or UID; unparented/manual records are retained only
                within this 24-hour bound. Inspect the PVB status message,
                node-agent logs, and storage path before treating the target as
                restorable.

  # Cancellation is an operator action or a deliberate controller stop, not a
  # failed backup. It must not page as VeleroPodVolumeBackupFailed.
  - interval: 1m
    input_series:
      - series: 'velero_cr_podvolumebackup_created_timestamp{cluster="talos-ottawa",namespace="velero-system",pod_namespace="media",pod_name="overseerr",pod_uid="pod-uid",volume="config",pod_volume_backup="canceled-pvb",backup="config-backup",node="asuka"}'
        values: "200+0x20"
      - series: 'velero_cr_podvolumebackup_info{cluster="talos-ottawa",namespace="velero-system",pod_namespace="media",pod_name="overseerr",pod_uid="pod-uid",volume="config",pod_volume_backup="canceled-pvb",backup="config-backup",node="asuka",phase="Canceled"}'
        values: "1+0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: VeleroPodVolumeBackupFailed
        exp_alerts: []

  # Once the newest failed PVB is older than the bounded horizon it is
  # archaeological residue, not a current-state page.
  - interval: 1m
    input_series:
      - series: 'velero_cr_podvolumebackup_created_timestamp{cluster="talos-ottawa",namespace="velero-system",pod_namespace="home",pod_name="old",pod_uid="pod-uid",volume="home",pod_volume_backup="old-pvb",backup="old-backup",node="rei"}'
        values: "100+0x1505"
      - series: 'velero_cr_podvolumebackup_info{cluster="talos-ottawa",namespace="velero-system",pod_namespace="home",pod_name="old",pod_uid="pod-uid",volume="home",pod_volume_backup="old-pvb",backup="old-backup",node="rei",phase="Failed"}'
        values: "1+0x1505"
    alert_rule_test:
      - eval_time: 25h
        alertname: VeleroPodVolumeBackupFailed
        exp_alerts: []

  - interval: 1m
    input_series:
      # The warning/error series are intentionally absent for the previous
      # successful Backup: kube-state-metrics emits them only when non-zero.
      - series: 'velero_cr_backup_created_timestamp{cluster="talos-ottawa",namespace="velero-system",schedule="bhaiya-backup",backup="bhaiya-backup-previous"}'
        values: "100+0x20"
      - series: 'velero_cr_backup_created_timestamp{cluster="talos-ottawa",namespace="velero-system",schedule="bhaiya-backup",backup="bhaiya-backup-current"}'
        values: "200+0x20"
      - series: 'velero_cr_backup_info{cluster="talos-ottawa",namespace="velero-system",schedule="bhaiya-backup",backup="bhaiya-backup-previous",phase="Completed"}'
        values: "1+0x20"
      - series: 'velero_cr_backup_info{cluster="talos-ottawa",namespace="velero-system",schedule="bhaiya-backup",backup="bhaiya-backup-current",phase="PartiallyFailed"}'
        values: "1+0x20"
      - series: 'velero_cr_podvolumebackup_info{cluster="talos-ottawa",namespace="velero-system",backup="bhaiya-backup-previous",pod_volume_backup="previous-pvb-1",node="asuka",phase="Completed"}'
        values: "1+0x20"
      - series: 'velero_cr_podvolumebackup_info{cluster="talos-ottawa",namespace="velero-system",backup="bhaiya-backup-previous",pod_volume_backup="previous-pvb-2",node="asuka",phase="Completed"}'
        values: "1+0x20"
      - series: 'velero_cr_podvolumebackup_info{cluster="talos-ottawa",namespace="velero-system",backup="bhaiya-backup-previous",pod_volume_backup="previous-pvb-3",node="asuka",phase="Completed"}'
        values: "1+0x20"
      - series: 'velero_cr_podvolumebackup_info{cluster="talos-ottawa",namespace="velero-system",backup="bhaiya-backup-current",pod_volume_backup="current-pvb-1",node="asuka",phase="Prepared"}'
        values: "1+0x20"

      # A different schedule has stable one-PVB coverage. Its series prove
      # the comparison is per schedule, not a cluster-wide total.
      - series: 'velero_cr_backup_created_timestamp{cluster="talos-ottawa",namespace="velero-system",schedule="home-backup",backup="home-backup-previous"}'
        values: "100+0x20"
      - series: 'velero_cr_backup_created_timestamp{cluster="talos-ottawa",namespace="velero-system",schedule="home-backup",backup="home-backup-current"}'
        values: "200+0x20"
      - series: 'velero_cr_backup_info{cluster="talos-ottawa",namespace="velero-system",schedule="home-backup",backup="home-backup-previous",phase="Completed"}'
        values: "1+0x20"
      - series: 'velero_cr_backup_info{cluster="talos-ottawa",namespace="velero-system",schedule="home-backup",backup="home-backup-current",phase="PartiallyFailed"}'
        values: "1+0x20"
      - series: 'velero_cr_podvolumebackup_info{cluster="talos-ottawa",namespace="velero-system",backup="home-backup-previous",pod_volume_backup="home-previous-pvb",node="rei",phase="Completed"}'
        values: "1+0x20"
      - series: 'velero_cr_podvolumebackup_info{cluster="talos-ottawa",namespace="velero-system",backup="home-backup-current",pod_volume_backup="home-current-pvb",node="rei",phase="Prepared"}'
        values: "1+0x20"

      # A warning-bearing Completed run is still a usable volume-count
      # baseline. The warning is a separate integrity signal; it must not make
      # this per-schedule regression comparison silently disappear.
      - series: 'velero_cr_backup_created_timestamp{cluster="talos-stpetersburg",namespace="velero-system",schedule="home-assistant-backup",backup="home-assistant-backup-previous"}'
        values: "100+0x20"
      - series: 'velero_cr_backup_created_timestamp{cluster="talos-stpetersburg",namespace="velero-system",schedule="home-assistant-backup",backup="home-assistant-backup-current"}'
        values: "200+0x20"
      - series: 'velero_cr_backup_info{cluster="talos-stpetersburg",namespace="velero-system",schedule="home-assistant-backup",backup="home-assistant-backup-previous",phase="Completed"}'
        values: "1+0x20"
      - series: 'velero_cr_backup_info{cluster="talos-stpetersburg",namespace="velero-system",schedule="home-assistant-backup",backup="home-assistant-backup-current",phase="Completed"}'
        values: "1+0x20"
      - series: 'velero_cr_backup_warnings{cluster="talos-stpetersburg",namespace="velero-system",schedule="home-assistant-backup",backup="home-assistant-backup-previous"}'
        values: "1+0x20"
      - series: 'velero_cr_podvolumebackup_info{cluster="talos-stpetersburg",namespace="velero-system",backup="home-assistant-backup-previous",pod_volume_backup="home-assistant-previous-pvb",node="asuka",phase="Completed"}'
        values: "1+0x20"

    alert_rule_test:
      - eval_time: 15m
        alertname: VeleroScheduleVolumeCoverageRegressed
        exp_alerts:
          - exp_labels:
              cluster: talos-ottawa
              namespace: velero-system
              schedule: bhaiya-backup
              backup: bhaiya-backup-current
              severity: warning
            exp_annotations:
              summary: Velero schedule bhaiya-backup volume coverage regressed
              description: >-
                The newest Backup bhaiya-backup-current for schedule
                bhaiya-backup has fewer PodVolumeBackups than its previous
                Completed baseline. Any lower PVB count is material because
                each PVB represents one selected volume. This remains a
                coverage regression even when Kubernetes item counts or the
                parent Backup phase look normal. A warning-bearing Completed
                Backup can still supply this count baseline; investigate its
                warning separately. If no previous Completed baseline exists,
                this alert is intentionally silent: that means no comparable
                baseline, not proof of zero-volume health. Schedules that
                never produce a successful nonzero-volume baseline require the
                separate never/zero-volume coverage signal. Inspect the
                current and previous Backup PVB populations; stalled-path and
                node-saturation alerts are separate, and this alert is not
                restore proof. It clears only when the newest run reaches the
                prior baseline count. This is a warning rather than proof of
                lost data: a deliberate resource-policy exclusion can lower
                the count. Confirm the Schedule's effective policy and compare
                PVB identities before escalating. The condition starts with
                the Backup creation time, not when this alert fires; use that
                timestamp to determine when the apparent regression began.
          - exp_labels:
              cluster: talos-stpetersburg
              namespace: velero-system
              schedule: home-assistant-backup
              backup: home-assistant-backup-current
              severity: warning
            exp_annotations:
              summary: Velero schedule home-assistant-backup volume coverage regressed
              description: >-
                The newest Backup home-assistant-backup-current for schedule
                home-assistant-backup has fewer PodVolumeBackups than its
                previous Completed baseline. Any lower PVB count is material
                because each PVB represents one selected volume. This remains
                a coverage regression even when Kubernetes item counts or the
                parent Backup phase look normal. A warning-bearing Completed
                Backup can still supply this count baseline; investigate its
                warning separately. If no previous Completed baseline exists,
                this alert is intentionally silent: that means no comparable
                baseline, not proof of zero-volume health. Schedules that
                never produce a successful nonzero-volume baseline require the
                separate never/zero-volume coverage signal. Inspect the
                current and previous Backup PVB populations; stalled-path and
                node-saturation alerts are separate, and this alert is not
                restore proof. It clears only when the newest run reaches the
                prior baseline count. This is a warning rather than proof of
                lost data: a deliberate resource-policy exclusion can lower
                the count. Confirm the Schedule's effective policy and compare
                PVB identities before escalating. The condition starts with
                the Backup creation time, not when this alert fires; use that
                timestamp to determine when the apparent regression began.

  # A marked Schedule with completed zero-volume history must alert. The
  # unmarked Schedule is deliberately identical otherwise and remains out of
  # scope; expectation is metadata, never an inference from history.
  - interval: 1m
    input_series:
      - series: 'velero_cr_schedule_info{cluster="talos-ottawa",namespace="velero-system",schedule="expected-empty",phase="Enabled",paused="false",volume_data_required="true"}'
        values: "1+0x20"
      - series: 'velero_cr_schedule_info{cluster="talos-ottawa",namespace="velero-system",schedule="unmarked-empty",phase="Enabled",paused="false"}'
        values: "1+0x20"
      - series: 'velero_cr_backup_created_timestamp{cluster="talos-ottawa",namespace="velero-system",schedule="expected-empty",backup="expected-empty-previous"}'
        values: "100+0x20"
      - series: 'velero_cr_backup_created_timestamp{cluster="talos-ottawa",namespace="velero-system",schedule="expected-empty",backup="expected-empty-current"}'
        values: "200+0x20"
      - series: 'velero_cr_backup_info{cluster="talos-ottawa",namespace="velero-system",schedule="expected-empty",backup="expected-empty-previous",phase="Completed"}'
        values: "1+0x20"
      - series: 'velero_cr_backup_info{cluster="talos-ottawa",namespace="velero-system",schedule="expected-empty",backup="expected-empty-current",phase="Completed"}'
        values: "1+0x20"
      - series: 'velero_cr_backup_created_timestamp{cluster="talos-ottawa",namespace="velero-system",schedule="unmarked-empty",backup="unmarked-empty-1"}'
        values: "100+0x20"
      - series: 'velero_cr_backup_info{cluster="talos-ottawa",namespace="velero-system",schedule="unmarked-empty",backup="unmarked-empty-1",phase="Completed"}'
        values: "1+0x20"
    alert_rule_test:
      - eval_time: 14m
        alertname: VeleroScheduleExpectedVolumeDataMissing
        exp_alerts: []
      - eval_time: 15m
        alertname: VeleroScheduleExpectedVolumeDataMissing
        exp_alerts:
          - exp_labels:
              cluster: talos-ottawa
              namespace: velero-system
              schedule: expected-empty
              backup: expected-empty-current
              severity: critical
            exp_annotations:
              summary: Velero schedule expected-empty expected volume data but has none
              description: >-
                Schedule expected-empty is explicitly marked
                keiretsu.top/volume-data-required=true, but its latest
                Completed Backup expected-empty-current has no Completed
                PodVolumeBackup with bytesDone equal to totalBytes and greater
                than zero. This absolute signal catches schedules whose first
                and every subsequent run was metadata-only, where the
                relative rule has no volume-bearing baseline to compare. If
                the shared relative coverage condition is active, that alert
                owns the regression and this alert is suppressed to prevent
                duplicate paging. Inspect the Schedule's volume-selection
                contract and the Backup's PVB children; phase and object
                replay do not establish volume data. Schedules without the
                explicit marker are intentionally out of scope. This is a
                zero-volume guard only: it cannot detect under-selection when
                a run has a plausible nonzero count (for example, one PVB
                when two volumes were expected). The relative coverage alert
                catches a lower count only when a comparable prior baseline
                exists; this rule does not infer expected counts.

  # A Completed PVB is evidence only when its progress is byte-positive and
  # complete. A real positive PVB clears the absolute expectation alert.
  - interval: 1m
    input_series:
      - series: 'velero_cr_schedule_info{cluster="talos-ottawa",namespace="velero-system",schedule="expected-covered",phase="Enabled",paused="false",volume_data_required="true"}'
        values: "1+0x20"
      - series: 'velero_cr_backup_created_timestamp{cluster="talos-ottawa",namespace="velero-system",schedule="expected-covered",backup="expected-covered-1"}'
        values: "100+0x20"
      - series: 'velero_cr_backup_info{cluster="talos-ottawa",namespace="velero-system",schedule="expected-covered",backup="expected-covered-1",phase="Completed"}'
        values: "1+0x20"
      - series: 'velero_cr_podvolumebackup_info{cluster="talos-ottawa",namespace="velero-system",backup="expected-covered-1",pod_volume_backup="expected-covered-pvb",node="asuka",phase="Completed"}'
        values: "1+0x20"
      - series: 'velero_cr_podvolumebackup_bytes_done{cluster="talos-ottawa",namespace="velero-system",backup="expected-covered-1",pod_volume_backup="expected-covered-pvb",node="asuka"}'
        values: "8192+0x20"
      - series: 'velero_cr_podvolumebackup_bytes_total{cluster="talos-ottawa",namespace="velero-system",backup="expected-covered-1",pod_volume_backup="expected-covered-pvb",node="asuka"}'
        values: "8192+0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: VeleroScheduleExpectedVolumeDataMissing
        exp_alerts: []

  # A failed newest attempt is owned by the latest-backup failure alert. Do
