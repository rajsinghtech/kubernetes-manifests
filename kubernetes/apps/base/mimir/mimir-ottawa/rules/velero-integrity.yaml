# Velero Backup and PodVolumeBackup CR state is exported by the shared
# kube-state-metrics custom-resource configuration. The Velero server counters
# are useful for newly observed events, but do not represent the persisted
# phase of an individual Backup (a real Failed Backup kept last_status=1).
#
# #572 acceptance (Failed/PartiallyFailed latest Backup, current Failed
# PVB, bytesDone!=totalBytes) is covered by the rules below after #2743.
#
# Silent-skip / green-empty coverage (corp/bhaiya#695, #703):
# - VeleroScheduleLatestBackupHasWarnings: hostPath skips leave phase=Completed
#   with status.warnings>0 (StP homeassistant-config).
# - VeleroScheduleLatestBackupMissingVolumes: Completed latest Backup with no
#   completed, byte-complete PodVolumeBackup (metadata-only / unmounted PVC /
#   opt-in miss / a child that never finished).
# - VeleroScheduleExpectedVolumeDataMissing: an explicitly labelled Schedule's
#   latest successful Backup has no completed, byte-positive PVB. This absolute
#   assertion covers a schedule whose every historical run was empty; it does
#   not infer the expectation from that history. Schedules that legitimately
#   have no Velero-capturable volume data, such as StP homeassistant-config,
#   must not carry the expectation label. This is a zero-volume guard, not an
#   expected-count guard: it cannot detect under-selection that leaves a
#   plausible nonzero count (for example, one PVB when two volumes were
#   expected). The relative coverage rule detects a lower count only when a
#   comparable prior baseline exists.
# Both join on the newest Backup per schedule so they clear on recovery.
#
# Keep this namespace separate from rules/velero.yaml. Both files are synced by
# the same mimirtool Job and a repeated namespace aborts every tenant sync.
namespace: velero-integrity
groups:
  - name: velero-integrity.rules
    rules:
      # Failed PVB CRs are one-shot records and can outlive both their
      # parent Backup and a later successful attempt. Select only the newest
      # PVB for each workload target, so a later success clears a transient
      # failure. Bound the selected record by its own creation time because
      # parent Backups are routinely cleaned up while PVBs persist; without
      # this bound an abandoned target would page forever.
      # Use pod name plus volume as the target identity. Pod UIDs change on
      # routine workspace replacement; a PVC label would be more durable but
      # is not present on the PVB CR or in the exported metric contract.
      # Schedule-level paging for the newest Backup remains in
      # VeleroScheduleLastBackupFailed below.
      - alert: VeleroPodVolumeBackupFailed
        expr: |
          max by (
            cluster, namespace, pod_namespace, pod_name, pod_uid, volume,
            pod_volume_backup, backup, node, phase
          ) (
            (
              topk by (
                cluster, namespace, pod_namespace, pod_name, volume
              ) (
                1,
                velero_cr_podvolumebackup_created_timestamp{
                  namespace="velero-system"
                }
              )
              * on (
                cluster, namespace, pod_namespace, pod_name, pod_uid, volume,
                pod_volume_backup, backup, node
              ) group_left (phase)
              max by (
                cluster, namespace, pod_namespace, pod_name, pod_uid, volume,
                pod_volume_backup, backup, node, phase
              ) (
                velero_cr_podvolumebackup_info{
                  namespace="velero-system",
                  phase="Failed"
                }
              )
            ) > time() - 24 * 3600
          )
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Velero PodVolumeBackup {{ $labels.phase }} for {{ $labels.pod_name }}/{{ $labels.volume }}
          description: >-
            The newest PodVolumeBackup for target {{ $labels.pod_namespace }}/{{ $labels.pod_name }}
            (UID {{ $labels.pod_uid }}, volume {{ $labels.volume }}) is
            {{ $labels.phase }}. It was created within the last 24 hours and
            has remained in that state for at least five minutes. A later
            successful PVB for the same target clears this signal; older
            Failed records are intentionally ignored. Inspect the
            PVB status message, node-agent logs, and storage path before
            treating the target as restorable.

      - alert: VeleroPodVolumeBackupBytesMismatch
        expr: |
          (
            (
              max by (
                cluster, namespace, pod_namespace, pod_name, pod_uid, volume,
                pod_volume_backup, backup, node
              ) (
                velero_cr_podvolumebackup_bytes_done{
                  namespace="velero-system"
                }
              )
              != on (
                cluster, namespace, pod_namespace, pod_name, pod_uid, volume,
                pod_volume_backup, backup, node
              )
              max by (
                cluster, namespace, pod_namespace, pod_name, pod_uid, volume,
                pod_volume_backup, backup, node
              ) (
                velero_cr_podvolumebackup_bytes_total{
                  namespace="velero-system"
                }
              )
            )
            and on (cluster, namespace, pod_volume_backup, backup, node)
            max by (
              cluster, namespace, pod_namespace, pod_name, pod_uid, volume,
              pod_volume_backup, backup, node
            ) (
              velero_cr_podvolumebackup_info{
                namespace="velero-system",
                phase="Completed"
              }
            )
          )
          and on (
            cluster, namespace, pod_namespace, pod_name, pod_uid, volume,
            pod_volume_backup, backup, node
          )
          (
            topk by (
              cluster, namespace, pod_namespace, pod_name, pod_uid, volume
            ) (
              1,
              velero_cr_podvolumebackup_created_timestamp{
                namespace="velero-system"
              }
            ) > time() - 24 * 3600
          )
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Velero completed PVB {{ $labels.pod_volume_backup }} has incomplete bytes
          description: >-
            The newest PodVolumeBackup for target {{ $labels.pod_namespace }}/{{ $labels.pod_name }}
            (UID {{ $labels.pod_uid }}, volume {{ $labels.volume }}) completed
            with bytesDone different from totalBytes. It was created within
            the last 24 hours. A later successful PVB for the same target
            clears this signal; inspect the PVB status and node-agent/Kopia
            logs because matching item counts do not establish volume integrity.

      - alert: VeleroScheduleLastBackupFailed
        expr: |
          (
            max by (cluster, namespace, schedule, backup, phase) (
              velero_cr_backup_info{
                namespace="velero-system",
                schedule!="",
                phase=~"Failed|PartiallyFailed"
              }
            ) > 0
          )
          and on (cluster, namespace, schedule, backup)
          (
            velero_cr_backup_created_timestamp{
              namespace="velero-system",
              schedule!=""
            }
            == on (cluster, namespace, schedule) group_left
            max by (cluster, namespace, schedule) (
              velero_cr_backup_created_timestamp{
                namespace="velero-system",
                schedule!=""
              }
            )
          )
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Velero schedule {{ $labels.schedule }} has no successful latest backup
          description: >-
            The newest persisted Backup attempt for schedule
            {{ $labels.schedule }} is {{ $labels.backup }} and has remained in
            {{ $labels.phase }} for at least five minutes. This is the paging
            signal: inspect the Backup failureReason/message, its PodVolumeBackup
            children, Velero server and node-agent logs, and the Garage backup
            location. Older failed Backup objects are intentionally ignored
            when a newer attempt exists. The creation timestamp is used for
            ordering; velero_backup_last_status is not authoritative for this
            condition.

      # Completed + warnings is how Velero reports hostPath volume skips while
      # still leaving phase=Completed (StP home-assistant-config / #695). Bound
      # to the newest Backup per schedule so a later clean run clears the alert;
      # do not match historical warning-bearing objects. Critical: a "Completed"
      # Backup with warnings is the dangerous signal, not a soft FYI.
      - alert: VeleroScheduleLatestBackupHasWarnings
        expr: |
          (
            max by (cluster, namespace, schedule, backup) (
              velero_cr_backup_warnings{
                namespace="velero-system",
                schedule!=""
              }
            ) > 0
          )
          and on (cluster, namespace, schedule, backup)
          (
            velero_cr_backup_created_timestamp{
              namespace="velero-system",
              schedule!=""
            }
            == on (cluster, namespace, schedule) group_left
            max by (cluster, namespace, schedule) (
              velero_cr_backup_created_timestamp{
                namespace="velero-system",
                schedule!=""
              }
            )
          )
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Velero schedule {{ $labels.schedule }} latest Completed backup has warnings
          description: >-
            The newest Backup for schedule {{ $labels.schedule }} is
            {{ $labels.backup }} and reports status.warnings > 0. Velero uses
            warnings for soft failures such as skipping a hostPath / local-path
            volume while still marking the Backup Completed (corp/bhaiya#695),
            so phase alone is not enough. Inspect the Backup log for "hostPath
            volume which is not supported" (or other skip reasons), confirm
            every durable PVC has a Completed PodVolumeBackup for its pod+volume,
            and do not treat this Backup as a volume restore source until the
            warning is gone. A later Backup with warnings=0 clears this alert.

      # A PVB object is not volume-data evidence until it is Completed and its
      # byte counters agree. Prepared/InProgress/Canceled children can leave a
      # Completed parent looking green without a usable archive. An empty
      # volume is valid evidence when both counters are zero; this still does
      # not establish that every expected PVC was included or that restore
      # works.
      # Covers metadata-only backups from opt-in misses (media-config before
      # #2757), scaled-to-zero apps with orphan PVCs (hermes), and similar
      # green-empty schedules (#703).
      # Schedules that never create a Backup are VeleroScheduleNeverBackedUp.
      # Require phase=Completed on the newest Backup so Failed attempts do not
      # double-page with VeleroScheduleLastBackupFailed.
      - alert: VeleroScheduleLatestBackupMissingVolumes
        expr: |
          (
            max by (cluster, namespace, schedule, backup) (
              velero_cr_backup_info{
                namespace="velero-system",
                schedule!="",
                phase="Completed"
              }
            )
            and on (cluster, namespace, schedule, backup)
            (
              velero_cr_backup_created_timestamp{
                namespace="velero-system",
                schedule!=""
              }
              == on (cluster, namespace, schedule) group_left
              max by (cluster, namespace, schedule) (
                velero_cr_backup_created_timestamp{
                  namespace="velero-system",
                  schedule!=""
                }
              )
            )
          )
          unless on (cluster, namespace, backup)
          (
            count by (cluster, namespace, backup) (
              velero_cr_podvolumebackup_info{
                namespace="velero-system",
                phase="Completed"
              }
              and on (cluster, namespace, pod_volume_backup, backup, node)
              (
                velero_cr_podvolumebackup_bytes_done{
                  namespace="velero-system"
                }
                == on (cluster, namespace, pod_volume_backup, backup, node)
                velero_cr_podvolumebackup_bytes_total{
                  namespace="velero-system"
                }
              )
            ) > 0
          )
          and on (cluster, namespace, schedule)
          max by (cluster, namespace, schedule) (
            velero_cr_schedule_info{
              namespace="velero-system",
              phase="Enabled",
              paused!="true"
            }
          )
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Velero schedule {{ $labels.schedule }} latest Completed backup has no completed volume data
          description: >-
            The newest Backup for schedule {{ $labels.schedule }} is
            {{ $labels.backup }}, phase=Completed, and has no Completed
            PodVolumeBackup with bytesDone equal to totalBytes. That is not
            volume-data evidence: Kubernetes objects may be present while
            durable PVCs were never selected or never mounted, or a child may
            still be incomplete (corp/bhaiya#703). Confirm with
            `kubectl -n velero-system get podvolumebackup -l velero.io/backup-name={{ $labels.backup }}`
            and the live pod volume mounts — do not trust the Backup phase or
            the existence of a PVB object. This alert only establishes that
            one byte-complete PVB exists; it does not prove every expected PVC
            is covered or that a restore works. Clears when a later Backup has
            a Completed PVB with matching byte counters.

      # Count coverage, not Kubernetes item coverage. A current Backup with
      # one PVB can otherwise look healthy beside a prior run with 37 PVBs.
      # The current run is the newest Backup for the schedule, while the
      # baseline is the newest older Completed Backup. For this independent
      # volume-count comparison, a Completed run with warnings is still a
      # useful observed baseline; VeleroScheduleLatestBackupHasWarnings owns
      # the separate quality signal. The alert deliberately observes the
      # produced-PVB count while the Backup is queued/running; phase and item
      # counters are not allowed to hide a volume gap.
      - record: velero_schedule_latest_backup_created_timestamp
        expr: |
          max by (cluster, namespace, schedule, backup) (
            topk by (cluster, namespace, schedule) (
              1,
              velero_cr_backup_created_timestamp{
                namespace="velero-system",
                schedule!=""
              }
            )
          )

      # kube-state-metrics emits these status counters only when they are
      # non-zero. Absence therefore means zero; using `metric == 0` here would
      # make a Completed Backup disappear from the baseline. "Successful" in
      # this recording-rule name means parent phase=Completed for the count
      # baseline. Warnings remain independently actionable and must not erase a
      # known prior PVB count.
      - record: velero_schedule_successful_backup_created_timestamp
        expr: |
          velero_cr_backup_created_timestamp{
            namespace="velero-system",
            schedule!=""
          }
          and on (cluster, namespace, schedule, backup)
          (
            max by (cluster, namespace, schedule, backup) (
              velero_cr_backup_info{
                namespace="velero-system",
                schedule!="",
                phase="Completed"
              }
            )
          )

      - record: velero_schedule_previous_successful_backup_created_timestamp
        expr: |
          max by (cluster, namespace, schedule, backup) (
            topk by (cluster, namespace, schedule) (
              1,
              (
                velero_schedule_successful_backup_created_timestamp
                unless on (cluster, namespace, schedule, backup)
                velero_schedule_latest_backup_created_timestamp
              )
            )
          )

      # Count each PVB object once, regardless of phase. A Prepared PVB is
      # still evidence that the Backup selected one volume; the separate
      # stalled-PVB alert owns whether that selected volume makes progress.
      - record: velero_backup_pod_volume_backup_count
        expr: |
          count by (cluster, namespace, backup) (
            max by (cluster, namespace, pod_volume_backup, backup) (
              velero_cr_podvolumebackup_info{
                namespace="velero-system"
              }
            )
          )

      - record: velero_schedule_latest_pod_volume_backup_count
        expr: |
          (
            (
              velero_backup_pod_volume_backup_count
              * on (cluster, namespace, backup) group_left (schedule)
              max by (cluster, namespace, schedule, backup) (
                velero_cr_backup_info{
                  namespace="velero-system",
                  schedule!=""
                }
              )
            )
            and on (cluster, namespace, schedule, backup)
            velero_schedule_latest_backup_created_timestamp
          )
          or on (cluster, namespace, schedule, backup)
          (
            velero_schedule_latest_backup_created_timestamp * 0
          )

      - record: velero_schedule_previous_successful_pod_volume_backup_count
        expr: |
          (
            (
              velero_backup_pod_volume_backup_count
              * on (cluster, namespace, backup) group_left (schedule)
              max by (cluster, namespace, schedule, backup) (
                velero_cr_backup_info{
                  namespace="velero-system",
                  schedule!=""
                }
              )
            )
            and on (cluster, namespace, schedule, backup)
            velero_schedule_previous_successful_backup_created_timestamp
          )
          or on (cluster, namespace, schedule, backup)
          (
            velero_schedule_previous_successful_backup_created_timestamp * 0
          )

      # Share the exact relative condition with the absolute expectation rule
      # below. When a prior Completed run supplies a real count baseline and
      # the current count drops, this signal owns the regression; the absolute
      # rule is suppressed so one schedule does not double-page.
      - record: velero_schedule_volume_coverage_regressed
        expr: |
          velero_schedule_latest_pod_volume_backup_count
          < on (cluster, namespace, schedule) group_right(backup)
          velero_schedule_previous_successful_pod_volume_backup_count

      - alert: VeleroScheduleVolumeCoverageRegressed
        expr: |
          velero_schedule_volume_coverage_regressed
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Velero schedule {{ $labels.schedule }} volume coverage regressed
          description: >-
            The newest Backup {{ $labels.backup }} for schedule
            {{ $labels.schedule }} has fewer PodVolumeBackups than its previous
            Completed baseline. Any lower PVB count is material because each
            PVB represents one selected volume. This remains a coverage
            regression even when Kubernetes item counts or the parent Backup
            phase look normal. A warning-bearing Completed Backup can still
            supply this count baseline; investigate its warning separately.
            If no previous Completed baseline exists, this alert is
            intentionally silent: that means no comparable baseline, not
            proof of zero-volume health. Schedules that never produce a
            successful nonzero-volume baseline require the separate
            never/zero-volume coverage signal. Inspect the current and
            previous Backup PVB populations; stalled-path and node-saturation
            alerts are separate, and this alert is not restore proof. It
            clears only when the newest run reaches the prior baseline count.

      # This is the complementary absolute assertion. The latest attempt must
      # itself be Completed. A failed latest attempt is owned by
      # VeleroScheduleLastBackupFailed; falling back to an older
      # Completed Backup here would double-page and could call a current run
      # with real PVBs empty (for example, a PartiallyFailed run with 25
      # selected volumes). This still catches a schedule whose every
      # Completed run has zero PVBs, because the latest Completed attempt is
      # the one evaluated. When the shared relative condition is active, that
      # rule owns the regression and this one is suppressed to avoid
      # double-firing.
      - alert: VeleroScheduleExpectedVolumeDataMissing
        expr: |
          (
            (
              velero_schedule_latest_backup_created_timestamp
              and on (cluster, namespace, schedule, backup)
              max by (cluster, namespace, schedule, backup) (
                velero_cr_backup_info{
                  namespace="velero-system",
                  schedule!="",
                  phase="Completed"
                }
              )
            )
            * on (cluster, namespace, schedule) group_left
              max by (cluster, namespace, schedule) (
                velero_cr_schedule_info{
                  namespace="velero-system",
                  phase="Enabled",
                  paused!="true",
                  volume_data_required="true"
                }
              )
            unless on (cluster, namespace, schedule)
            velero_schedule_volume_coverage_regressed
          )
          unless on (cluster, namespace, backup)
          (
            count by (cluster, namespace, backup) (
              (
                velero_cr_podvolumebackup_info{
                  namespace="velero-system",
                  phase="Completed"
                }
                and on (cluster, namespace, pod_volume_backup, backup, node)
                (
                  velero_cr_podvolumebackup_bytes_done{
                    namespace="velero-system"
                  }
                  == on (cluster, namespace, pod_volume_backup, backup, node)
                  velero_cr_podvolumebackup_bytes_total{
                    namespace="velero-system"
                  }
                )
                and on (cluster, namespace, pod_volume_backup, backup, node)
                (
                  velero_cr_podvolumebackup_bytes_done{
                    namespace="velero-system"
                  } > 0
                )
              )
            ) > 0
          )
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Velero schedule {{ $labels.schedule }} expected volume data but has none
          description: >-
            Schedule {{ $labels.schedule }} is explicitly marked
            keiretsu.top/volume-data-required=true, but its latest Completed
            Backup {{ $labels.backup }} has no Completed PodVolumeBackup with
            bytesDone equal to totalBytes and greater than zero. This absolute
            signal catches schedules whose first and every subsequent run was
            metadata-only, where the relative rule has no volume-bearing
            baseline to compare. If the shared relative coverage condition is
            active, that alert owns the regression and this alert is
            suppressed to prevent duplicate paging. Inspect the Schedule's
            volume-selection contract and the Backup's PVB children; phase
            and object replay do not establish volume data. Schedules without
            the explicit marker are intentionally out of scope. This is a
            zero-volume guard only: it cannot detect under-selection when a
            run has a plausible nonzero count (for example, one PVB when two
            volumes were expected). The relative coverage alert catches a
            lower count only when a comparable prior baseline exists; this
            rule does not infer expected counts.
