# Velero's named backup schedules are evaluated by the Mimir ruler. The
# Prometheus agents only scrape and remote-write these metrics; their
# PrometheusRule objects are not evaluated in agent mode.
#
# The two event alerts use Velero's counters, not velero_backup_last_status:
# the latter remained 1 during a real Failed Backup in Ottawa. A matching item
# count is not a volume-integrity signal; the annotations intentionally direct
# the operator to the Backup and PodVolumeBackup objects.
#
# Keep this namespace unique across every file passed to mimirtool.
namespace: velero-backups
groups:
  - name: velero-backups.rules
    rules:
      - alert: VeleroBackupPartiallyFailed
        expr: |
          sum by (cluster, schedule) (
            increase(
              velero_backup_partial_failure_total{schedule!=""}[5m]
            )
          ) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Velero schedule {{ $labels.schedule }} reported a partially failed backup
          description: >-
            Velero reported a PartiallyFailed backup for schedule
            {{ $labels.schedule }}. This detects Velero's failure report only;
            itemsBackedUp matching totalItems does not establish filesystem or
            volume integrity. Inspect the Backup status and its failed
            PodVolumeBackup objects, then correlate the Velero and node-agent
            logs.

      - alert: VeleroBackupFailed
        expr: |
          sum by (cluster, schedule) (
            increase(
              velero_backup_failure_total{schedule!=""}[5m]
            )
          ) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Velero schedule {{ $labels.schedule }} reported a failed backup
          description: >-
            Velero's failed-backup counter increased for schedule
            {{ $labels.schedule }}. Do not substitute
            velero_backup_last_status for this signal: that gauge can remain
            successful while a later Backup object is Failed. Inspect the
            Backup status and error details; this alert does not establish that
            a backup which completed is complete or restorable.

      - alert: VeleroBackupStale
        expr: |
          (
            (
              time()
              - max by (cluster, schedule) (
                  velero_backup_last_successful_timestamp{schedule!=""}
                )
            ) > bool 129600
          )
          * on (cluster, schedule) group_left (namespace, backup)
          (
            velero_schedule_latest_backup_created_timestamp > bool 0
          )
          and on (cluster, namespace, schedule)
          (
            max by (cluster, namespace, schedule) (
              velero_cr_schedule_info{
                namespace="velero-system",
                phase="Enabled",
                paused!="true"
              }
            )
          )
          > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Velero schedule {{ $labels.schedule }} has no recent successful backup
          description: >-
            Schedule {{ $labels.schedule }} has not reported a successful
            backup for more than 36 hours (the daily schedule's expected period
            plus margin). Check the Schedule, BackupStorageLocation, Velero
            server, and node-agent pods. This is a freshness/reporting guard;
            it cannot detect a backup that completes while silently missing
            data, and it also needs the Velero metric to remain scrapeable.

      # Pausing is deliberate, so it must not page like an active schedule
      # outage. It must still leave a reminder when the pause outlasts a
      # maintenance window: the daily schedules protect member and platform
      # data, and seven missed daily windows is long enough to distinguish a
      # normal repair window from an easily forgotten suspension without
      # waiting a month. Use lastBackup age as the observable lower bound on
      # pause age because Velero does not expose a pause-transition timestamp.
      # For a schedule that has never backed up, use its creation age instead.
      # The Enabled/paused Schedule join is intentionally on the outside, so
      # deleting or unpausing the Schedule removes the alert even when old
      # Backup metrics remain.
      - alert: VeleroSchedulePausedTooLong
        expr: |
          max by (cluster, namespace, schedule) (
            velero_cr_schedule_info{
              namespace="velero-system",
              phase="Enabled",
              paused="true"
            }
          )
          and on (cluster, namespace, schedule) (
            (
              time()
              - max by (cluster, namespace, schedule) (
                  velero_cr_schedule_last_backup_timestamp{
                    namespace="velero-system"
                  }
                )
              > 604800
            )
            or
            (
              (
                time()
                - max by (cluster, namespace, schedule) (
                    velero_cr_schedule_created_timestamp{
                      namespace="velero-system"
                    }
                  )
              ) > 604800
              unless on (cluster, namespace, schedule)
              max by (cluster, namespace, schedule) (
                velero_cr_schedule_last_backup_timestamp{
                  namespace="velero-system"
                }
              )
            )
          )
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Velero schedule {{ $labels.schedule }} has been paused for more than 7 days
          description: >-
            Schedule {{ $labels.schedule }} is intentionally paused and has
            gone more than seven days without a successful Backup. This is a
            reminder, not an outage assertion: confirm the maintenance window
            is still deliberate, then unpause the Schedule when its protected
            data should resume daily coverage. The seven-day threshold allows
            ordinary maintenance windows while preventing a paused member or
            platform schedule from becoming an indefinite silent gap. This
            alert clears when the Schedule is unpaused or deleted.

      # VeleroBackupStale requires a last_successful_timestamp series and a
      # currently enabled, unpaused Schedule. A historical Backup metric must
      # not keep an alert alive after its Schedule is deleted or paused. A Schedule
      # that is Enabled but has never produced a Backup (forgejo-backup after
      # #2732 had status.lastBackup unset) creates no such series and stays
      # invisible. Page from the Schedule CR once it is older than 36h without
      # lastBackup. Clears when lastBackup is set; does not latch on history.
      - alert: VeleroScheduleNeverBackedUp
        expr: |
          (
            max by (cluster, namespace, schedule) (
              velero_cr_schedule_info{
                namespace="velero-system",
                phase="Enabled",
                paused!="true"
              }
            )
            and on (cluster, namespace, schedule)
            (
              time()
              - max by (cluster, namespace, schedule) (
                  velero_cr_schedule_created_timestamp{
                    namespace="velero-system"
                  }
                )
              > 129600
            )
          )
          unless on (cluster, namespace, schedule)
          (
            max by (cluster, namespace, schedule) (
              velero_cr_schedule_last_backup_timestamp{
                namespace="velero-system"
              } > 0
            )
          )
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Velero schedule {{ $labels.schedule }} has never produced a backup
          description: >-
            Schedule {{ $labels.schedule }} has been Enabled for more than 36
            hours with no status.lastBackup. VeleroBackupStale cannot see this
            because no velero_backup_last_successful_timestamp series exists
            until the first success. Inspect the Schedule, its first cron
            window, BackupStorageLocation, and Velero logs. The alert clears
            when lastBackup is set.

      # BackupRepository phase=Ready coexists with refused Kopia maintenance
      # (#575 Garage degraded read-after-write on _maintenance). Prefer
      # lastMaintenanceTime freshness over the failure counter so a historical
      # refusal does not latch after later successes.
      - alert: VeleroBackupRepositoryMaintenanceStale
        expr: |
          (
            max by (cluster, namespace, repository, volume_namespace) (
              velero_cr_backuprepository_info{
                namespace="velero-system",
                phase="Ready"
              }
            )
            and on (cluster, namespace, repository)
            (
              time()
              - max by (cluster, namespace, repository) (
                  velero_cr_backuprepository_last_maintenance_timestamp{
                    namespace="velero-system"
                  }
                )
              > 21600
            )
          )
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Velero BackupRepository {{ $labels.repository }} maintenance is stale
          description: >-
            BackupRepository {{ $labels.repository }} (volume namespace
            {{ $labels.volume_namespace }}) is Ready but has not recorded
            lastMaintenanceTime within 6 hours (maintenanceFrequency is 1h).
            This is the #575-shaped gap: Ready does not mean prune/maintenance
            is succeeding. Inspect recent maintain Jobs and Velero logs for
            "clock skew" / refused maintenance. The alert clears when
            lastMaintenanceTime advances; it does not latch on
            velero_repo_maintenance_failure_total.

      - alert: VeleroBackupStorageLocationUnavailable
        expr: |
          max by (cluster, backup_location_name) (
            velero_backup_location_status_gauge == 0
          )
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Velero BackupStorageLocation {{ $labels.backup_location_name }} is unavailable
          description: >-
            BackupStorageLocation {{ $labels.backup_location_name }} is not
            Available. New backups cannot be written even while old objects
            remain readable in Garage. Inspect BSL status, credentials, and
            the garage-gateway path. Clears when the location becomes Available
            again.
