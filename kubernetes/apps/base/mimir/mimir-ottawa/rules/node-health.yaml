# Node health alerts for the NPD conditions written by node-problem-detector.
# node-problem-detector DaemonSet. These rules are evaluated by Mimir ruler;
# node-readiness-controller independently applies only a NoSchedule taint.
# Keep this namespace unique across every file passed to mimirtool.
namespace: node-health
groups:
  - name: node-health.rules
    rules:
      - alert: NodeKernelDeadlock
        expr: kube_node_status_condition{condition="KernelDeadlock",status="true"} == 1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Kernel deadlock reported on node {{ $labels.node }}
      - alert: NodeReadonlyFilesystem
        expr: kube_node_status_condition{condition="ReadonlyFilesystem",status="true"} == 1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Read-only filesystem reported on node {{ $labels.node }}

      - alert: NodeKubeletUnhealthyWhileReady
        expr: |
          kube_node_status_condition{condition="KubeletUnhealthy",status="true"} == 1
          and on (cluster, node)
          kube_node_status_condition{condition="Ready",status="true"} == 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Node {{ $labels.node }} reports KubeletUnhealthy while remaining Ready.
          description: >-
            The Kubernetes node condition is inconsistent. Inspect the node's
            lastHeartbeatTime and Kubelet/containerd/Kata logs; this alert is
            intentionally independent of Ready so a stale KubeletUnhealthy
            condition is not hidden by generic node-readiness alerts.

      - alert: NodeKernelOOMKill
        expr: increase(problem_counter{reason="OOMKilling"}[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Node {{ $labels.node }} recorded a kernel OOM kill.
          description: >-
            Node-problem-detector observed the kernel OOM-kill signature. This
            distinguishes host-level memory pressure from a Kata sandbox
            teardown; correlate it with the affected pod's termination reason
            and node memory metrics.

      # Schedulable memory headroom, not RSS. orin-0 (StP sole control-plane)
      # ran HomeKit Pending when requests filled the node while MemoryPressure
      # stayed False (2026-09-07). Fire before the next Guaranteed pod cannot
      # schedule — especially workloads pinned by local-path PVCs.
      - alert: NodeSchedulableMemoryHeadroomLow
        expr: |
          (
            sum by (cluster, node) (
              kube_node_status_allocatable{resource="memory"}
            )
            -
            sum by (cluster, node) (
              kube_pod_container_resource_requests{resource="memory"}
              * on (cluster, namespace, pod) group_left()
              (kube_pod_status_phase{phase="Running"} == 1)
            )
          )
          /
          sum by (cluster, node) (
            kube_node_status_allocatable{resource="memory"}
          )
          < 0.08
          and on (cluster, node)
          kube_node_status_condition{condition="Ready",status="true"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Node {{ $labels.node }} has less than 8% schedulable memory headroom
          description: >-
            Free schedulable memory (allocatable minus Running pod requests) is
            under 8% while the node is Ready. New pods and request increases
            fail with Insufficient memory even when MemoryPressure is False.
            StP orin-0 hit this on 2026-09-07 and parked homeassistant-0
            (local-path PVC). Trim over-requests or free capacity before the
            next control-plane change.
