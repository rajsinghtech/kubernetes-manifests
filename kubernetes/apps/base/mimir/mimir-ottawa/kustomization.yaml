---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mimir
resources:
  - helmrelease.yaml
  - ingester-pvc.yaml
  - ingress-ts.yaml
  - ingress-qf-ts.yaml
  # Keep the Helm-owned Service in Flux's inventory while removing the legacy
  # Tailscale egress annotations; remote clusters use the ExternalName base.
  - egress.yaml
  - backend.yaml
  - gateway-servicemonitor.yaml
  - loader-job.yaml
  - referencegrant.yaml
configurations:
  - name-reference.yaml
configMapGenerator:
  # Hash-suffixed so any rule change produces a new loader Job identity and
  # re-syncs the changed rules into the Mimir ruler.
  - name: mimir-rules
    files:
      - rules/bhaiya.yaml
      - rules/bhaiya-model.yaml
      - rules/bhaiya-reconciler.yaml
      - rules/bhaiya-provider-provisioning.yaml
      - rules/bhaiya-ssh.yaml
      - rules/bhaiya-sandbox-telemetry.yaml
      - rules/bhaiya-velero-coverage.yaml
      - rules/bhaiya-workspace-image.yaml
      - rules/blackbox.yaml
      - rules/ceph.yaml
      - rules/cnpg-backup-coverage.yaml
      - rules/flux.yaml
      - rules/garage.yaml
      - rules/k8gb.yaml
      - rules/k8gb-dns.yaml
      - rules/media.yaml
      - rules/mimir-loader.yaml
      - rules/mimir-queryable-window.yaml
      - rules/monitoring.yaml
      - rules/node-health.yaml
      - rules/node-clock.yaml
      - rules/payments.yaml
      - rules/smartctl.yaml
      - rules/velero.yaml
      - rules/velero-integrity.yaml
      - rules/velero-volume-progress.yaml
      - rules/velero-node-saturation.yaml
      - rules/velero-restore-admission.yaml
      - rules/zot.yaml
