---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mimir
resources:
  - helmrelease.yaml
  - ingress-ts.yaml
  - ingress-qf-ts.yaml
  # Keep the Helm-owned Service in Flux's inventory while removing the legacy
  # Tailscale egress annotations; remote clusters use the ExternalName base.
  - egress.yaml
  - backend.yaml
  - gateway-servicemonitor.yaml
  - loader-job.yaml
  - referencegrant.yaml
configMapGenerator:
  # Hash-suffixed so any rule change rolls the mimir-config-loader Job
  # (its volume ref changes), forcing a re-sync into the Mimir ruler.
  - name: mimir-rules
    files:
      - rules/bhaiya.yaml
      - rules/bhaiya-reconciler.yaml
      - rules/bhaiya-provider-provisioning.yaml
      - rules/bhaiya-ssh.yaml
      - rules/bhaiya-sandbox-telemetry.yaml
      - rules/bhaiya-workspace-image.yaml
      - rules/blackbox.yaml
      - rules/ceph.yaml
      - rules/flux.yaml
      - rules/garage.yaml
      - rules/k8gb.yaml
      - rules/k8gb-dns.yaml
      - rules/media.yaml
      - rules/mimir-loader.yaml
      - rules/monitoring.yaml
      - rules/node-health.yaml
      - rules/payments.yaml
      - rules/smartctl.yaml
      - rules/velero.yaml
      - rules/zot.yaml
