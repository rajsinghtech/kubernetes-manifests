---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mimir
spec:
  interval: 30m
  # Ring components (compactor/store-gateway/ingester) log
  # "waiting until ring topology is stable" for min 1m / max 5m and also have
  # readinessProbe.initialDelaySeconds=60 plus possible WAL replay. The Helm
  # default 5m wait treats that healthy join as a stall, fails the upgrade,
  # then fails the rollback for the same reason and burns remediation retries
  # (corp/bhaiya#713). The wait must also exceed the ingester's
  # terminationGracePeriodSeconds of 1200s (20m): a graceful ingester shutdown
  # flushes its whole TSDB head to long-term storage and can legitimately use
  # that entire window, so a 15m Helm wait times out on a healthy drain and
  # reproduces #713. 25m clears both the 5m ring ceiling and the 20m grace.
  timeout: 25m
  chart:
    spec:
      chart: mimir-distributed
      version: "6.2.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    timeout: 25m
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    timeout: 25m
    # Helm must not gate this release on Mimir readiness. Its ring components
    # (compactor/store-gateway/ingester) legitimately take 1-5m to join and the
    # ingester's graceful shutdown flushes its whole TSDB head (grace 1200s).
    # Helm reported "release is in a failed state" seconds into every upgrade
    # and remediated, so the timeouts above were never even reached
    # (corp/bhaiya#713). Flux health-checks the Kustomization separately and the
    # ring self-heals, so waiting here buys nothing and blocked delivery of
    # #2765's query-window config for four PRs.
    disableWait: true
    disableWaitForJobs: true
    remediation:
      # 'retry' is NOT a valid strategy (live CRD accepts only rollback |
      # uninstall), and setting it fails the whole Kustomization dry-run.
      # Timeouts alone were never the fix (see disableWait above); they are
      # kept as a backstop for a genuinely hung operation.
      retries: 2
  postRenderers:
    - kustomize:
        patches:
          # The chart's persistentVolume mode adds volumeClaimTemplates to the
          # StatefulSet. That field cannot be added to the existing StatefulSet
          # in place, so keep the chart's emptyDir mode and replace only the
          # mutable pod-template volume with the separately managed claim.
          # The test operation makes a chart volume-order change fail closed.
          - target:
              kind: StatefulSet
              name: mimir-ingester
            patch: |-
              - op: test
                path: /spec/template/spec/volumes/2/name
                value: storage
              - op: remove
                path: /spec/template/spec/volumes/2/emptyDir
              - op: add
                path: /spec/template/spec/volumes/2/persistentVolumeClaim
                value:
                  claimName: storage-mimir-ingester-0
  values:
    rollout_operator:
      enabled: false

    minio:
      enabled: false

    kafka:
      enabled: false

    # Bundled Mimir AM disabled — upstream notify bug (mimir#2910), every notify
    # fails with "invalid service state: Terminated" even for a no-op receiver.
    # The ruler sends to the kube-prometheus-stack (Prometheus) Alertmanager.
    alertmanager:
      enabled: false

    ruler:
      enabled: true
      replicas: 1

    global:
      extraEnvFrom:
        - secretRef:
            name: mimir-s3

    mimir:
      structuredConfig:
        no_auth_tenant: talos-ottawa
        multitenancy_enabled: true
        tenant_federation:
          enabled: true
        ingest_storage:
          enabled: false
        frontend:
          parallelize_shardable_queries: false
        ingester:
          push_grpc_method_enabled: true
          ring:
            replication_factor: 1
        store_gateway:
          sharding_ring:
            replication_factor: 1
        ruler:
          # Ruler evaluates the rule groups loaded by the content-hashed Mimir
          # rules loader Job and pushes firing alerts to the kube-prometheus-stack (Prometheus)
          # Alertmanager — the bundled Mimir AM hits an upstream notify bug
          # (mimir#2910). One ruler (ottawa) drives all tenants' alerts here.
          alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093/
          enable_api: true
        ruler_storage:
          # Shares the mimir bucket with blocks; distinct prefix avoids collision.
          storage_prefix: ruler
        common:
          storage:
            backend: s3
            s3:
              endpoint: ${COMMON_S3_ENDPOINT}
              bucket_name: mimir
              insecure: true
        blocks_storage:
          tsdb:
            # The first rollout moves the ingester from emptyDir to RBD. Flush
            # and ship the current head before Kubernetes removes the old pod.
            flush_blocks_on_shutdown: true
            # helm-release-epoch: 2026-09-07T05:55:00Z — bump with timeout
            # delivery fixes so Flux performs a real upgrade after #713.
          bucket_store:
            # Must stay strictly below querier.query_store_after. Leaving the
            # default 10h with a 4h store-after boundary would open a 4h–10h
            # hole where neither ingesters nor store-gateway answer.
            ignore_blocks_within: 2h
        querier:
          # Defaults are query_store_after=12h / query_ingesters_within=13h.
          # With a single RF=1 ingester that makes the last ~12h a SPOF
          # (corp/bhaiya#674): any ingester replacement blinds the window
          # until blocks age past the boundary. Shrink the ingester-only
          # window without paying for a second ~4GiB RSS replica. Does not
          # protect the unshipped head; RF/replica HA remains a capacity call.
          # NOTE: query_ingesters_within is NOT valid under `querier` in this
          # Mimir version — it crashes every component at config parse:
          #   field query_ingesters_within not found in type querier.Config
          # query_store_after alone achieves the #674 goal: queries older than
          # 4h go to the store-gateway (which serves blocks >2h via
          # ignore_blocks_within), and the ingester default window still covers
          # everything newer. Do not re-add it here.
          query_store_after: 4h
        limits:
          compactor_blocks_retention_period: 7d
          ingestion_rate: 500000
          ingestion_burst_size: 1000000
          max_global_series_per_user: 10000000
          max_label_names_per_series: 300
          query_sharding_total_shards: 16
          out_of_order_time_window: 10m

    ingester:
      replicas: 1
      zoneAwareReplication:
        enabled: false
      persistentVolume:
        # Adding chart-managed volumeClaimTemplates would be rejected as an
        # immutable StatefulSet update. The PVC is managed beside this release
        # and the post-renderer switches the pod template to it.
        enabled: false
      extraArgs:
        "-ingester.ring.replication-factor": "1"

    store_gateway:
      # Two store-gateways and RF=2 keep the older-block query path available
      # while one gateway is unavailable. This is independent of ingester HA.
      replicas: 2
      zoneAwareReplication:
        enabled: false
      persistentVolume:
        enabled: true
        size: 2Gi
      extraArgs:
        "-store-gateway.sharding-ring.replication-factor": "2"

    compactor:
      replicas: 1
      persistentVolume:
        enabled: false

    distributor:
      replicas: 2

    querier:
      replicas: 2

    query_frontend:
      replicas: 1

    query_scheduler:
      replicas: 1

    # Cache chunk objects fetched by the queriers so repeated OpenCost windows
    # do not re-read the same blocks from Garage. Mimir discovers this headless
    # StatefulSet and jump-hashes keys across both pods (4 GiB total capacity).
    chunks-cache:
      enabled: true
      replicas: 2
      allocatedMemory: 2048

    gateway:
      # This is the shared ingestion and query entrypoint for all three
      # clusters.  Two replicas preserve remote-write availability while a
      # gateway pod rolls or its nginx ConfigMap changes.
      replicas: 2
      # nginx.config (not nginxConfig) is the chart's values path.  Keeping the
      # exporter behind the gateway means its metrics use the existing Service
      # and avoids exposing its sidecar port directly.
      nginx:
        config:
          serverSnippet: |
            location /nginx_status {
              stub_status on;
              access_log off;
            }
            location /metrics {
              proxy_pass http://localhost:9113/metrics;
              access_log off;
            }
      extraContainers:
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.5
          args:
            - --nginx.scrape-uri=http://localhost:8080/nginx_status
          ports:
            - name: metrics
              containerPort: 9113
          resources:
            requests:
              cpu: 10m
              memory: 16Mi

    metaMonitoring:
      serviceMonitor:
        enabled: true
        clusterLabel: ottawa
