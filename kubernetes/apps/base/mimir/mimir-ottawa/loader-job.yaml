---
# Syncs the native rule groups into the Mimir ruler, once per tenant (each
# cluster is a tenant). Kustomize replaces this base name with the generated
# rules ConfigMap's content-hashed name, so a rule change creates a new Job
# instead of mutating a completed Job's immutable pod template.
#
# grafana/mimirtool is distroless (no /bin/sh), so each tenant sync runs the
# mimirtool entrypoint directly instead of a shell loop. Alertmanager config is
# NOT managed here — the ruler notifies the kube-prometheus-stack Alertmanager
# (the bundled Mimir AM is disabled, mimir#2910).
apiVersion: batch/v1
kind: Job
metadata:
  name: mimir-rules
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rules-ottawa
          image: &mt docker.io/grafana/mimirtool:3.2.0
          args:
            - rules
            - sync
            - --address=http://mimir-gateway.mimir.svc.cluster.local:8080
            - --id=talos-ottawa
            - /rules/bhaiya.yaml
            - /rules/bhaiya-reconciler.yaml
            - /rules/bhaiya-provider-provisioning.yaml
            - /rules/bhaiya-ssh.yaml
            - /rules/bhaiya-sandbox-telemetry.yaml
            - /rules/bhaiya-workspace-image.yaml
            - /rules/blackbox.yaml
            - /rules/ceph.yaml
            - /rules/flux.yaml
            - /rules/garage.yaml
            - /rules/k8gb.yaml
            - /rules/k8gb-dns.yaml
            - /rules/media.yaml
            - /rules/mimir-loader.yaml
            - /rules/monitoring.yaml
            - /rules/node-health.yaml
            - /rules/payments.yaml
            - /rules/smartctl.yaml
            - /rules/velero.yaml
            - /rules/zot.yaml
          volumeMounts: &rulesmount
            - { name: rules, mountPath: /rules }
          securityContext: &sc
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        - name: rules-robbinsdale
          image: *mt
          args:
            - rules
            - sync
            - --address=http://mimir-gateway.mimir.svc.cluster.local:8080
            - --id=talos-robbinsdale
            - /rules/bhaiya.yaml
            - /rules/bhaiya-reconciler.yaml
            - /rules/bhaiya-provider-provisioning.yaml
            - /rules/bhaiya-ssh.yaml
            - /rules/bhaiya-sandbox-telemetry.yaml
            - /rules/bhaiya-workspace-image.yaml
            - /rules/blackbox.yaml
            - /rules/ceph.yaml
            - /rules/flux.yaml
            - /rules/garage.yaml
            - /rules/k8gb.yaml
            - /rules/k8gb-dns.yaml
            - /rules/media.yaml
            - /rules/mimir-loader.yaml
            - /rules/monitoring.yaml
            - /rules/node-health.yaml
            - /rules/payments.yaml
            - /rules/smartctl.yaml
            - /rules/velero.yaml
            - /rules/zot.yaml
          volumeMounts: *rulesmount
          securityContext: *sc
        - name: rules-stpetersburg
          image: *mt
          args:
            - rules
            - sync
            - --address=http://mimir-gateway.mimir.svc.cluster.local:8080
            - --id=talos-stpetersburg
            - /rules/bhaiya.yaml
            - /rules/bhaiya-reconciler.yaml
            - /rules/bhaiya-provider-provisioning.yaml
            - /rules/bhaiya-ssh.yaml
            - /rules/bhaiya-sandbox-telemetry.yaml
            - /rules/bhaiya-workspace-image.yaml
            - /rules/blackbox.yaml
            - /rules/ceph.yaml
            - /rules/flux.yaml
            - /rules/garage.yaml
            - /rules/k8gb.yaml
            - /rules/k8gb-dns.yaml
            - /rules/media.yaml
            - /rules/mimir-loader.yaml
            - /rules/monitoring.yaml
            - /rules/node-health.yaml
            - /rules/payments.yaml
            - /rules/smartctl.yaml
            - /rules/velero.yaml
            - /rules/zot.yaml
          volumeMounts: *rulesmount
          securityContext: *sc
      volumes:
        - name: rules
          configMap:
            name: mimir-rules
