---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-multus-ds
  namespace: kube-system
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  minReadySeconds: 10
  template:
    spec:

      volumes:
        - name: host-run-netns
          hostPath:
            path: /var/run/netns/
      initContainers:
        - name: install-multus-binary
          image: ghcr.io/k8snetworkplumbingwg/multus-cni:v4.3.1-thick@sha256:a357a79359b80ddd5f4699117946cacf3b54f5baecf7944535594863e875fc25
          command:
            - "cp"
            - "-f"
            - "/usr/src/multus-cni/bin/multus-shim"
            - "/host/opt/cni/bin/multus-shim"
        - command:
            - /install-cni.sh
          image: ghcr.io/siderolabs/install-cni:v1.9.0
          name: install-cni
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: /host/opt/cni/bin
              mountPropagation: Bidirectional
              name: cnibin
      containers:
        - name: kube-multus
          # Keep the daemon and host-installed shim on the same immutable release.
          image: ghcr.io/k8snetworkplumbingwg/multus-cni:v4.3.1-thick@sha256:a357a79359b80ddd5f4699117946cacf3b54f5baecf7944535594863e875fc25
          # Probe the Unix API used by multus-shim; DS Ready must reflect daemon health.
          startupProbe:
            exec:
              command:
                - /usr/bin/perl
                - -MIO::Socket::UNIX
                - -MSocket
                - -e
                - |
                  my $s = IO::Socket::UNIX->new(Type => SOCK_STREAM, Peer => "/host/run/multus/multus.sock") or exit 1;
                  print $s "GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n" or exit 1;
                  my $line = <$s>;
                  exit(($line // "") =~ m{^HTTP/\d(?:\.\d)? 200\b} ? 0 : 1);
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - /usr/bin/perl
                - -MIO::Socket::UNIX
                - -MSocket
                - -e
                - |
                  my $s = IO::Socket::UNIX->new(Type => SOCK_STREAM, Peer => "/host/run/multus/multus.sock") or exit 1;
                  print $s "GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n" or exit 1;
                  my $line = <$s>;
                  exit(($line // "") =~ m{^HTTP/\d(?:\.\d)? 200\b} ? 0 : 1);
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /usr/bin/perl
                - -MIO::Socket::UNIX
                - -MSocket
                - -e
                - |
                  my $s = IO::Socket::UNIX->new(Type => SOCK_STREAM, Peer => "/host/run/multus/multus.sock") or exit 1;
                  print $s "GET /healthz HTTP/1.0\r\nHost: localhost\r\n\r\n" or exit 1;
                  my $line = <$s>;
                  exit(($line // "") =~ m{^HTTP/\d(?:\.\d)? 200\b} ? 0 : 1);
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "200Mi"
            limits:
              cpu: "1000m"
              memory: "3000Mi"
