---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - generic-device-plugin.yaml
  - https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-cni/v4.3.1/deployments/multus-daemonset-thick.yml
  # - https://raw.githubusercontent.com/k8snetworkplumbingwg/whereabouts/refs/heads/master/doc/crds/daemonset-install.yaml
  # - https://raw.githubusercontent.com/k8snetworkplumbingwg/whereabouts/refs/heads/master/doc/crds/whereabouts.cni.cncf.io_ippools.yaml
  # - https://raw.githubusercontent.com/k8snetworkplumbingwg/whereabouts/refs/heads/master/doc/crds/whereabouts.cni.cncf.io_overlappingrangeipreservations.yaml
  - https://github.com/intel/intel-device-plugins-for-kubernetes/deployments/gpu_plugin/overlays/nfd_labeled_nodes?ref=v0.36.0
  - descheduler-cronjob.yaml
  - https://raw.githubusercontent.com/kubernetes-sigs/mcs-api/62ede9a032dcfbc41b3418d7360678cb83092498/config/crd/multicluster.x-k8s.io_serviceexports.yaml
  - https://raw.githubusercontent.com/kubernetes-sigs/mcs-api/62ede9a032dcfbc41b3418d7360678cb83092498/config/crd/multicluster.x-k8s.io_serviceimports.yaml
  # - clustermesh-egress.yaml
  - helmrelease.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: cilium-values
    files:
      - values.yaml
  # - name: cilium-clustermesh-values
  #   files:
  #     - values-clustermesh.yaml
patches:
  - target:
      kind: DaemonSet
      name: kube-multus-ds
      namespace: kube-system
    patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: kube-multus-ds
        namespace: kube-system
      spec:
        updateStrategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1
        minReadySeconds: 10
        template:
          spec:
            volumes:
              - name: host-run-netns
                hostPath:
                  path: /var/run/netns/
            initContainers:
              - name: install-multus-binary
                image: ghcr.io/k8snetworkplumbingwg/multus-cni:v4.3.1-thick@sha256:a357a79359b80ddd5f4699117946cacf3b54f5baecf7944535594863e875fc25
                command:
                  - "cp"
                  - "-f"
                  - "/usr/src/multus-cni/bin/multus-shim"
                  - "/host/opt/cni/bin/multus-shim"
              - command:
                  - /install-cni.sh
                image: ghcr.io/siderolabs/install-cni:v1.9.0  # adapt to your talos version
                name: install-cni
                securityContext:
                  privileged: true
                volumeMounts:
                  - mountPath: /host/opt/cni/bin
                    mountPropagation: Bidirectional
                    name: cnibin
            containers:
              - name: kube-multus
                # Keep the daemon and host-installed shim on the same immutable release.
                image: ghcr.io/k8snetworkplumbingwg/multus-cni:v4.3.1-thick@sha256:a357a79359b80ddd5f4699117946cacf3b54f5baecf7944535594863e875fc25
                # Probe the Unix API used by multus-shim; DS Ready must reflect daemon health.
                startupProbe:
                  exec:
                    command:
                      - /usr/bin/perl
                      - -MIO::Socket::UNIX
                      - -MSocket
                      - -e
                      - |
                        my $s = IO::Socket::UNIX->new(Type => SOCK_STREAM, Peer => "/host/run/multus/multus.sock") or exit 1;
                        print $s "GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n" or exit 1;
                        my $line = <$s>;
                        exit(($line // "") =~ m{^HTTP/\d(?:\.\d)? 200\b} ? 0 : 1);
                  periodSeconds: 2
                  timeoutSeconds: 2
                  failureThreshold: 60
                readinessProbe:
                  exec:
                    command:
                      - /usr/bin/perl
                      - -MIO::Socket::UNIX
                      - -MSocket
                      - -e
                      - |
                        my $s = IO::Socket::UNIX->new(Type => SOCK_STREAM, Peer => "/host/run/multus/multus.sock") or exit 1;
                        print $s "GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n" or exit 1;
                        my $line = <$s>;
                        exit(($line // "") =~ m{^HTTP/\d(?:\.\d)? 200\b} ? 0 : 1);
                  periodSeconds: 5
                  timeoutSeconds: 2
                  failureThreshold: 3
                livenessProbe:
                  exec:
                    command:
                      - /usr/bin/perl
                      - -MIO::Socket::UNIX
                      - -MSocket
                      - -e
                      - |
                        my $s = IO::Socket::UNIX->new(Type => SOCK_STREAM, Peer => "/host/run/multus/multus.sock") or exit 1;
                        print $s "GET /healthz HTTP/1.0\r\nHost: localhost\r\n\r\n" or exit 1;
                        my $line = <$s>;
                        exit(($line // "") =~ m{^HTTP/\d(?:\.\d)? 200\b} ? 0 : 1);
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
                resources:
                  requests:
                    cpu: "200m"
                    memory: "200Mi"
                  limits:
                    cpu: "200m"
                    memory: "1000Mi"
  - target:
      kind: CronJob
      name: descheduler-cronjob
    patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: descheduler-cronjob
      spec:
        schedule: "*/5 * * * *" # every 5 minutes
