---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No local namespace: — ClusterRole must stay cluster-scoped. Job/SA carry
# namespace: garage explicitly. Flux targetNamespace=garage also stamps namespaced
# objects; ClusterRole/ClusterRoleBinding are cluster-scoped and should pass.
resources:
  - pv.yaml
  - restic-orphan-cleanup-rbac.yaml
  - restic-orphan-cleanup-job.yaml
