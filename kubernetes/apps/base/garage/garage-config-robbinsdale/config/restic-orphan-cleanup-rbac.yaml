---
# One-shot RBAC for deleting orphan VolSync restic Secrets that still point at
# the purged Garage bucket alias `keiretsu` (removed 2026-06-16, 9bba495a2).
#
# ClusterRole (not per-namespace Role) because flux-system/garage-config sets
# targetNamespace=garage, which overrides in-manifest namespaces and collapses
# home/media Roles onto garage/restic-orphan-cleanup (ID conflict). A new
# garage-keys-robbinsdale overlay path failed Flate baseline validation.
#
# Blast radius is script-controlled: the Job allowlist re-verifies each Secret's
# RESTIC_REPOSITORY against /keiretsu/ + in-cluster Garage endpoint before
# delete. Remove after the Job Completes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: restic-orphan-cleanup
  namespace: garage
  labels:
    app.kubernetes.io/name: restic-orphan-cleanup
    app.kubernetes.io/component: retired-volsync-cleanup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: restic-orphan-cleanup-robbinsdale
  labels:
    app.kubernetes.io/name: restic-orphan-cleanup
    app.kubernetes.io/component: retired-volsync-cleanup
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: restic-orphan-cleanup-robbinsdale
  labels:
    app.kubernetes.io/name: restic-orphan-cleanup
    app.kubernetes.io/component: retired-volsync-cleanup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: restic-orphan-cleanup-robbinsdale
subjects:
  - kind: ServiceAccount
    name: restic-orphan-cleanup
    namespace: garage
