---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageReferenceGrant
metadata:
  name: cross-namespace-access
spec:
  from:
    - kind: GarageKey
      namespace: forgejo
    - kind: GarageBucket
      namespace: forgejo
    - kind: GarageKey
      namespace: keiretsu-top
    - kind: GarageBucket
      namespace: keiretsu-top
    - kind: GarageKey
      namespace: zot
    - kind: GarageBucket
      namespace: zot
    - kind: GarageKey
      namespace: immich
    - kind: GarageKey
      namespace: media
    - kind: GarageKey
      namespace: hermes
    - kind: GarageKey
      namespace: home
    # kopiur Repository for StP homeassistant-config (#695): the GarageKey in
    # home-assistant must reference GarageCluster garage/garage. Without this
    # the vgaragekey webhook denies it and the Kustomization never converges.
    - kind: GarageKey
      namespace: home-assistant
    - kind: GarageKey
      namespace: tailscale-examples
    - kind: GarageKey
      namespace: loki
    - kind: GarageBucket
      namespace: loki
    - kind: GarageKey
      namespace: tailscale
    - kind: GarageKey
      namespace: flux-system
    - kind: GarageKey
      namespace: mimir
    - kind: GarageKey
      namespace: tailscale-system

    - kind: GarageKey
      namespace: bhaiya
    - kind: GarageBucket
      namespace: bhaiya
    - kind: GarageKey
      namespace: woodpecker
    - kind: GarageKey
      namespace: teslamate
    - kind: GarageKey
      namespace: velero-system
    - kind: GarageKey
      namespace: firefly
