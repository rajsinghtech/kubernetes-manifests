---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: public
spec:
  telemetry:
    accessLog:
      settings:
        # A custom accessLog settings list replaces Envoy Gateway's default
        # setting. Keep it untyped so the default JSON route logger and its
        # unmatched-listener (NR) fallback remain in place.
        - sinks:
            - type: File
              file:
                path: /dev/stdout
        # Gateway port 22 is shifted to Envoy's unprivileged port 10022.
        # Envoy Gateway 1.9.1 has no listener-name selector; this listener
        # CEL match is therefore the bounded forgejo-ssh selector.
        - type: Listener
          matches:
            - "destination.port == 10022"
          format:
            type: JSON
            json:
              listener: "forgejo-ssh"
              gateway: "public"
              connection_id: "%CONNECTION_ID%"
              start_time: "%START_TIME%"
              duration: "%DURATION%"
              connection_termination_details: "%CONNECTION_TERMINATION_DETAILS%"
              downstream_detected_close_type: "%DOWNSTREAM_DETECTED_CLOSE_TYPE%"
              upstream_detected_close_type: "%UPSTREAM_DETECTED_CLOSE_TYPE%"
              downstream_local_close_reason: "%DOWNSTREAM_LOCAL_CLOSE_REASON%"
              upstream_local_close_reason: "%UPSTREAM_LOCAL_CLOSE_REASON%"
              downstream_transport_failure_reason: "%DOWNSTREAM_TRANSPORT_FAILURE_REASON%"
              upstream_transport_failure_reason: "%UPSTREAM_TRANSPORT_FAILURE_REASON%"
              downstream_remote_address: "%DOWNSTREAM_REMOTE_ADDRESS%"
              downstream_local_address: "%DOWNSTREAM_LOCAL_ADDRESS%"
              upstream_host: "%UPSTREAM_HOST%"
              upstream_local_address: "%UPSTREAM_LOCAL_ADDRESS%"
              bytes_received: "%BYTES_RECEIVED%"
              bytes_sent: "%BYTES_SENT%"
              response_flags: "%RESPONSE_FLAGS%"
          sinks:
            - type: File
              file:
                path: /dev/stdout
    metrics:
      prometheus:
        compression:
          type: Gzip
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        pod:
          priorityClassName: infra-high
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: public
      envoyService:
        # Cluster (not Local): UniFi ECMP advertises 10.169.10.15/32 from both
        # rei and kaji. With Local, a mid-flow hash flip lands packets on a node
        # with no established tuple and that node RSTs (#661/#677). Cluster lets
        # either node forward to either Envoy backend. Trade-off: backends see
        # the node IP (SNAT), not the real client — observability only; authZ is
        # Remote-Email / SSH key (see docs/incidents/677-*). Private and ts
        # gateways stay Local.
        externalTrafficPolicy: Local
        loadBalancerIP: ${CLUSTER_LOAD_BALANCER_CIDR%.*.*/*}.10.15
