---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-postgres
spec:
  inheritedMetadata:
    labels:
      app: forgejo-postgres
  instances: 2
  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
      dataChecksums: true
  storage:
    size: 10Gi
    storageClass: ceph-block-replicated
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: forgejo-postgres-s3-store
        serverName: forgejo-postgres
  backup:
    retentionPolicy: "30d"
  externalClusters:
    - name: forgejo-postgres-backup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: forgejo-postgres-s3-store
          serverName: forgejo-postgres
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: forgejo-postgres-s3-store
  namespace: forgejo
spec:
  configuration:
    destinationPath: s3://forgejo-postgres/${LOCATION}/
    endpointURL: http://${COMMON_S3_ENDPOINT}
    s3Credentials:
      accessKeyId:
        name: forgejo-postgres-s3
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: forgejo-postgres-s3
        key: AWS_SECRET_ACCESS_KEY
    wal:
      maxParallel: 8
  instanceSidecarConfiguration:
    env:
      - name: AWS_DEFAULT_REGION
        value: garage
  retentionPolicy: "30d"
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: forgejo-postgres-s3
  namespace: forgejo
spec:
  schedule: "0 15 2 * * *"
  immediate: true
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: forgejo-postgres
