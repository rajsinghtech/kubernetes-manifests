---
kube-state-metrics:
  # For kube-prometheus-stacks that are already installed and configured with
  # custom collectors, commenting out the collectors and extraArgs below will
  # retain any existing kube-state-metrics configuration.
  collectors:
    - certificatesigningrequests
    - configmaps
    - cronjobs
    - daemonsets
    - deployments
    - endpoints
    - horizontalpodautoscalers
    - ingresses
    - jobs
    - leases
    - limitranges
    - namespaces
    - networkpolicies
    - nodes
    - persistentvolumeclaims
    - persistentvolumes
    - poddisruptionbudgets
    - pods
    - replicasets
    - replicationcontrollers
    - resourcequotas
    - secrets
    - services
    - statefulsets
    - storageclasses
    - volumeattachments
  extraArgs: []
  rbac:
    extraRules:
      - apiGroups:
          - source.toolkit.fluxcd.io
          - kustomize.toolkit.fluxcd.io
          - helm.toolkit.fluxcd.io
          - notification.toolkit.fluxcd.io
          - image.toolkit.fluxcd.io
        resources:
          - gitrepositories
          - buckets
          - helmrepositories
          - helmcharts
          - ocirepositories
          - kustomizations
          - helmreleases
          - alerts
          - providers
          - receivers
          - imagerepositories
          - imagepolicies
          - imageupdateautomations
        verbs: [ "list", "watch" ]
      - apiGroups:
          - velero.io
        resources:
          - backups
          - podvolumebackups
          # Required for VeleroScheduleNeverBackedUp / MaintenanceStale (#2754).
          # Without these verbs kube-state-metrics silently omits the series and
          # the alerts can never fire even when the customResourceState config
          # lists Schedule and BackupRepository.
          - schedules
          - backuprepositories
        verbs: [ "list", "watch" ]
      - apiGroups:
          - postgresql.cnpg.io
        resources:
          - clusters
          - backups
        verbs: [ "list", "watch" ]
  customResourceState:
    enabled: true
    config:
      spec:
        resources:
          - groupVersionKind:
              group: kustomize.toolkit.fluxcd.io
              version: v1
              kind: Kustomization
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux Kustomization resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  exported_namespace: [ metadata, namespace ]
                  ready: [ status, conditions, "[type=Ready]", status ]
                  suspended: [ spec, suspend ]
                  revision: [ status, lastAppliedRevision ]
                  source_name: [ spec, sourceRef, name ]
          - groupVersionKind:
              group: helm.toolkit.fluxcd.io
              version: v2
              kind: HelmRelease
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux HelmRelease resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  exported_namespace: [ metadata, namespace ]
                  ready: [ status, conditions, "[type=Ready]", status ]
                  suspended: [ spec, suspend ]
                  revision: [ status, history, "0", chartVersion ]
                  chart_name: [ status, history, "0", chartName ]
                  chart_app_version: [ status, history, "0", appVersion ]
                  chart_ref_name: [ spec, chartRef, name ]
                  chart_source_name: [ spec, chart, spec, sourceRef, name ]
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: GitRepository
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux GitRepository resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  exported_namespace: [ metadata, namespace ]
                  ready: [ status, conditions, "[type=Ready]", status ]
                  suspended: [ spec, suspend ]
                  revision: [ status, artifact, revision ]
                  url: [ spec, url ]
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: Bucket
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux Bucket resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  exported_namespace: [ metadata, namespace ]
                  ready: [ status, conditions, "[type=Ready]", status ]
                  suspended: [ spec, suspend ]
                  revision: [ status, artifact, revision ]
                  endpoint: [ spec, endpoint ]
                  bucket_name: [ spec, bucketName ]
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: HelmRepository
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux HelmRepository resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  exported_namespace: [ metadata, namespace ]
                  ready: [ status, conditions, "[type=Ready]", status ]
                  suspended: [ spec, suspend ]
                  revision: [ status, artifact, revision ]
                  url: [ spec, url ]
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: HelmChart
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux HelmChart resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  exported_namespace: [ metadata, namespace ]
                  ready: [ status, conditions, "[type=Ready]", status ]
                  suspended: [ spec, suspend ]
                  revision: [ status, artifact, revision ]
                  chart_name: [ spec, chart ]
                  chart_version: [ spec, version ]
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: OCIRepository
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux OCIRepository resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  exported_namespace: [ metadata, namespace ]
                  ready: [ status, conditions, "[type=Ready]", status ]
                  suspended: [ spec, suspend ]
                  revision: [ status, artifact, revision ]
                  url: [ spec, url ]
          - groupVersionKind:
              group: notification.toolkit.fluxcd.io
              version: v1beta3
              kind: Alert
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux Alert resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  exported_namespace: [ metadata, namespace ]
                  suspended: [ spec, suspend ]
          - groupVersionKind:
              group: notification.toolkit.fluxcd.io
              version: v1beta3
              kind: Provider
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux Provider resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  exported_namespace: [ metadata, namespace ]
                  suspended: [ spec, suspend ]
          - groupVersionKind:
              group: notification.toolkit.fluxcd.io
              version: v1
              kind: Receiver
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux Receiver resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  exported_namespace: [ metadata, namespace ]
                  ready: [ status, conditions, "[type=Ready]", status ]
                  suspended: [ spec, suspend ]
                  webhook_path: [ status, webhookPath ]
          - groupVersionKind:
              group: velero.io
              version: v1
              kind: Backup
            metricNamePrefix: velero_cr
            labelsFromPath:
              namespace: [ metadata, namespace ]
              backup: [ metadata, name ]
              schedule: [ metadata, labels, velero.io/schedule-name ]
            metrics:
              - name: "backup_info"
                help: "The current phase of a Velero Backup custom resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      phase: [ status, phase ]
              - name: "backup_created_timestamp"
                help: "Unix creation timestamp of a Velero Backup custom resource."
                each:
                  type: Gauge
                  gauge:
                    path: [ metadata, creationTimestamp ]
              # status.warnings is how Velero records hostPath volume skips and
              # similar soft failures while still leaving phase=Completed (#695).
              - name: "backup_warnings"
                help: "Warning count on a Velero Backup custom resource (status.warnings)."
                each:
                  type: Gauge
                  gauge:
                    path: [ status, warnings ]
              - name: "backup_errors"
                help: "Error count on a Velero Backup custom resource (status.errors)."
                each:
                  type: Gauge
                  gauge:
                    path: [ status, errors ]
          - groupVersionKind:
              group: postgresql.cnpg.io
              version: v1
              kind: Cluster
            metricNamePrefix: cnpg_cr
            labelsFromPath:
              namespace: [ metadata, namespace ]
              cnpg_cluster: [ metadata, name ]
            metrics:
              - name: "cluster_info"
                help: "Information about a CloudNativePG Cluster custom resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
          - groupVersionKind:
              group: postgresql.cnpg.io
              version: v1
              kind: Backup
            metricNamePrefix: cnpg_cr
            labelsFromPath:
              namespace: [ metadata, namespace ]
              backup: [ metadata, name ]
              cnpg_cluster: [ spec, cluster, name ]
            metrics:
              - name: "backup_info"
                help: "The current phase of a CloudNativePG Backup custom resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      phase: [ status, phase ]
              - name: "backup_completed_timestamp"
                help: "Unix completion timestamp of a CloudNativePG Backup custom resource."
                each:
                  type: Gauge
                  gauge:
                    path: [ status, stoppedAt ]
          # Schedule CRs are required to catch schedules that never produce a
          # successful Backup (no velero_backup_last_successful_timestamp series).
          # VeleroBackupStale alone is blind to that case: forgejo-backup was
          # Enabled with lastBackup unset and would stay invisible until after
          # its first success created a timestamp series.
          - groupVersionKind:
              group: velero.io
              version: v1
              kind: Schedule
            metricNamePrefix: velero_cr
            labelsFromPath:
              namespace: [ metadata, namespace ]
              schedule: [ metadata, name ]
            metrics:
              - name: "schedule_info"
                help: "Phase and pause state of a Velero Schedule custom resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      phase: [ status, phase ]
                      paused: [ spec, paused ]
              - name: "schedule_created_timestamp"
                help: "Unix creation timestamp of a Velero Schedule custom resource."
                each:
                  type: Gauge
                  gauge:
                    path: [ metadata, creationTimestamp ]
              - name: "schedule_last_backup_timestamp"
                help: "Unix timestamp of Schedule.status.lastBackup when set."
                each:
                  type: Gauge
                  gauge:
                    path: [ status, lastBackup ]
          # BackupRepository phase=Ready can coexist with refused Kopia prune
          # (#575). Export lastMaintenanceTime so Ready-but-unmaintained is
          # observable without latching on a historical failure counter.
          - groupVersionKind:
              group: velero.io
              version: v1
              kind: BackupRepository
            metricNamePrefix: velero_cr
            labelsFromPath:
              namespace: [ metadata, namespace ]
              repository: [ metadata, name ]
              volume_namespace: [ spec, volumeNamespace ]
            metrics:
              - name: "backuprepository_info"
                help: "Phase of a Velero BackupRepository custom resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      phase: [ status, phase ]
              - name: "backuprepository_last_maintenance_timestamp"
                help: "Unix timestamp of BackupRepository.status.lastMaintenanceTime."
                each:
                  type: Gauge
                  gauge:
                    path: [ status, lastMaintenanceTime ]
          - groupVersionKind:
              group: velero.io
              version: v1
              kind: PodVolumeBackup
            metricNamePrefix: velero_cr
            labelsFromPath:
              namespace: [ metadata, namespace ]
              pod_volume_backup: [ metadata, name ]
              backup: [ metadata, labels, velero.io/backup-name ]
              node: [ spec, node ]
            metrics:
              - name: "podvolumebackup_info"
                help: "The current phase of a Velero PodVolumeBackup custom resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      phase: [ status, phase ]
              - name: "podvolumebackup_bytes_done"
                help: "Bytes reported as uploaded by a Velero PodVolumeBackup."
                each:
                  type: Gauge
                  gauge:
                    path: [ status, progress ]
                    valueFrom: [ bytesDone ]
              - name: "podvolumebackup_bytes_total"
                help: "Total bytes reported for a Velero PodVolumeBackup."
                each:
                  type: Gauge
                  gauge:
                    path: [ status, progress ]
                    valueFrom: [ totalBytes ]
