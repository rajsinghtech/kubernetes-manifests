---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-image-renderer
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana-image-renderer
  template:
    metadata:
      labels:
        app: grafana-image-renderer
      annotations:
        rendering/grafana: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
        - name: grafana-image-renderer
          image: docker.io/grafana/grafana-image-renderer:v5.12.3
          imagePullPolicy: IfNotPresent
          args: ["server", "--server.addr=:8081"]
          env:
            # Chromium needs considerably more headroom than the renderer's Go
            # process. The old 256Mi limit OOM-killed the pod when two Grafana
            # image requests overlapped.
            - name: GOMEMLIMIT
              value: 1GiB
            # v5 otherwise admits at least three browser requests, even when
            # cgroup memory is too small. Keep two useful concurrent renders
            # while bounding Chromium's peak memory deterministically.
            - name: RATE_LIMIT_MIN_LIMIT
              value: "1"
            - name: RATE_LIMIT_MAX_LIMIT
              value: "2"
            # Grafana dashboards continue lightweight frontend/network work
            # after their data queries settle. Keep waiting for queries, but
            # bound the auxiliary readiness checks so rendering does not fail
            # at the renderer's 30-second default.
            - name: BROWSER_READINESS_TIMEOUT
              value: 60s
            - name: BROWSER_READINESS_GIVE_UP_ON_ALL_QUERIES
              value: 20s
            - name: BROWSER_READINESS_NETWORK_IDLE_TIMEOUT
              value: 10s
            - name: BROWSER_READINESS_DOM_HASHCODE_TIMEOUT
              value: 10s
          ports:
            - name: renderer
              containerPort: 8081
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 2Gi
          readinessProbe:
            httpGet:
              port: renderer
              path: /healthz
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              port: renderer
              path: /healthz
            initialDelaySeconds: 15
            periodSeconds: 20
