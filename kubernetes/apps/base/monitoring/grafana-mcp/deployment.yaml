---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana-mcp
          image: docker.io/grafana/mcp-grafana:1.4.0-alpine@sha256:2e2b870aa12e88ff69e0c9d90269b48e0d71885434056464b98197f2ca4a20eb
          imagePullPolicy: IfNotPresent
          command:
            - /app/mcp-grafana
          args:
            - --transport=streamable-http
            - --address=:8000
            # The listener is isolated by the Cilium policy below. Allowing
            # arbitrary Host values keeps Kubernetes probes, Prometheus, and
            # Bhaiya's cluster-DNS client compatible with upstream validation.
            - --allowed-hosts=*
            - --metrics
            - --disable-write
            - --slow-request-threshold=5s
          env:
            - name: GRAFANA_URL
              value: http://grafana-service.monitoring.svc.cluster.local:3000
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE
              value: /var/run/secrets/grafana/token
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: grafana-token
              mountPath: /var/run/secrets/grafana
              readOnly: true
      volumes:
        - name: grafana-token
          secret:
            secretName: grafana-mcp-token
