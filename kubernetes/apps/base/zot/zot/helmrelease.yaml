---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zot
spec:
  interval: 30m
  chart:
    spec:
      chart: zot
      version: 0.1.124
      sourceRef:
        kind: HelmRepository
        name: zot
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # OCI upload UUIDs must remain on one Zot process for the POST/PATCH/PUT
  # sequence. With S3 storage, sending a later request to the other replica can
  # hit its zero-size upload view and make a valid client digest fail. The chart
  # does not expose Service affinity, so retain two replicas and patch it after
  # rendering instead of reducing availability to one replica.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: zot
            patch: |
              - op: add
                path: /spec/sessionAffinity
                value: ClientIP
              - op: add
                path: /spec/sessionAffinityConfig
                value:
                  clientIP:
                    timeoutSeconds: 10800
  values:
    replicaCount: 2
    image:
      tag: "v2.1.20"
    startupProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 30
    service:
      type: ClusterIP
      port: 5000
    persistence: false
    mountConfig: true
    mountSecret: true
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 2Gi
    env:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: garage-s3-auth
            key: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: garage-s3-auth
            key: AWS_SECRET_ACCESS_KEY
    # sync must stay disabled unless a registry has OnDemand:true *and* we accept
    # the OCI /referrers + missing-manifest gate. isSyncOnDemandEnabled is true
    # whenever extensions.sync.enable and Controller.SyncOnDemand != nil — even
    # with every registry OnDemand:false (EnableSyncExtension still returns an
    # empty BaseOnDemand). That leaves "syncing on demand" logs on local corp/*
    # repos. Poll sync for ghcr.io/rajsinghtech/** is also failing unauthorized
    # without credentials, so enable=false removes a dead generator. Residual:
    # storage GetReferrers still O(n) S3-scans the repo index (~14s on corp/bhaiya);
    # GraphQL Referrers via MetaDB stays fast. Real OCI referrers speed needs
    # upstream MetaDB-backed GetReferrers or a smaller repo.
    configFiles:
      config.json: |-
        {
          "storage": {
            "rootDirectory": "/var/lib/registry",
            "dedupe": false,
            "gc": true,
            "gcDelay": "1h",
            "gcInterval": "6h",
            "remoteCache": true,
            "cacheDriver": {
              "name": "redis",
              "addr": ["zot-cache:6379"],
              "dial_timeout": "10s",
              "read_timeout": "60s",
              "write_timeout": "60s",
              "keyprefix": "zot"
            },
            "retention": {
              "policies": [{
                "repositories": ["**"],
                "deleteReferrers": true,
                "deleteUntagged": true,
                "keepTags": [{
                  "mostRecentlyPushedCount": 10,
                  "mostRecentlyPulledCount": 10,
                  "pulledWithin": "720h",
                  "pushedWithin": "720h"
                }]
              }]
            },
            "storageDriver": {
              "name": "s3",
              "rootdirectory": "/zot",
              "region": "garage",
              "regionendpoint": "http://${COMMON_S3_ENDPOINT}",
              "bucket": "zot",
              "forcepathstyle": true,
              "secure": false,
              "skipverify": false,
              "multipartcopymaxconcurrency": 16
            }
          },
          "http": {
            "address": "0.0.0.0",
            "port": "5000",
            "readTimeout": "30m",
            "writeTimeout": "30m",
            "compat": ["docker2s2"],
            "auth": {
              "htpasswd": { "path": "/secret/htpasswd" }
            },
            "accessControl": {
              "repositories": {
                "**": {
                  "policies": [{
                    "users": ["admin"],
                    "actions": ["read", "create", "update", "delete"]
                  }],
                  "anonymousPolicy": ["read", "create", "update"],
                  "defaultPolicy": []
                }
              },
              "metrics": {
                "anonymousPolicy": ["read"]
              }
            }
          },
          "extensions": {
            "search": { "enable": true },
            "ui": { "enable": true },
            "metrics": { "enable": true },
            "sync": {
              "enable": false,
              "downloadDir": "/var/lib/registry/sync-tmp",
              "registries": [{
                "urls": ["https://ghcr.io"],
                "content": [{
                  "prefix": "rajsinghtech/**"
                }],
                "onDemand": false,
                "pollInterval": "6h",
                "tlsVerify": true
              }]
            }
          },
          "log": { "level": "info" }
        }
    secretFiles:
      htpasswd: "${COMMON_OCI}"
