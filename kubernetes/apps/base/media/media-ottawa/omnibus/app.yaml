---
# Omnibus must run at exactly 1 replica — login lockout is in-memory per-process
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnibus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omnibus
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes-excludes: media
      labels:
        app: omnibus
    spec:
      initContainers:
        - name: init-dirs
          image: busybox:1.38
          command: ["sh", "-c", "mkdir -p /config/cache /config/logs /config/backups && chown -R 1000:1000 /config"]
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: omnibus
          # renovate: datasource=docker depName=ghcr.io/kbpersonal/omnibus
          image: ghcr.io/kbpersonal/omnibus:v1.4.4.4@sha256:d27caa5e50052dc547ce8e26ce8486e0f055d2f4635d2c7f3d0b7b12e1413894
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: TZ
              value: "${TIMEZONE}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: omnibus-postgres-app
                  key: uri
            - name: REDIS_URL
              value: redis://dragonfly-omnibus:6379
            - name: OMNIBUS_REDIS_URL
              value: redis://dragonfly-omnibus:6379
            - name: NEXTAUTH_URL
              value: "https://omnibus.${CLUSTER_DOMAIN}"
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: omnibus-sensitive-secret
                  key: NEXTAUTH_SECRET
            - name: OMNIBUS_CONFIG_DIR
              value: /config
            - name: OMNIBUS_CACHE_DIR
              value: /config/cache
            - name: OMNIBUS_LOGS_DIR
              value: /config/logs
            - name: OMNIBUS_BACKUPS_DIR
              value: /config/backups
            - name: OMNIBUS_WATCHED_DIR
              value: /media-share/omnibus-watched
            - name: OMNIBUS_AWAITING_MATCH_DIR
              value: /media-share/omnibus-unmatched
            - name: OMNIBUS_MAX_UPLOAD_MB
              value: "2048"
            # Manga acquisition (killinit fork): requests detected as manga are resolved against
            # Suwayomi's configured sources instead of the comic indexers, then Komga is told which
            # way the series reads. See docs/stack-evaluation.md in the fork.
            - name: SUWAYOMI_URL
              value: http://suwayomi.media.svc:4567
            - name: SUWAYOMI_DOWNLOADS_PATH
              value: /media-share/suwayomi-manga
            - name: KOMGA_URL
              value: http://komga.media.svc:25600
            # Series metadata PATCH is ADMIN-only in Komga; this key is already admin-scoped and is
            # the same one both komga-watcher sidecars use to trigger library scans.
            - name: KOMGA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: komga-scan-secret
                  key: api-key
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media-share
        - name: omnibus-engine
          # renovate: datasource=docker depName=ghcr.io/kbpersonal/omnibus-engine
          image: ghcr.io/kbpersonal/omnibus-engine:v1.4.4.4@sha256:42d7013c4035bd2bc1c9ab51515602fe44d18b70ba3a35934825ca241656dd5d
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: omnibus-postgres-app
                  key: uri
            - name: REDIS_URL
              value: redis://dragonfly-omnibus:6379
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: omnibus-sensitive-secret
                  key: NEXTAUTH_SECRET
            - name: OMNIBUS_NODE_URL
              value: http://omnibus:3000
            - name: OMNIBUS_WATCHED_DIR
              value: /media-share/omnibus-watched
            - name: OMNIBUS_AWAITING_MATCH_DIR
              value: /media-share/omnibus-unmatched
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media-share
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: omnibus-config
        - name: media
          persistentVolumeClaim:
            claimName: media-share
---
apiVersion: v1
kind: Service
metadata:
  name: omnibus
spec:
  selector:
    app: omnibus
  ports:
    - name: http
      port: 3000
      protocol: TCP
      targetPort: 3000
