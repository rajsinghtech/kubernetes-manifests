---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: suwayomi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: suwayomi
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes-excludes: media
      labels:
        app: suwayomi
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: fix-permissions
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              chown -R 1000:1000 /data
              CONF=/data/server.conf
              if [ -f "$CONF" ]; then
                sed -i '/^server\.databaseUrl/d' "$CONF"
                sed -i '/^server\.databaseUsername/d' "$CONF"
                sed -i '/^server\.databasePassword/d' "$CONF"
                sed -i 's|server\.downloadsPath = ""|server.downloadsPath = "/media-share/suwayomi-manga"|' "$CONF"
              fi
          volumeMounts:
            - name: config
              mountPath: /data
          securityContext:
            runAsUser: 0
      containers:
        - name: suwayomi
          image: ghcr.io/suwayomi/suwayomi-server:v2.3.2359
          ports:
            - name: http
              containerPort: 4567
              protocol: TCP
          env:
            - name: TZ
              value: "${TIMEZONE}"
            - name: EXTENSION_STORES
              value: '["https://raw.githubusercontent.com/keiyoushi/extensions/repo/index.min.json"]'
            - name: DATABASE_TYPE
              value: POSTGRESQL
            - name: DATABASE_URL
              value: "postgresql://suwayomi-postgres-rw.media:5432/suwayomi"
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: suwayomi-postgres-app
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: suwayomi-postgres-app
                  key: password
            - name: DOWNLOAD_AS_CBZ
              value: "true"
            - name: AUTO_DOWNLOAD_CHAPTERS
              value: "true"
            - name: AUTO_DOWNLOAD_NEW_CHAPTERS_LIMIT
              value: "5"
            - name: AUTO_DOWNLOAD_IGNORE_REUPLOADS
              value: "true"
            - name: MAX_SOURCES_IN_PARALLEL
              value: "3"
            - name: UPDATE_INTERVAL
              value: "24"
            - name: UPDATE_EXCLUDE_COMPLETED
              value: "true"
            - name: FLARESOLVERR_ENABLED
              value: "true"
            - name: FLARESOLVERR_URL
              value: http://flaresolverr.media.svc:8191
            - name: KOREADER_SYNC_STRATEGY_FORWARD
              value: PROMPT
            - name: OPDS_SKIP_CHAPTER_METADATA_FEED
              value: "true"
            - name: AUTH_MODE
              value: none
            # Suwayomi writes chapters here; Komga reads this path read-only
            - name: SUWAYOMI_DOWNLOADS_PATH
              value: /media-share/suwayomi-manga
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: config
              mountPath: /home/suwayomi/.local/share/Tachidesk
            - name: media
              mountPath: /media-share
        # Komga scan watcher — polls suwayomi-manga for new/changed CBZs,
        # debounces on mtime settle, then fires POST scan to Komga.
        # Must be a sidecar: inotify does not cross an SMB mount, so a
        # standalone watcher deployment would see nothing.
        - name: komga-watcher
          image: ghcr.io/gotson/komga:1.26.3
          command:
            - /bin/sh
            - -c
            - |
              log() {
                printf '%s [komga-watcher] [%s] %s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$1" "$2"
              }
              log_changed_files() {
                find "$WATCH_DIR" -type f -name "*.cbz" -newer /tmp/.last_scan -print 2>/dev/null |
                  while IFS= read -r file; do
                    log INFO "changed_file=$file"
                  done
              }
              WATCH_DIR=/media-share/suwayomi-manga
              KOMGA_URL=http://komga.media.svc:25600
              KOMGA_API_KEY="$KOMGA_SCAN_API_KEY"
              LIBRARY_ID="$KOMGA_MANGA_LIBRARY_ID"
              DEBOUNCE=30
              POLL_INTERVAL=15
              # Seed the mtime reference: `find -newer` on a missing file errors out and
              # (stderr swallowed) counts zero forever, so the scan below never fires.
              touch /tmp/.last_scan
              log INFO "watcher started watch_dir=$WATCH_DIR library_id=$LIBRARY_ID poll_interval_seconds=$POLL_INTERVAL debounce_seconds=$DEBOUNCE"
              while true; do
                found=$(find "$WATCH_DIR" -type f -name "*.cbz" -newer /tmp/.last_scan 2>/dev/null | wc -l)
                if [ "$found" -gt "0" ]; then
                  log INFO "changes detected changed_file_count=$found"
                  log_changed_files
                  log INFO "waiting for files to settle delay_seconds=$DEBOUNCE"
                  sleep "$DEBOUNCE"
                  still=$(find "$WATCH_DIR" -type f -name "*.cbz" -newer /tmp/.last_scan 2>/dev/null | wc -l)
                  if [ "$still" -gt "0" ]; then
                    log INFO "settled changes changed_file_count=$still"
                    log_changed_files
                    log INFO "requesting library scan library_id=$LIBRARY_ID changed_file_count=$still"
                    if wget -q --method=POST \
                      --header="X-API-Key: $KOMGA_API_KEY" \
                      "$KOMGA_URL/api/v1/libraries/$LIBRARY_ID/scan" \
                      -O /dev/null; then
                      touch /tmp/.last_scan
                      log INFO "library scan triggered library_id=$LIBRARY_ID changed_file_count=$still"
                    else
                      log ERROR "library scan request failed library_id=$LIBRARY_ID changed_file_count=$still"
                    fi
                  else
                    log INFO "changes no longer present after settle delay; scan skipped"
                  fi
                fi
                sleep "$POLL_INTERVAL"
              done
          env:
            - name: KOMGA_SCAN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: komga-scan-secret
                  key: api-key
            - name: KOMGA_MANGA_LIBRARY_ID
              valueFrom:
                secretKeyRef:
                  name: komga-scan-secret
                  key: manga-library-id
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: media
              mountPath: /media-share
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: suwayomi-config
        - name: media
          persistentVolumeClaim:
            claimName: media-share
---
apiVersion: v1
kind: Service
metadata:
  name: suwayomi
spec:
  selector:
    app: suwayomi
  ports:
    - name: http
      port: 4567
      protocol: TCP
      targetPort: 4567
