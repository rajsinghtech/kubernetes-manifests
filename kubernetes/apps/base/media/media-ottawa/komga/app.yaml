---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: komga
spec:
  replicas: 1
  selector:
    matchLabels:
      app: komga
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes: config
        backup.velero.io/backup-volumes-excludes: media
      labels:
        app: komga
    spec:
      containers:
        - name: komga
          image: ghcr.io/gotson/komga:1.26.3
          ports:
            - name: http
              containerPort: 25600
              protocol: TCP
          env:
            - name: TZ
              value: "${TIMEZONE}"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx512m"
            - name: SERVER_PORT
              value: "25600"
            - name: KOMGA_CONFIG_DIR
              value: /config
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_TINYAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: komga-oidc-secret
                  key: client-id
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_TINYAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: komga-oidc-secret
                  key: client-secret
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_TINYAUTH_CLIENT_NAME
              value: "tinyauth"
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_TINYAUTH_SCOPE
              value: "openid,profile,email"
            - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_TINYAUTH_ISSUER_URI
              value: "https://auth.keiretsu.top"
            - name: KOMGA_OAUTH2_ACCOUNT_CREATION
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media-share
              readOnly: true
        # Komga scan watcher for omnibus-comics — polls for new/changed CBZs,
        # debounces, fires POST scan. Sidecar because inotify does not cross SMB.
        - name: komga-watcher
          image: ghcr.io/gotson/komga:1.26.3
          command:
            - /bin/sh
            - -c
            - |
              log() {
                printf '%s [komga-watcher] [%s] %s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$1" "$2"
              }
              log_changed_files() {
                find "$WATCH_DIR" -type f -name "*.cbz" -newer /tmp/.last_scan -print 2>/dev/null |
                  while IFS= read -r file; do
                    log INFO "changed_file=$file"
                  done
              }
              WATCH_DIR=/media-share/omnibus-comics
              KOMGA_URL=http://localhost:25600
              KOMGA_API_KEY="$KOMGA_SCAN_API_KEY"
              LIBRARY_ID="$KOMGA_COMICS_LIBRARY_ID"
              DEBOUNCE=30
              POLL_INTERVAL=15
              touch /tmp/.last_scan
              log INFO "watcher started watch_dir=$WATCH_DIR library_id=$LIBRARY_ID poll_interval_seconds=$POLL_INTERVAL debounce_seconds=$DEBOUNCE"
              while true; do
                found=$(find "$WATCH_DIR" -type f -name "*.cbz" -newer /tmp/.last_scan 2>/dev/null | wc -l)
                if [ "$found" -gt "0" ]; then
                  log INFO "changes detected changed_file_count=$found"
                  log_changed_files
                  log INFO "waiting for files to settle delay_seconds=$DEBOUNCE"
                  sleep "$DEBOUNCE"
                  still=$(find "$WATCH_DIR" -type f -name "*.cbz" -newer /tmp/.last_scan 2>/dev/null | wc -l)
                  if [ "$still" -gt "0" ]; then
                    log INFO "settled changes changed_file_count=$still"
                    log_changed_files
                    log INFO "requesting library scan library_id=$LIBRARY_ID changed_file_count=$still"
                    if wget -q --method=POST \
                      --header="X-API-Key: $KOMGA_API_KEY" \
                      "$KOMGA_URL/api/v1/libraries/$LIBRARY_ID/scan" \
                      -O /dev/null; then
                      touch /tmp/.last_scan
                      log INFO "library scan triggered library_id=$LIBRARY_ID changed_file_count=$still"
                    else
                      log ERROR "library scan request failed library_id=$LIBRARY_ID changed_file_count=$still"
                    fi
                  else
                    log INFO "changes no longer present after settle delay; scan skipped"
                  fi
                fi
                sleep "$POLL_INTERVAL"
              done
          env:
            - name: KOMGA_SCAN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: komga-scan-secret
                  key: api-key
            - name: KOMGA_COMICS_LIBRARY_ID
              valueFrom:
                secretKeyRef:
                  name: komga-scan-secret
                  key: comics-library-id
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: media
              mountPath: /media-share
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: komga-config
        - name: media
          persistentVolumeClaim:
            claimName: media-share
          readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: komga
spec:
  selector:
    app: komga
  ports:
    - name: http
      port: 25600
      protocol: TCP
      targetPort: 25600
