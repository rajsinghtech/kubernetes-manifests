---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shelfmark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shelfmark
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes: config
        backup.velero.io/backup-volumes-excludes: media
      labels:
        app: shelfmark
    spec:
      containers:
        - name: shelfmark
          image: ghcr.io/calibrain/shelfmark:v1.3.15
          ports:
            - name: http
              containerPort: 8084
              protocol: TCP
          env:
            - name: TZ
              value: "${TIMEZONE}"
            - name: CONFIG_DIR
              value: /config
            - name: TMP_DIR
              value: /tmp/shelfmark
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media-share
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: shelfmark-config
        - name: media
          persistentVolumeClaim:
            claimName: media-share
---
apiVersion: v1
kind: Service
metadata:
  name: shelfmark
spec:
  selector:
    app: shelfmark
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8084
