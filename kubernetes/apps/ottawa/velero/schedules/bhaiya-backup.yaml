---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: bhaiya-backup
  namespace: velero-system
  labels:
    keiretsu.top/volume-data-required: "true"
spec:
  schedule: "0 8 * * *"
  template:
    ttl: 168h
    includedNamespaces:
      - bhaiya
    defaultVolumesToFsBackup: true
    # Skip emptyDir (scratch/hermes-managed). Durable PVC failures still page.
    resourcePolicy:
      kind: configmap
      name: fs-backup-resource-policy
