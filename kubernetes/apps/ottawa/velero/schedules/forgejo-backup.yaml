---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: forgejo-backup
  namespace: velero-system
spec:
  schedule: "0 10 * * *"
  template:
    ttl: 720h
    storageLocation: garage
    includedNamespaces:
      - forgejo
    defaultVolumesToFsBackup: true
    resourcePolicy:
      kind: configmap
      name: fs-backup-resource-policy
