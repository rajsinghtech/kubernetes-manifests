---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kopiur-velero-home-restore-projection
  namespace: flux-system
spec:
  targetNamespace: velero-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: kopiur-velero-home-restore-projection
      app.kubernetes.io/part-of: kopiur
  dependsOn:
    - name: kopiur
    - name: kopiur-velero-home-restore-proof
  path: ./kubernetes/apps/base/kopiur/velero-home-restore-projection
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubernetes-manifests
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 10m
