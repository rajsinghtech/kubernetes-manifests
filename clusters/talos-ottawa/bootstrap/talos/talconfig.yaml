# renovate: datasource=github-releases depName=budimanjojo/talhelper
---
# renovate: datasource=docker depName=ghcr.io/siderolabs/installer
talosVersion: v1.13.7
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.36.3
clusterName: "k8s.killinit.internal"
endpoint: https://k8s.killinit.internal:6443
allowSchedulingOnMasters: true
allowSchedulingOnControlPlanes: true
clusterPodNets:
  - "10.3.0.0/16"
clusterSvcNets:
  - "10.2.0.0/16"

additionalApiServerCertSans:
  - "192.168.169.25"
  - "default-kubernetes-ottawa-ingress.keiretsu.ts.net"
  - "kubernetes-ottawa.keiretsu.ts.net"
  - "kubernetes.ottawa.rajsingh.info"
  - "kubernetes-ottawa.default.svc.cluster.local"
  - 127.0.0.1 # KubePrism

additionalMachineCertSans:
  - "192.168.169.25"
  - "k8s.killinit.internal"  # Needed for talosctl -e k8s.killinit.internal
  - "default-kubernetes-ottawa-ingress.keiretsu.ts.net"
  - "kubernetes-ottawa.keiretsu.ts.net"
  - "kubernetes.ottawa.rajsingh.info"
  - "kubernetes-ottawa.default.svc.cluster.local"
  - 127.0.0.1 # KubePrism

# Disable built-in Flannel to use Cilium
cniConfig:
  name: none

# Per-node specific configuration
nodes:
  ###################################################################
  - hostname: "rei"
    ipAddress: "192.168.169.118"
    installDiskSelector:
      serial: "50026B7686F78587" # Kingston SNV3S 1TB
    controlPlane: true
    networkInterfaces:
      - interface: bond0
        bond:
          deviceSelectors:
            - permanentAddr: "38:05:25:36:56:39"  # enp5s0f0np0 - X710 SFP+ port 0
            - permanentAddr: "38:05:25:36:56:3a"  # enp5s0f1np1 - X710 SFP+ port 1
          mode: 802.3ad
          xmitHashPolicy: layer3+4
          lacpRate: fast
          miimon: 100
          updelay: 200
          downdelay: 200
        dhcp: true
        vip:
          ip: "192.168.169.25"
  ###################################################################
  - hostname: "asuka"
    ipAddress: "192.168.169.117"
    installDiskSelector:
      serial: "50026B7686F79D0F"
    controlPlane: true
    networkInterfaces:
      - interface: bond0
        bond:
          deviceSelectors:
            - permanentAddr: "38:05:25:36:56:05"  # enp5s0f0np0 - X710 SFP+ port 0
            - permanentAddr: "38:05:25:36:56:06"  # enp5s0f1np1 - X710 SFP+ port 1
          mode: 802.3ad
          xmitHashPolicy: layer3+4
          lacpRate: fast
          miimon: 100
          updelay: 200
          downdelay: 200
        dhcp: true
        vip:
          ip: "192.168.169.25"
  ###################################################################
  - hostname: "kaji"
    ipAddress: "192.168.169.119"
    installDiskSelector:
      serial: "50026B7686F78574"
    controlPlane: true
    networkInterfaces:
      - interface: bond0
        bond:
          deviceSelectors:
            - permanentAddr: "38:05:25:36:49:ad"  # enp5s0f0np0 - X710 SFP+ port 0
            - permanentAddr: "38:05:25:36:49:ae"  # enp5s0f1np1 - X710 SFP+ port 1
          mode: 802.3ad
          xmitHashPolicy: layer3+4
          lacpRate: fast
          miimon: 100
          updelay: 200
          downdelay: 200
        dhcp: true
        vip:
          ip: "192.168.169.25"
  ###################################################################
  - hostname: "shiro"
    ipAddress: "192.168.169.116"
    installDiskSelector:
      serial: "2316E6CC4FC6" # Crucial P3 CT500P3SSD8 500GB
    controlPlane: false
    nodeLabels:
      workload-class: specialized
    schematic:
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/gvisor
            - siderolabs/i915
            - siderolabs/intel-ucode
            - siderolabs/kata-containers
            - siderolabs/nut-client
            - siderolabs/binfmt-misc
            - siderolabs/util-linux-tools
        extraKernelArgs:
          - apparmor=0
          - init_on_alloc=0
          - init_on_free=0
          - intel_idle.max_cstate=0
          - intel_iommu=on
          - iommu=pt
          - mitigations=off
          - security=none
          - talos.auditd.disabled=1
          - net.ifnames=0
          - cpufreq.default_governor=performance
          - talos.logging.kernel=tcp://10.169.69.51:5170/
    networkInterfaces:
      - interface: bond0
        bond:
          deviceSelectors:
            - permanentAddr: "58:47:ca:77:73:22"  # eth2 - X710 SFP+ port 0
            - permanentAddr: "58:47:ca:77:73:23"  # eth3 - X710 SFP+ port 1
          mode: 802.3ad
          xmitHashPolicy: layer3+4
          lacpRate: fast
          miimon: 100
          updelay: 200
          downdelay: 200
        dhcp: true
    patches:
      - "@./patches/node/shiro-intel.yaml"

# Global patches
patches:
  - "@./patches/global/cluster-discovery.yaml"
  - "@./patches/global/containerd.yaml"
  - "@./patches/global/disable-search-domain.yaml"
  - "@./patches/global/cpu-performance.yaml"
  - "@./patches/global/hostdns.yaml"
  - "@./patches/global/kubelet.yaml"
  - "@./patches/global/local-path-provisioner.yaml"
  - "@./patches/global/metrics-server.yaml"
  - "@./patches/global/udev.yaml"
  - "@./patches/global/sysctls.yaml"
  - "@./patches/global/machine-logging.yaml"

# Control plane nodes config
controlPlane:
  extensionServices:
    - name: nut-client
      configFiles:
        - content: |
            # Placeholder configuration - update when NUT server is available
            # MONITOR format: MONITOR <system> <powervalue> <username> <password> <type>
            # Example: MONITOR ups@192.168.1.100 1 monuser secret slave

            # Using localhost as placeholder to allow service to start
            MONITOR ups@localhost 1 monuser pass slave
            SHUTDOWNCMD "/sbin/poweroff"

            # Set high warning time to avoid spam until server is configured
            NOCOMMWARNTIME 86400
          mountPath: /usr/local/etc/nut/upsmon.conf

  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/amd-ucode
          - siderolabs/amdgpu
          - siderolabs/gvisor
          - siderolabs/kata-containers
          - siderolabs/nut-client
          - siderolabs/binfmt-misc
          - siderolabs/util-linux-tools
      extraKernelArgs:
        - apparmor=0
        - init_on_alloc=0
        - init_on_free=0
        - amd_iommu=on
        - amd_pstate=active
        - iommu=pt
        - pcie_aspm=off
        - mitigations=off
        - security=none
        - talos.auditd.disabled=1
        - net.ifnames=0
        - cpufreq.default_governor=performance
        - talos.logging.kernel=tcp://10.169.69.51:5170/

  patches:
    - "@./patches/controller/api-access.yaml"
    - "@./patches/controller/amd.yaml"
    - "@./patches/controller/disable-proxy.yaml"
    - "@./patches/controller/kubelet-certs.yaml"
    - "@./patches/controller/etcd-metrics-patch.yaml"
    - "@./patches/controller/pod-security.yaml"

# Worker nodes config
worker:
  extensionServices:
    - name: nut-client
      configFiles:
        - content: |
            MONITOR ups@localhost 1 monuser pass slave
            SHUTDOWNCMD "/sbin/poweroff"
            NOCOMMWARNTIME 86400
          mountPath: /usr/local/etc/nut/upsmon.conf
  patches: []
